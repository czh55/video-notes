.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>一个视频让你学会打光技巧</h1>
  <div class="meta"><span class="tag tag-blue">打光</span><span class="tag tag-green">Top Light</span><span class="tag tag-orange">Butterfly</span><span class="tag tag-purple">Key Light</span><span class="tag tag-gray">时长 20秒</span><span class="tag tag-gray">理性分析 · 人像灯位</span></div>
  <a class="source-link" href="https://xhslink.cn/o/BqPHj1GgRI">原视频</a>
  <div class="summary-line">核心判断：20秒用红叉/绿勾教完三件事——正顶光毁脸、蝴蝶光要灯在面前高位、主光斜前才立得住；口播失效，证据全在画面标签。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">Top Light + 红叉</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">Butterfly 错例/对例</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">Key Light + 绿勾</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>灯放哪脸才好看</div><span class="arrow">→</span><div class="node-green">证据<br/>顶光硬影 vs 前置主光</div><span class="arrow">→</span><div class="node-orange">判断<br/>忌正顶，取面前高位</div><span class="arrow">→</span><div class="node-blue">行动<br/>灯前移再定风格</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：有大灯就够。纠偏：正上方大灯=Top Light红叉。</p><p>误解：蝴蝶光=任何顶光。纠偏：要对出鼻下小蝶影，灯需在面前高位。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：灯位对错图鉴</h3>
      <p>同一人同一场景，只改灯位与标签，用红叉绿勾代替讲解。</p>
      <div class="quote">Top Light / Butterfly / Key Light</div>
      <div class="relation">视觉记忆优先于名词背诵。</div>
    </div>
    <div class="card card-green">
      <h3>关键操作：灯从顶移到前</h3>
      <p>顶光眼窝死黑；前移后鼻下蝶影、面部层次回来。</p>
      <div class="quote">Key Light✓</div>
      <div class="relation">先解决「能不能看清脸」。</div>
    </div>
    <div class="card card-orange">
      <h3>证据边界：ASR不可用</h3>
      <p>Whisper 仅1条乱码；全文依画面字幕与符号重建。</p>
      <div class="quote">（无有效口播）</div>
      <div class="relation">脚注：依据画面重建。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>未展开柔光箱尺寸、功率与色温。</li><li>Butterfly 对错切换极快，需暂停逐帧看。</li></ul><div class="pitfall">客厅顶灯当主光拍人像。</div><div class="pitfall">灯在头顶却自称蝴蝶光。</div><div class="pitfall">忽略主光方向只堆氛围灯。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>正顶光优先排除。</li><li>蝴蝶光/主光都要「在面前」。</li><li>符号教学适合极短视频。</li></ul><h3>行动清单</h3><ol><li>自拍前把灯移到脸前方45°高位。</li><li>看鼻下有无小蝶影。</li><li>眼窝仍黑就继续前移灯。</li></ol><h3>关键认知转变</h3><p>从「有灯就行」转向「灯在脸的哪一侧上方」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 20秒</div>
</div>
    </div>
  </foreignObject>
</svg>
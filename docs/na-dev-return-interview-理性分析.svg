.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="root-wrap"><div class="container">
  <h1>聊聊北美程序员回国面试！</h1>
  <div class="meta">
    <span class="tag tag-blue">北美回国</span><span class="tag tag-blue">AI初创</span><span class="tag tag-blue">面试</span><span class="tag tag-blue">简历深挖</span><span class="tag tag-blue">LeetCode</span><span class="tag tag-blue">职场</span>
    <span class="tag tag-gray">2分54秒</span>
    <span class="tag tag-purple">理性分析 · 职场求职</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/39NlChj46LH">原视频（小红书短链）</a>
  <div class="summary-line">核心命题：北美程序员回国后，面试真正考什么？作者近期经历显示：大厂仍偏简历深挖 + 算法；主战场 AI 初创则常先上超长项目笔试（用 AI 设计并交付），再考多面能力与创业价值观。可迁移行动是把简历故事讲到滚瓜烂熟；中美差异在于国内更抠「为什么 / 如何复用」。证据层级为个人近期经历口播，非全行业抽样。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">续集开场：回国求职故事</div></div><div class="timeline-item"><div class="timeline-time">00:22</div><div class="timeline-text">主题：最近面试在面什么</div></div><div class="timeline-item"><div class="timeline-time">00:34</div><div class="timeline-text">大厂：深挖简历 + LeetCode</div></div><div class="timeline-item"><div class="timeline-time">00:42</div><div class="timeline-text">转向：AI 初创为主战场</div></div><div class="timeline-item"><div class="timeline-time">00:53</div><div class="timeline-text">先笔试再面试；可长达近 10 小时</div></div><div class="timeline-item"><div class="timeline-time">01:04</div><div class="timeline-text">题型：公司大项目 → AI 设计落地交付</div></div><div class="timeline-item"><div class="timeline-time">01:15</div><div class="timeline-text">面试主轴：简历深挖 + 场景题</div></div><div class="timeline-item"><div class="timeline-time">01:33</div><div class="timeline-text">能力观：多边形（工程/产品/业务/AI）</div></div><div class="timeline-item"><div class="timeline-time">01:54</div><div class="timeline-text">价值观：是否适合高风险创业环境</div></div><div class="timeline-item"><div class="timeline-time">02:08</div><div class="timeline-text">建议：简历滚瓜烂熟（高 ROI）</div></div><div class="timeline-item"><div class="timeline-time">02:16</div><div class="timeline-text">对比：北美 SD+LC vs 国内深挖</div></div></div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram"><div class="node"><div>问题</div><div style="font-size:12px;font-weight:600;margin-top:4px">回国后考什么</div></div><div class="arrow">→</div><div class="node-orange"><div>路径A</div><div style="font-size:12px;font-weight:600;margin-top:4px">大厂简历/算法</div></div><div class="arrow">→</div><div class="node-purple"><div>路径B</div><div style="font-size:12px;font-weight:600;margin-top:4px">AI初创笔试</div></div><div class="arrow">→</div><div class="node-purple"><div>能力</div><div style="font-size:12px;font-weight:600;margin-top:4px">多边形+价值观</div></div><div class="arrow">→</div><div class="node-green"><div>行动</div><div style="font-size:12px;font-weight:600;margin-top:4px">简历滚瓜烂熟</div></div></div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解：回国面试=把北美刷题流程搬过来。纠偏：作者认为国内更强调简历深挖与可迁移思考；北美仍多见 system design + LeetCode。</p><p>误解：AI 初创只考 prompt。纠偏：片中强调超长项目笔试——设计、落地、交付整条链。</p><p>误解：「多边形」=什么都会一点就行。纠偏：语境是工程交付之外还要产品/业务/AI 理解，并可能加价值观匹配。</p><p>立场分层：时长「近 10 小时」、面得最多是 AI 初创等，均为作者个人经历；不能外推为所有国内公司标准。</p>
  </div>

  <h2 class="sec-title">观点卡片</h2>
  <div class="card card">
  <h3>在讲什么：两条赛道并存</h3>
  <p>关键理解：大厂变化不大（简历深挖 + 算法题）；作者当前样本里 AI 初创占比最高且题型更杂。用法：投递前先判断目标公司更像哪条赛道，准备权重不同。</p>
  <div class="quote">我现在面的主要最多的还是 AI 的一些初创企业……真的是五花八门</div>
  <div class="relation">赛道分流 → 准备策略分流。</div>
</div>
<div class="card card-green">
  <h3>在讲什么：作业式笔试 = 用 AI 交付真实项目</h3>
  <p>关键理解：先过笔试才进面；笔试可能一下午甚至近 10 小时；题目常是公司待解大项目，考察设计 + 落地 + 交付。用法：按「可演示的交付物」准备，而不是按短答题刷题。</p>
  <div class="quote">看你用 AI 会怎么去设计并且把它给落地，然后再交付</div>
  <div class="relation">笔试时长 × 项目完整度 = 初创筛选强度信号。</div>
</div>
<div class="card card-purple">
  <h3>在讲什么：多边形能力 + 价值观题</h3>
  <p>关键理解：面试仍深挖「做过什么 / 为什么」与场景题；同时考察产品、业务、AI 观，以及是否适合高不确定创业环境。用法：准备履历故事时预留「决策理由」与「跨场景复用」两层。</p>
  <div class="quote">他们需要的人员的能力是非常多边形的</div>
  <div class="relation">硬技能交付 × 业务理解 × 价值观匹配。</div>
</div>
<div class="card card-orange">
  <h3>风险边界：个人经历 ≠ 行业标准</h3>
  <p>关键理解：作者给出的是近期样本与建议，不是 HR 白皮书。不同城市、阶段、岗位差异很大；「近 10 小时笔试」是极端例子，用来说明强度，不是均值。</p>
  <div class="quote">如果我要给一个建议……一定要深挖自己的简历，一定要讲滚瓜烂熟的</div>
  <div class="relation">高 ROI 准备项可迁移；具体题型与时长需按目标公司核实。</div>
</div>

  <div class="card">
    <h3>横向对比：中美 / 大厂 / AI 初创（据作者口述）</h3>
    <table><tr><th>维度</th><th>北美（作者概括）</th><th>国内大厂（作者概括）</th><th>国内 AI 初创（作者经历）</th></tr><tr><td>主考形式</td><td>system design + LeetCode</td><td>简历深挖 + 算法题</td><td>超长项目笔试 → 面试</td></tr><tr><td>深挖重点</td><td>相对偏题型</td><td>做过什么 / 为什么 / 复用</td><td>交付链 + 多面理解 + 价值观</td></tr><tr><td>准备抓手</td><td>刷题与系统设计</td><td>履历故事滚瓜烂熟</td><td>可演示的 AI 项目交付</td></tr></table>
  </div>

  <div class="conclusion">
    <h2>行动清单与避坑</h2>
    <h3>可以马上做</h3>
    <ol><li>把每段关键履历写成「做了什么 → 为什么 → 可复用到哪类场景」三句卡，能脱稿讲。</li><li>若投 AI 初创：准备 1 个可端到端演示的 AI 落地小项目（设计说明 + 结果物）。</li><li>预演 2–3 道场景题：基于自己简历里的风险事件，讲决策与复盘。</li><li>单独准备价值观口述：为何接受创业不确定性、如何处理节奏与失败。</li><li>投递前向目标公司校友核实：是否有长笔试、时长量级，避免按均值准备。</li></ol>
    <h3>尽量避免</h3>
    <ul><li>只按北美刷题节奏准备，忽略国内简历深挖与「为什么」层。</li><li>把 AI 笔试当成短问答，未准备可交付物与落地说明。</li><li>「多边形」准备成空泛自我介绍，缺产品/业务具体例子。</li><li>把作者个人极端笔试时长当成所有公司标配，造成焦虑或错误排期。</li></ul>
    <h3>认知转变</h3>
    <ul><li>以前：以为回国=继续刷 LC/SD → 现在：先分赛道，国内更抠简历故事</li><li>以前：笔试=几道题 → 现在：可能是公司项目级 AI 交付作业</li><li>以前：只证明写得出代码 → 现在：还要证明多面理解与创业匹配</li></ul>
  </div>

  <div class="footer">基于口播与画面字幕整理 · 个人经历分享 · 非招聘标准声明</div>
</div></div>
    </div>
  </foreignObject>
</svg>
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>爱生气是因为你有这个思维</h1>
  <div class="meta"><span class="tag tag-blue">情绪</span><span class="tag tag-green">必须型思维</span><span class="tag tag-orange">边界</span><span class="tag tag-purple">郭春林</span><span class="tag tag-gray">时长 3分11秒</span><span class="tag tag-gray">理性分析 · 认知框架</span></div>
  <a class="source-link" href="https://xhslink.cn/o/hoHYl17xov">原视频</a>
  <div class="summary-line">核心判断：易怒常被误标为脾气差，讲座将其归因于必须型思维——期望变必须、方案一偏差就怒；对策是分清我的事与别人的事，把必须改成尽力。前半依赖画面字幕，后半口播收束「不生气你就赢了」。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">爱生气不是因为脾气差</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">关键词：方案偏差</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">分清我的事和别人的事</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">不是所有事都有道理</span></div><div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">没有什么是必须的</span></div><div class="timeline-item"><span class="timeline-time">02:55</span><span class="timeline-text">改掉必须型思维</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>怒从哪来</div><span class="arrow">→</span><div class="node-green">证据<br/>必须+边界模糊</div><span class="arrow">→</span><div class="node-orange">判断<br/>改认知框架</div><span class="arrow">→</span><div class="node-blue">行动<br/>暗示与边界练习</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：爱生气=脾气坏的人。纠偏：视频主张先查思维框架。</p><p>误解：心理暗示可保证财运。纠偏：励志收尾，不作因果承诺。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：必须型思维</h3>
      <p>把「希望如此」升级成「必须如此」，现实一偏就怒。</p>
      <div class="quote">没有什么东西是必须的。</div>
      <div class="relation">怒气是报警器，指向刚性预期。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：两件事</h3>
      <p>①方案偏差时先降级「必须」；②分清我的事和别人的事。</p>
      <div class="quote">分清我的事和别人的事。</div>
      <div class="relation">可当天练习的边界句。</div>
    </div>
    <div class="card card-orange">
      <h3>证据与缺口</h3>
      <p>00:03–02:00口播稀薄，方案偏差等来自字幕；后半口播完整。</p>
      <div class="quote">不生气你就赢了。</div>
      <div class="relation">讲座观点，非临床方案。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">框架对照</h2><div class="card"><table><thead><tr><th>旧框架</th><th>新框架（视频）</th></tr></thead><tbody><tr><td>脾气差</td><td>必须型思维</td></tr><tr><td>别人该配合我</td><td>分清我的事/别人的事</td></tr><tr><td>必须做成</td><td>尽力而为</td></tr><tr><td>生气=输了场面</td><td>不生气你就赢了</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>不适用急性心理危机与专业治疗场景。</li><li>「财运」等为修辞。</li></ul><div class="pitfall">压抑情绪却不改预期。</div><div class="pitfall">把别人的事强行当成自己的KPI。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>怒气常指向刚性「必须」。</li><li>边界清晰可降燃点。</li><li>暗示练习服务观念更新。</li></ul><h3>行动清单</h3><ol><li>生气时写下那句「必须」。</li><li>问：这是我的事还是别人的事。</li><li>把必须改写成尽力+可接受后果。</li></ol><h3>关键认知转变</h3><p>从「我脾气不好」转向「我的必须清单过长」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分11秒</div>
</div>
    </div>
  </foreignObject>
</svg>
      <div class="container root-wrap">
  <h1>30s看懂眼睛年轻感的关键</h1>
  <div class="meta"><span class="tag tag-blue">眼周</span><span class="tag tag-green">泪沟</span><span class="tag tag-orange">眶外C</span><span class="tag tag-purple">年轻感</span><span class="tag tag-red">亚单位</span><span class="tag tag-gray">时长 23秒</span><span class="tag tag-gray">理性分析 · 眼周审美</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9teipdZEnDS">原视频</a>
  <div class="summary-line">核心判断：眼睛年轻感取决于眼周五个亚单位之间的明暗过渡，而不是「眼睛画大」；泪沟与眶外C等结构名词，是为了把疲态定位到可调的一小段过渡上。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">疲态眼周特写</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">结构名词标注</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">什么是眶外C</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">年轻感对照</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>年轻感差在哪</div><span class="arrow">→</span><div class="node-green">证据<br/>亚单位与过渡</div><span class="arrow">→</span><div class="node-orange">判断<br/>过渡&gt;单点饱满</div><span class="arrow">→</span><div class="node-blue">行动<br/>按区微调</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：眼周=眼睛周围一整块。纠偏：拆成眉弓/上睑/下睑/泪沟/外眦。</p><p>ASR：勒沟≈泪沟；口播几乎不可用，依据画面与文案。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：五亚单位</h3>
      <p>年轻感来自单元之间的明暗过渡，不是每一格都填满。</p>
      <div class="quote">小美和顶美之间，很多时候只隔了一个眼周微调</div>
      <div class="relation">细节识别能力决定上限。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：先命名再动手</h3>
      <p>看到疲态先问：泪沟？眶外C？眉尾下压？再选择妆造或医美路径。</p>
      <div class="quote">什么是眶外C</div>
      <div class="relation">名词是定位工具。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：23秒视觉片</h3>
      <p>短片负责建立结构意识；具体手法在系列其他内容，不在本条口播里。</p>
      <div class="quote">不需要打破重建</div>
      <div class="relation">观点：钱静眼周系列。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>非医疗诊断。</li><li>文案截断于笔记简介。</li></ul><div class="pitfall">只加卧蚕/眼线掩盖泪沟问题。</div><div class="pitfall">追求单区饱满造成过渡更假。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先拆眼周结构。</li><li>过渡决定年轻感。</li><li>微调优于重建。</li></ul><h3>行动清单</h3><ol><li>对着镜子标出五亚单位。</li><li>拍照侧光检查泪沟过渡。</li><li>改妆只动一个亚单位做对照。</li></ol><h3>关键认知转变</h3><p>从「眼睛大不大」转向「过渡顺不顺」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 23秒</div>
</div>
    </div>
  </foreignObject>

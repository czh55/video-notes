  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，上一期东哥带大家初步认识了蒙版的分类和基本工具。这一期，直接上实操，教大家 AI 识别蒙版和线性蒙版究竟怎么用！
	
🎈AI 识别蒙版回顾
AI 识别蒙版包含选择主体、选择天空和选择背景。这仨都是自动识别，随后再按需调整，没啥复杂工具～
	
🎈线性渐变蒙版使用要点
[种草R]创建线性渐变蒙版时，会出现 “三根线”：
1⃣按住中间那根线，就能调整蒙版位置（图2）。
2⃣按住外侧任意一根线，能调整它与中间线的距离。距离越宽，渐变效果越强，也就越自然（图3）；距离越窄，渐变效果越弱，就会显得生硬（图4）。要是三根线重叠，那就没渐变效果啦，具体得按需调整。
3⃣外侧有根线带有两个小圆圈，一个用来调整距离，另一个则能调整蒙版方向，按住就能随意旋转。（图2）
	
🎈实操环节
以图 5为例，来看看怎么灵活运用蒙版：
	
[向右R]单独调整建筑：点击 “+” 创建 “选择主体” 蒙版，主体能自动识别出来。但 APP 有时会出错，像这次就把桥的上沿误识别成主体了（图6）。这时，就用上节课讲的 “蒙板嵌套” 里的 “从蒙板中去除” 工具。
	
[种草R]按住主体蒙版，选择 “从蒙板中去除</div>

<div class="container">
  <h1>影子要换颜色吗？量了宫崎骏50张剧照</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。哪一张是吉卜力原图？
	
答案是 B。
	
我把《你想活出怎样的人生》官网公开的</p>
  <div class="card"><h3>封面/要点：第一页是同一张剧照的两版，只改了真人</h3><p>第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。</p></div><div class="card"><h3>第5/9页：影子要换颜色吗？量了宫崎骏50张剧照</h3><p>第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。</p></div><div class="card"><h3>第9/9页：影子要换颜色吗？量了宫崎骏50张剧照</h3><p>第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。哪一张是吉卜力原图？
	
答案是 B。
	
我把《你想活出怎样的人生》官网公开的 50 张剧照都量了一遍，挑出 18 张人物特写，在脸上各取一块亮面、一块影子的颜色。
	
① 影子不换颜色
18 张里，影子和亮面的色相 H 都只差 3 以内。没有加紫，也没有加蓝。
	
② 只暗一点点
亮度 B 中间值降 16，最少降 10，最多降 25。饱和度 S 反而多了一点，中间值加 5。
	
③ 衣服也一样
真人那件灰衬衫看着偏蓝，是因为布料本来就是蓝灰。影子还是那种灰，只是更暗。
	
风景就不一样了。绿色多的 20 张剧照里，17 张的暗处绿比亮处绿更偏蓝。平涂的人物，影子同色压暗，干净好认；一笔笔画出来的风景，暗处换色，更有空气感。
	
第 6 页是取色器里的做法：先吸亮面的颜色，H 不动，B 往下拉 15 左右，S 加 3 到 8。还附了三组片中实测的色号，可以直接抄。最后一页是画完自查的三个问题。
	
数字是在压缩过的官方剧照上测的，只能比较亮面和影子的关系，不等于原始设定色，也只看了这一部电影。火光、夕阳里</div>

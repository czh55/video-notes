  <div class='bound'>图文轮播笔记；无时间轴口播。</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>第一页是同一张剧照的两版，只改了真人脸上影子的颜色：A 换成暖红，B 同色压暗。哪一张是吉卜力原图？
	
答案是 B。
	
我把《你想活出怎样的人生》官网公开的</p></div>

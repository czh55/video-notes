<div class="container">
  <h1>主角不够突出？试试反过来配色</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">第一页是同一张示意图的两版，构图、人物、黑猫都一样，只把两种颜色对调：左边红色给了裙子，右边红色铺满背景、裙子改成浅色。哪一版的主角更容易找到？
	
上一篇看的</p>
  <div class="card"><h3>封面/要点：第一页是同一张示意图的两版，构图、人</h3><p>第一页是同一张示意图的两版，构图、人物、黑猫都一样，只把两种颜色对调：左边红色给</p></div><div class="card"><h3>第5/7页：主角不够突出？试试反过来配色</h3><p>第一页是同一张示意图的两版，构图、人物、黑猫都一样，只把两种颜色对调：左边红色给</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">第一页是同一张示意图的两版，构图、人物、黑猫都一样，只把两种颜色对调：左边红色给了裙子，右边红色铺满背景、裙子改成浅色。哪一版的主角更容易找到？
	
上一篇看的是 kunomari，她常把鲜艳色收到主角身上。这次看日本插画师くらはしれい（Kurahashi Rei），她的几张官方公开图正好反过来。
	
① 最鲜艳的一块是背景
黄底那张宣传插图，一整块纯色约占画面九成，比人物鲜艳得多；展览主视觉的粉底也占了约四分之三。背景没有画房间或风景，就是平铺的颜色。
	
② 主角收成浅色和细线
人物多穿米白、浅粉或格子裙，衣褶、花边、头发都用细线交代。背景鲜艳而平，人物浅而细，两样都是相反的。
	
③ 最深的那一点，常是一只黑猫
这 4 张官方图里都有一只黑猫。粉底那张，黑色的钥匙孔形状加黑猫，是全画最深的一块。
	
两位作者的做法看起来相反，共同点是：主角和紧挨着它的地方，总有几样是相反的。
	
第 7 页是练习：拿一张自己的画，A 版照平时画，B 版把背景铺成一块鲜艳纯色、主角改成浅色，再只加一处最深的黑。
	
这次只依据 4 张官方公开图，她约 340 幅作品里一定有例外；上面的“推断”也还</div>
  <div class='pitfall'>以图内文字为准；文案话题标签已剥离。</div>
  <div class='bound'>图文轮播笔记；无时间轴口播。</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>第一页是同一张示意图的两版，构图、人物、黑猫都一样，只把两种颜色对调：左边红色给了裙子，右边红色铺满背景、裙子改成浅色。哪一版的主角更容易找到？
	
上一篇看的</p></div>

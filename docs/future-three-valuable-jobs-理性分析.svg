      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}.container{max-width:1200px;margin:0 auto}h1{font-size:30px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}h2{font-size:22px;font-weight:700;color:#1e40af;margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}h3{font-size:17px;font-weight:700;color:#334155;margin-bottom:8px}p,li{font-size:14px;line-height:1.7;color:#475569;margin-bottom:5px}ul,ol{padding-left:20px}.tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:12px;font-weight:600;margin-right:6px}.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}.tag-red{background:#fee2e2;color:#991b1b}.tag-gray{background:#f1f5f9;color:#64748b}.meta{margin:8px 0 14px}.summary-line{font-size:16px;line-height:1.65;padding:16px 20px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:16px;color:#334155;box-shadow:0 2px 12px rgba(0,0,0,.04)}.timeline{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.timeline h3{color:#1e40af}.timeline-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9}.timeline-time{font-size:12px;font-weight:700;color:#3b82f6;min-width:58px}.timeline-text{font-size:13px;color:#475569}.map{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.05)}.map h2{margin:0;border:none;padding:0}.diagram{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:12px 0}.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:12px;padding:14px 18px;text-align:center;min-width:120px;font-weight:700;font-size:13px;color:#1e40af}.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}.arrow{font-size:20px;color:#94a3b8}.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:14px 18px;border-radius:10px;margin-bottom:14px}.correction h3,.correction p{color:#92400e}.sec-title{font-size:18px;font-weight:700;color:#1e40af;margin:6px 0 10px;padding-left:10px;border-left:4px solid #3b82f6}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:10px;border-left:5px solid #3b82f6;box-shadow:0 3px 16px rgba(0,0,0,.04)}.card.card-green{border-left-color:#10b981}.card.card-orange{border-left-color:#f59e0b}.card.card-purple{border-left-color:#8b5cf6}.card.card-red{border-left-color:#ef4444}.card h3{font-size:16px;color:#1e40af}.card .quote{background:#f8fafc;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:12px;color:#64748b;border-left:3px solid #cbd5e1;font-style:italic}.card .relation{background:#f0fdf4;padding:8px 10px;border-radius:8px;font-size:12px;color:#166534}.card .pitfall{background:#fef2f2;padding:8px 12px;border-radius:8px;margin:6px 0;font-size:12px;color:#991b1b;border-left:3px solid #ef4444}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f1f5f9;padding:8px;text-align:left;color:#1e40af}td{padding:8px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:16px;padding:24px;margin-top:18px}.conclusion h2{color:#fff;border-bottom:1px solid rgba(255,255,255,.2);margin-top:0}.conclusion h3{color:rgba(255,255,255,.9);margin:10px 0 6px}.conclusion p,.conclusion li{color:rgba(255,255,255,.9)}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:18px 0}.source-link{color:#3b82f6;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:12px}.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap"><h1>未来最值钱的三种工作｜硅谷创业者小鹰</h1><div class="meta"><span class="tag tag-blue">AI创业</span><span class="tag tag-green">Founder</span><span class="tag tag-orange">销售</span><span class="tag tag-purple">通才</span><span class="tag tag-red">Agent</span><span class="tag tag-gray">时长 12分35秒</span><span class="tag tag-gray">理性分析 · 职场与创业</span></div><a class="source-link" href="https://b23.tv/P9SiN92">原视频</a><div class="summary-line">核心判断：工作总量未必下降，但「老登组织里的螺丝钉岗」在漏；值钱的是定义问题与管 AI 的通才，近未来显性三类是 Founder、销售、以及 AI 暂做不好的过渡劳动。</div><div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">一人公司与融资标签</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">风口+收入+圈子</span></div><div class="timeline-item"><span class="timeline-time">04:30</span><span class="timeline-text">管AI：错题本与对骂</span></div><div class="timeline-item"><span class="timeline-time">06:00</span><span class="timeline-text">打工机会变少</span></div><div class="timeline-item"><span class="timeline-time">08:00</span><span class="timeline-text">螺丝钉→通才</span></div><div class="timeline-item"><span class="timeline-time">10:20</span><span class="timeline-text">Founder/销售/苦工</span></div><div class="timeline-item"><span class="timeline-time">11:40</span><span class="timeline-text">传记与测产品</span></div></div><div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>AI时代做什么</div><span class="arrow">→</span><div class="node-green">证据<br/>管AI+组织漏岗</div><span class="arrow">→</span><div class="node-orange">判断<br/>通才&gt;螺丝钉</div><span class="arrow">→</span><div class="node">行动<br/>换圈+练定义</div></div></div><div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：AI让工作消失。纠偏：工作更多，老登打工岗更少。</p><p>误解：必须立刻创业才安全。纠偏：通才与结果导向在打工市场也稀缺。</p><p>ASR：老登/斯坦福/一人公司/铁饭碗等已校正。</p></div><div class="section"><h2 class="sec-title">观点拆解</h2><div class="card card-purple"><h3>在讲什么：人适应AI，不是反过来</h3><p>人是有肉体瓶颈的调度者；目标是让Agent干得久且靠谱。</p><div class="quote">工作肯定会越来越多了，只是给老登公司打工的机会越来越少</div><div class="relation">叙事从失业恐惧切到岗位结构重组。</div></div><div class="card card-blue"><h3>管AI四件套</h3><p>权限一次给对、方向纠偏、AI质检AI、错题本长记性。</p><div class="quote">这就是管AI的难点</div><div class="relation">可写成个人工作流清单。</div></div><div class="card card-green"><h3>三种工作</h3><p>Founder；销售（人格魅力）；过渡苦工/精细体力。</p><div class="quote">一类是Founder……一类就是销售……还有一类可能就是纯的苦工</div><div class="relation">5–10年可见，非50年预言。</div></div><div class="card card-orange"><h3>边界：硅谷口语经验</h3><p>个人创业叙事与圈层偏见；「没成功创业者&gt;大厂」是招聘偏好不是普遍真理。</p><div class="quote">一个没成功的创业者高于一个给大公司打工的</div><div class="relation">作启发式，勿当绝对阶层论。</div></div></div><div class="section"><h2 class="sec-title">三类工作对照</h2><div class="card"><table><thead><tr><th>类型</th><th>为何值钱</th><th>风险</th></tr></thead><tbody><tr><td>Founder</td><td>定义游戏、整合资源</td><td>失败率高</td></tr><tr><td>销售</td><td>技术同质后比人格与获客</td><td>被平台规则挤压</td></tr><tr><td>过渡劳动</td><td>AI手笨/平台禁自动化</td><td>随能力进步消失</td></tr></tbody></table></div></div><div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>访谈观点非劳动经济学结论。</li><li>「老登」为口语贬称，指僵化旧组织。</li></ul><div class="pitfall">只焦虑裁员不换信息圈。</div><div class="pitfall">用开会写文档当核心产出。</div><div class="pitfall">把奥数/螺丝钉当唯一安全路径。</div></div></div><div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>岗在重组，不是工作归零。</li><li>通才=定义问题+管AI。</li><li>Founder与销售是近端硬通货。</li></ul><h3>行动清单</h3><ol><li>本周测3个新AI产品并记手感。</li><li>找1个AI圈朋友每周同步机会。</li><li>把自己产出改成「问题定义+验收标准」。</li></ol><h3>关键认知转变</h3><p>从「保住旧岗」转向「进入新工作方式」。</p></div><div class="footer">双轨产物之二 · 理性分析 · 12分35秒</div></div>
    </div>
  </foreignObject>
</svg>
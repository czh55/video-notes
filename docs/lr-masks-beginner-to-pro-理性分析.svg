  <h1>🔥LR蒙版｜小白到大师的关键一步</h1>
  <div><span class="tag">Lightroom</span><span class="tag">修图</span><span class="tag">教程</span></div>
  <p class="summary-line">[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。要是把修图比作手术，蒙版就是那把又锋利又精准的手术刀，能帮咱们选中特定区域，对亮</p>
  <div class="card"><h3>封面/要点：[种草R]家人们，东哥上线！今天带大</h3><p>[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。</p></div><div class="card"><h3>第5/18页：🔥LR蒙版｜小白到大师的关键一步</h3><p>[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。</p></div><div class="card"><h3>第9/18页：🔥LR蒙版｜小白到大师的关键一步</h3><p>[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。</p></div><div class="card"><h3>第13/18页：🔥LR蒙版｜小白到大师的关键一步</h3><p>[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。</p></div><div class="card"><h3>第17/18页：🔥LR蒙版｜小白到大师的关键一步</h3><p>[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，东哥上线！今天带大家认识修图界的 “手术刀”——LR 蒙版🩹。要是把修图比作手术，蒙版就是那把又锋利又精准的手术刀，能帮咱们选中特定区域，对亮度、颜色、效果、细节等进行单独调整（图2）。之前讲的工具都是针对照片整体，学会蒙板就能精准局部调整了！但今天只作粗略认识，后边会以实际案例详讲。
	
[一R]蒙版分类大盘点
	
[种草R]AI 识别蒙版：手机 LR 的 AI 超给力！“选择主体” 能自动锁定画面主角；“选择天空”“选择背景” 一键选中对应区域，轻松调整。（图3-图5）
	
[种草R]颜色蒙版：点击 “颜色范围”，光标戳戳想调整的颜色，比如草地，LR 就会自动识别相似颜色区域，方便调色。（图6）
	
[种草R]亮度蒙版：选择 “明亮度范围”，点选照片中想调整的亮度区域，就能对不同亮度部分分别调整。（图7）
	
[种草R]径向渐变蒙版：点击 “径向渐变”，拖动蓝色方框圈出想调整的圆形或椭圆形区域，突出主体超好用。（图8）
	
[种草R]线性渐变蒙版：选择 “线性渐变”，在照片上拖动创建直线选区，对选区内进行单独调整。（图9）
	
[种草R]画笔蒙版：手动涂抹选区，哪</div>

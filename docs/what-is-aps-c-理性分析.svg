<div class="container">
  <h1>APS-C 的“C”是什么？</h1>
  <div class="meta">
    <span class="tag tag-blue">摄影</span>
    <span class="tag tag-purple">传感器尺码</span>
    <span class="tag tag-orange">胶卷史</span>
    <span class="tag tag-gray">3分08秒</span>
    <span class="tag tag-green">理性分析</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/2dQtePzZVtk">原视频 · 所以然｜OnaFab</a>
  <div class="summary-line">APS-C 不是天生的数码规格名，而是 1996 年 APS 胶卷里 Classic（3:2）裁切框留下的名字；胶卷失败后，早期小传感器碰巧接近那一框，名字被征用为尺码，裁切系数是这把历史尺子的用法。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">提问：很多相机写着 APS-C——APS 与 C 分别是什么</div></div>
    <div class="timeline-item"><div class="timeline-time">00:15</div><div class="timeline-text">1996：五家厂推 APS；暗盒投片、四态图标、磁性层 IX</div></div>
    <div class="timeline-item"><div class="timeline-time">00:40</div><div class="timeline-text">H / C / P 可选，底片恒为 H；记号决定冲印裁切 → C 即裁切</div></div>
    <div class="timeline-item"><div class="timeline-time">01:08</div><div class="timeline-text">目标八成 vs 首年约 7%；2004 退相机、2011 停胶卷</div></div>
    <div class="timeline-item"><div class="timeline-time">01:36</div><div class="timeline-text">早期数码单反小一号，尺寸接近胶卷 C；佳能去掉「相当」</div></div>
    <div class="timeline-item"><div class="timeline-time">02:05</div><div class="timeline-text">同镜只接中间一块；×1.5 / ×1.6；全画幅为尺子的「1」</div></div>
    <div class="timeline-item"><div class="timeline-time">02:30</div><div class="timeline-text">格式死了，名字成了尺码；全画幅 / 一英寸亦有媒介史出处</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">APS 胶卷<br/>H 全幅记录</div>
      <div class="arrow">→</div>
      <div class="node node-orange">C = Classic<br/>冲印裁切记号</div>
      <div class="arrow">→</div>
      <div class="node">胶卷市场失败<br/>2011 停产</div>
      <div class="arrow">→</div>
      <div class="node node-green">名字征用为<br/>传感器尺码</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>把 APS-C 当成「一种精确、全球统一的传感器毫米数」——视频明确：各家并不一样大，佳能也说它不是精确尺寸。C 的本义是裁切框名，不是整卷底片型号。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">观点拆解</h2>

    <div class="card">
      <h3>在讲什么：C 从第一天起就是裁出来的</h3>
      <p>底片物理记录按 H（宽屏）铺满；用户选 C / P 只写入暗盒旁记号，冲印机再裁。因此 Classic 从来不是「另一卷更小的胶片」，而是同一张 H 上的取景意图。</p>
      <div class="quote">「不管选哪种，底片上都是 H……三种照片，都从同一个 H 里裁。」</div>
      <div class="insight">关键理解：今天说「APS-C 传感器」，语义上继承的是「接近当年 C 框大小的感光面」，不是 APS 整卷系统复活。</div>
      <div class="relation">怎么用：看到机身 APS-C 铭牌，先问裁切系数与实尺寸，而不是把字母当品质等级。</div>
    </div>

    <div class="card card-purple">
      <h3>UP 主判断：失败格式留下的尺码</h3>
      <p>市场数据（目标 80% vs 首年约 7%、冲印溢价约 15%）支撑「系统未普及」；数码小传感器成本动机与「碰巧接近 C 框」并列出现。立场层：史实与时间线可核对，名称征用过程是作者基于厂商文案变化的叙述。</p>
      <div class="highlight">2003「APS-C 尺寸相当」→ 次年去掉「相当」：名字从类比变成标签（视频观点）。</div>
    </div>

    <div class="card card-orange">
      <h3>避坑：别把倍数神话成画质阶梯</h3>
      <div class="pitfall">裁切系数只描述视角换算（50×1.5≈75），不自动等于「差 1.5 倍画质」。全画幅被设为尺子的「1」，是行业沟通习惯，不是物理唯一真理。</div>
      <p>各家 APS-C 毫米数不同；佳能常用 ×1.6。买机比的是实尺寸、镜头群与场景，不是字母本身。</p>
    </div>
  </div>

  <div class="card">
    <h3>横向对照：H / C / P 与今日尺码</h3>
    <table>
      <thead>
        <tr><th>符号</th><th>胶卷时代含义</th><th>今日常见继承</th><th>注意</th></tr>
      </thead>
      <tbody>
        <tr><td>H</td><td>HDTV 宽屏，底片实际记录幅面</td><td>偶见 APS-H（约 ×1.3）历史机型</td><td>胶卷上几乎总是按 H 曝光</td></tr>
        <tr><td>C</td><td>Classic 3:2，冲印裁切</td><td>APS-C 传感器类别名</td><td>各厂毫米数不统一</td></tr>
        <tr><td>P</td><td>Panoramic 全景裁切</td><td>基本未成传感器品类名</td><td>仍是同一 H 上的记号</td></tr>
        <tr><td>全画幅「1」</td><td>35mm 电影/135 传统参考</td><td>等效焦距分母</td><td>媒介史出处，非绝对优劣</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-green">
    <h3>方法边界</h3>
    <ul>
      <li>视频为科普示意（含 AI 生成画面与比例模型），毫米数为约数，不能替代具体机型规格书。</li>
      <li>销量百分比、年代节点来自口播与片内引用（如 PMA / Supermarket News 脚注），未在本页独立核源。</li>
      <li>不讨论具体品牌画质排名；裁切系数不涵盖景深、高感、镜头设计等全部差异。</li>
    </ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>C = Classic 裁切框，不是整卷底片名。</li>
      <li>APS 系统失败后，名字被小数码传感器征用为尺码。</li>
      <li>裁切系数把全画幅设为 1，用来换算视角，不是品质分数。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>查自己的机身：实尺寸（mm）+ 厂商标称裁切系数。</li>
      <li>换算常用焦段：焦距 × 系数 ≈ 等效视角，再决定是否「缺广角」。</li>
      <li>跨品牌对比时，不要默认所有 APS-C 毫米数相同。</li>
      <li>读参数表时区分「画幅营销名」与「感光面积」。</li>
      <li>升级决策先问场景（暗光、虚化、镜头群），再问倍数。</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：APS-C 像是数码原生规格 → 现在：它是失败胶卷裁切框的遗名。</li>
      <li>以前：C 像「完整一档画幅」 → 现在：C 从第一天起就是裁出来的。</li>
      <li>以前：倍数越大越高级 → 现在：倍数是沟通尺子，场景决定是否值得。</li>
    </ul>
  </div>

  <div class="footer">基于小红书视频《APS-C 的“C”是什么？》· 所以然｜OnaFab · 双轨理性分析</div>
</div>

    </div>
  </foreignObject>
</svg>
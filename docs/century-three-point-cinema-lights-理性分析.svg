  <div class="card"><h3>行动清单</h3><div class="action">💡 给你一个数字：
100。
影视行业用了100年，拍电影用的最经典的布光法则——
三盏灯。
	
对，你没看错。
三盏。
	
从好莱坞大片到电视剧到短视频，
不管你看到画面多复杂，
底层逻辑都是这三盏灯。
	
哪三盏？
🎯 第1盏：轮廓光（发丝光）
放在人物侧后方，偏硬偏亮。
作用是——打亮人物边缘/发丝，
把人物从背景里"剥离"出来。
	
用手电筒就能打。
光够硬够集中，发丝边缘那一圈亮边，
一两分钟就出来。
	
🎯 第2盏：暗部补光
放在暗部一侧的前方，偏柔偏弱。
作用是——
让暗的那一面不要彻底黑掉，
有一点点细节就够了。
	
记住：补光的强度不要超过主光的一半。
不然脸会变平。
	
🎯 第3盏：主光
放在亮部一侧的斜上方45度，
带柔光箱，最亮。
作用是——最主要的照明，
决定整体亮度和基调。
	
三盏灯里，这盏最亮。
它是"定调"的那个。
	
📐 顺序也很关键：
先上轮廓光 → 再上补光 → 最后上主光
	
为什么这个顺序？
因为主光从侧面打过来的时候，
才能判断补光够不够、轮廓光位置对不对。
先上主光，后面两盏的位置就很难调了。
	
🎨 还有一个冷知识：
三点布光最早不是摄</div>

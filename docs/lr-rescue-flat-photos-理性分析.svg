  <h1>灰片、烂片就用它轻松逆袭！</h1>
  <div><span class="tag">Lightroom</span><span class="tag">修图</span><span class="tag">教程</span></div>
  <p class="summary-line">[种草R]家人们，今天给大家分享 Lightroom 里效果工具，轻松提升照片清晰度和质感！
	
[彩虹R]清晰度调整双神器
	
[种草R]纹理和清晰度工具都能</p>
  <div class="card"><h3>封面/要点：[种草R]家人们，今天给大家分享 L</h3><p>[种草R]家人们，今天给大家分享 Lightroom 里效果工具，轻松提升照片清</p></div><div class="card"><h3>第5/10页：灰片、烂片就用它轻松逆袭！</h3><p>[种草R]家人们，今天给大家分享 Lightroom 里效果工具，轻松提升照片清</p></div><div class="card"><h3>第9/10页：灰片、烂片就用它轻松逆袭！</h3><p>[种草R]家人们，今天给大家分享 Lightroom 里效果工具，轻松提升照片清</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天给大家分享 Lightroom 里效果工具，轻松提升照片清晰度和质感！
	
[彩虹R]清晰度调整双神器
	
[种草R]纹理和清晰度工具都能调整画面清晰度。当照片灰蒙蒙、不清晰时，向右滑动就能提升清晰度。纹理工具往左降低、往右提升；清晰度工具相较纹理工具调整效果更显著，就像前边讲的自然饱和度和饱和度工具的区别。
	
[种草R]以图2为例，将纹理工具调至正 100，画面清晰度提升（图3），把清晰度工具调至 100（图4），对比更明显。当然，向左滑动，画面会越来越模糊，这里就不作展示。
	
[彩虹R]去朦胧工具：告别雾气感
	
[种草R]去朦胧工具能去除画面朦胧感。当照片因拍摄环境灰蒙蒙时，向右滑动滑块，雾气消失，细节尽显。回忆一下前边我们讲的“亮度”工具里边的“对比度”也有类似的效果，但它们之间还是有区别的。去朦胧工具不仅能去灰，还能保留各个明暗区域的细节，层次更清晰。而对比度调整主要是提升亮度降低暗部，对白色区域和黑色区域虽影响较小，画面层次不足，甚至有的拉的太多还会引起过曝或死黑。而向左滑动去朦胧工具，能给人像调色营造朦胧的年代感。
	
[种草R]图5为原片，图6</div>

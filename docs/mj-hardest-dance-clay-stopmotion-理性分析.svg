.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}</style>
      
<div class="container">
  <h1>泥巴逐帧还原迈克舞步</h1>
  <div class="meta">
    <span class="tag tag-blue">运动动作</span>
    <span class="tag tag-green">定格</span>
    <span class="tag tag-orange">宅叔飞飞</span>
    <span class="tag tag-gray">2分24秒 · 依画面字幕</span>
  </div>
  <div class="summary-line">这支片子真正要解决的不是「舞步叫什么」，而是：幅度大的身体动作，怎样在 24 帧的泥偶上活过开裂、断手和软零件乱飞。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:06</div><div class="timeline-text">画面字幕把对象写成迈克的《too bad》，00:10 用「据说」称呼最难的舞。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:22</div><div class="timeline-text">17 段分镜；00:33 起要拍 17 个空背景，00:36 每段重新抠支架。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:43</div><div class="timeline-text">软件预览叠橙色轨迹，字幕指向斯坦·温斯顿的分镜。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:45</div><div class="timeline-text">1 秒 24 张照片；快约 3 分钟一张，慢则 10 到 20 分钟。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:02</div><div class="timeline-text">手从腕部断开。01:05 泥巴倒了。作者说这两类还能补。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:13</div><div class="timeline-text">机位位移意味着整段重拍，对策是离设备远远的。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:33</div><div class="timeline-text">方格纸记录耳朵和领带的方向与停留帧数。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:50</div><div class="timeline-text">成片无字幕，上下对照大厅群舞与桌面泥偶的大形。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">幅度很大的舞</div>
      <div class="arrow">→</div>
      <div class="node node-orange">泥会裂、手会断</div>
      <div class="arrow">→</div>
      <div class="node">17 段空背景</div>
      <div class="arrow">→</div>
      <div class="node node-green">软零件另记账</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解</h3>
    <p>把它当成舞蹈教学会落空。片中没有口令、节拍数或关节角度。它是定格制作纪实。「最难」来自字幕里的「据说」，不能当成已核实的难度排名。Whisper 里的 UXL、情有的真实、毒巴图，都与画面字幕冲突，不能当术语。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">分镜数量怎样变成工时</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>17 段对日常影像显得少，对定格会被乘以空背景和抠像。</p>
      <div class="highlight">关键理解：段数不是叙事丰富度，而是机位、空镜和支架清理的重复次数。</div>
      <div class="action">怎么用：先数分镜，再给每段预留「表演帧 + 一张空背景 + 一次抠支架」。缺任何一项，后面都会回头重拍。</div>
      <div class="quote">依画面字幕，00:22–00:38：17 段分镜头，还需要拍 17 个空背景，每一段分镜都要重新抠支架。</div>
    </div>
    <div class="card card-purple">
      <h3>作者的立场</h3>
      <p>他愿意接受变碎的分镜，因为能学到该片导演斯坦·温斯顿的分镜处理。这是学习动机，不是对温斯顿手法的拆解。片中没有说明具体借鉴了哪一种镜头衔接。</p>
    </div>
    <div class="card card-orange">
      <h3>避坑</h3>
      <div class="pitfall">不要把笔记文案里的「扣背景」和画面字幕里的「抠支架」合成一句未经核对的工艺说明。两者相关，但用词不同。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">失败要分等级</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>同样是做坏，返工成本不一样。</p>
      <div class="highlight">关键理解：泥偶损坏可以在原机位上补；机位变了，时间线作废。</div>
      <div class="action">怎么用：手和支架伸进画面时，先确认脚架和云台没有被碰到，再去捏泥。作者的做法是身体离设备远一点。</div>
      <div class="quote">依画面，01:02 字幕「手断了」，01:05「泥巴倒了」，01:06 说这些都还好；01:15 机位位移则要重新拍摄。</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr><th>现象</th><th>画面证据</th><th>作者处理</th><th>适用条件</th></tr>
        </thead>
        <tbody>
          <tr><td>开裂、手断、泥倒</td><td>00:19 字幕开裂；01:02 手离开手腕</td><td>花时间调整，继续这一段</td><td>机位和光线还在</td></tr>
          <tr><td>机位位移</td><td>01:13–01:15 字幕</td><td>整段重拍，人离设备远</td><td>前后帧要对齐时</td></tr>
          <tr><td>耳朵、领带乱飞</td><td>01:25–01:36 字幕与方格纸</td><td>另记方向和停帧</td><td>软零件跟不上身体大形</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">软零件的账本</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>身体大形可以跟着上方成片摆，耳朵和领带是二次动画。作者用方格纸模拟表格，格子里是箭头和叉，用来记方向和停留帧数。</p>
      <div class="highlight">关键理解：他说的 Excel 在这一帧里是纸，不是已经打开的电子表。符号没有图例。</div>
      <div class="action">怎么用：若要自己做，先规定箭头指向哪一侧、叉是停住还是换向，再开始填。否则只有作者看得懂，这一点他在片尾前已经承认。</div>
      <div class="quote">依画面字幕，01:34–01:36：专门用来记录耳朵和领带的方向以及停留的帧数。</div>
    </div>
    <div class="card card-red">
      <h3>方法边界</h3>
      <p>这套记账只覆盖两条软零件，不证明整支舞的重心、脚步或音乐卡点已经被量化。成片约 30 秒没有解说，不能从一张对照帧推出「还原度」。1 秒 24 张、每张 3 到 20 分钟，都是作者口述量级，不是独立计时。歌名只保留画面上的《too bad》，不把未在画面写出的电影名写成事实。</p>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>难度被作者表述为幅度：泥会裂，软的部分会飞。</li>
      <li>17 段的真实成本是空背景和抠支架，不只是镜头好看。</li>
      <li>断手可补，机位不可挪；耳朵和领带要单独记方向和停帧。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>开拍前写下分镜数，并为每段留一张空背景。</li>
      <li>把支架颜色和位置固定，避免每段重抠时对不齐。</li>
      <li>手伸进画面之前先离开脚架。</li>
      <li>给耳朵、领带各做一列方向和停帧，先写图例再填格。</li>
      <li>成片对照只检查身体大形，不要在没有旁白时给舞步命名。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>以前会把「还原一支舞」理解成记住动作名称。看完这段制作，决定能不能做完的是帧率、空镜和软零件的账，不是舞名本身。</p>
  </div>
  <p class="footer">证据来自本地画面字幕与抽帧。Whisper 稀疏且有误听，未写入结论。立场：可见画面为事实，字幕中的「据说」「最难」为作者转述。</p>
</div>
    </div>
  </foreignObject>
</svg>
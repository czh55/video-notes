      <div class="container root-wrap">
  <h1>编曲必看：怎么给旋律配和弦</h1>
  <div class="meta"><span class="tag tag-blue">编曲</span><span class="tag tag-green">和弦</span><span class="tag tag-orange">转位</span><span class="tag tag-purple">试听</span><span class="tag tag-gray">时长 7分33秒</span><span class="tag tag-gray">理性分析 · 决策流程</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7ex08ISMUXS">原视频</a>
  <div class="summary-line">核心判断：配和弦是「强拍旋律音 → 候选三和弦 → 试听转位／色彩」的筛选，不是背网上进行公式；七级要改，喜欢与耳朵最终拍板。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">C调强拍取音</span></div><div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">do/si/la 与和弦重合</span></div><div class="timeline-item"><span class="timeline-time">03:20</span><span class="timeline-text">偏爱第二转位</span></div><div class="timeline-item"><span class="timeline-time">05:30</span><span class="timeline-text">挂留与六级</span></div><div class="timeline-item"><span class="timeline-time">06:00</span><span class="timeline-text">七级慎用</span></div><div class="timeline-item"><span class="timeline-time">07:00</span><span class="timeline-text">多尝试因喜欢</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">输入<br/>旋律强拍音</div><span class="arrow">→</span><div class="node-green">候选<br/>1–7级三和弦</div><span class="arrow">→</span><div class="node-orange">调节<br/>转位/挂留</div><span class="arrow">→</span><div class="node-blue">裁决<br/>耳朵+喜欢</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：必须按和弦公式走。纠偏：作者明确犹豫并反对只靠公式。</p><p>误解：七级也能随便套。纠偏：新手尽量避免，要用就改。</p><p>误解：原位最好。纠偏：转位常只是为了手感与声部。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：重合筛选</h3>
      <p>看强拍及后续音在哪些和弦里出现，取更吻合者。</p>
      <div class="quote">谁比较多呢……我们就取</div>
      <div class="relation">约束来自旋律，不是反向硬套。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：转位与挂留</h3>
      <p>同和弦多种排列；挂留可解「怪音」。</p>
      <div class="quote">我个人比较喜欢第二转位</div>
      <div class="relation">个人偏好需用试听验证。</div>
    </div>
    <div class="card card-orange">
      <h3>风险：七级</h3>
      <p>特殊存在，直接用常翻车。</p>
      <div class="quote">新手尽量避免去使用它</div>
      <div class="relation">能用要改，不是绝对禁止。</div>
    </div>
    <div class="card card-purple">
      <h3>立场：没有标准答案</h3>
      <p>和弦与人声都要多试。</p>
      <div class="quote">都没有标准答案，你自己去试</div>
      <div class="relation">方法论视频，不是题库。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">决策清单</h2><div class="card"><table><thead><tr><th>步骤</th><th>问题</th><th>产出</th></tr></thead><tbody><tr><td>1</td><td>强拍音是什么？</td><td>约束音集</td></tr><tr><td>2</td><td>哪些级数含这些音？</td><td>候选和弦</td></tr><tr><td>3</td><td>原位刺耳吗？</td><td>转位/翻高音</td></tr><tr><td>4</td><td>要不要色彩？</td><td>挂留/扩展</td></tr><tr><td>5</td><td>七级？</td><td>避开或改造</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>以自然大调三和弦入门，爵士扩展仅点到。</li><li>示例曲片段未完整开源歌词版权分析。</li></ul><div class="pitfall">先下载「万能进行」再硬套旋律。</div><div class="pitfall">不听只看级数标签。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>旋律约束优先。</li><li>转位服务听感。</li><li>公式是捷径不是法律。</li></ul><h3>行动清单</h3><ol><li>选8小节旋律只配强拍。</li><li>同一和弦录3种转位对比。</li><li>把七级从初稿里删掉再听。</li></ol><h3>关键认知转变</h3><p>从「背公式」转向「筛候选+试听」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 7分33秒</div>
</div>
    </div>
  </foreignObject>
</svg>
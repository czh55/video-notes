<h1>清醒=边界清单，不是鸡汤形容词</h1>
<div class="meta">人生感悟 · 清醒 · 生活方式 · 图文 · 图文 6 页</div>
<a href="https://xhslink.cn/o/8WYmAYbFNZ5">原笔记</a>
<div class="summary">核心判断：十二条都在做减法与边界——住/车/睡/吃/社交/消费/关系/身体，把外显竞赛换成可维持的舒适。</div>
<div class="card"><h3>物与钱</h3><ul><li>住舒服、车便宜</li><li>不超前、减欲望</li></ul></div>
<div class="card"><h3>人与注意力</h3><ul><li>少掺事不攀比</li><li>拒烂人与无效社交</li></ul></div>
<div class="card"><h3>身体与节奏</h3><ul><li>多睡认真吃饭</li><li>安稳日常+运动</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>每周删一件无效社交</li><li>大额消费先问是否换舒适</li><li>把睡眠和吃饭写进日程硬约束</li></ul></div>
<div class="footer">video-notes · life-top-clarity</div>

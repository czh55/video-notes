<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="5535" viewBox="0 0 1320 5535">
  <foreignObject x="0" y="0" width="1320" height="5535">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#1e40af;margin-bottom:12px}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:160px;font-weight:700;font-size:16px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{font-size:24px;color:#94a3b8}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}
.correction h3,.correction p{color:#92400e}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}
.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .relation{background:#f0fdf4;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;color:#166534}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}</style>
      
<div class="container">
  <h1>富士 X100VI：从按键到出片的上手地图</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">摄影 / 器材上手</span>
    <span class="tag tag-orange">3分28秒</span>
    <span class="tag tag-purple">理性分析</span>
    <span class="tag tag-gray">芋泥小盆友</span>
  </div>
  <div class="summary-line">核心判断：先把快门/ISO/光圈放到可自动档位保证出片，再用 Q 菜单改胶片模拟与色彩；本片是按键导览 + 作者个人直出配方，不是测光理论课。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:11</div><div class="timeline-text">底部同仓：电池 + 内存卡</div></div>
    <div class="timeline-item"><div class="timeline-time">00:37</div><div class="timeline-text">曝光补偿拨盘：数值↑更亮 / ↓更暗</div></div>
    <div class="timeline-item"><div class="timeline-time">00:55</div><div class="timeline-text">左侧盘：旋=快门，上提=ISO；新手建议双 A</div></div>
    <div class="timeline-item"><div class="timeline-time">01:12</div><div class="timeline-text">Drive/Delete：模式切换 / 回放删除</div></div>
    <div class="timeline-item"><div class="timeline-time">01:47</div><div class="timeline-text">Q 键：快速唤起闪光灯与胶片模拟</div></div>
    <div class="timeline-item"><div class="timeline-time">02:20</div><div class="timeline-text">光圈环：人像开大或 A；控制环可数码远摄</div></div>
    <div class="timeline-item"><div class="timeline-time">02:54</div><div class="timeline-text">配方：CC/NC + 色彩/蓝 FX 强 + DR200 等</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>刚到手不会用</div>
      <div class="arrow">→</div>
      <div class="node">证据<br/>分区指键 + 演示</div>
      <div class="arrow">→</div>
      <div class="node node-green">判断<br/>先自动再调色</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>截图保存配方</div>
    </div>
  </div>

  <div class="correction">
    <h3>听写纠偏（避免照抄转录翻车）</h3>
    <p>「X160」→ X100VI；「so」→ ISO；「刀青接口」→ 遥控口；对焦「N」→ 画面刻度 M；「蓝色选择强」→ 彩色 FX 蓝：强。原始 Whisper 保留在 HTML 转录区作证据。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">分区操控：先认盘，再谈风格</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>把机身拆成底部装机、顶部曝光三件套、背面导航、镜头/侧键四层，降低「满盘旋钮」的认知负荷。</p>
      <div class="quote">「这里新手推荐快门和 so 直接自动，也就是这个 A 档就行了」</div>
      <div class="insight">关键理解：自动档不是偷懒，是把带宽留给构图与时机；拨盘物理设计（上提 ISO）是富士特色，需要摸一次才记得住。</div>
      <div class="action">怎么用：开机后先确认快门盘与 ISO 都在 A，曝光补偿归零，再半按对焦试拍一张。</div>
    </div>
    <div class="card card-purple">
      <h3>UP 主观点：Q 键才是日常入口</h3>
      <p>菜单能做一切，但作者把「闪光灯 + 胶片模拟」明确挂在 Q 快速菜单上，暗示新手不必先钻完整菜单树。</p>
      <div class="relation">立场：作者使用习惯；是否默认把这两项钉在 Q 菜单，因固件/自定义而异。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">对焦与镜头：固定镜头机的两条捷径</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>光圈环管景深；控制环在 AF 下变成数码远摄；左侧 M/C/S 拨杆决定对焦行为，作者常用 C（连续）。</p>
      <div class="quote">「人像的话建议光圈开到最大……自动对焦的模式下，转动它可以实现数码远摄」</div>
      <div class="insight">理解：X100 系列没有可换焦段，数码远摄是「焦段不够时的机内折中」，会裁切像素，不是光学变焦。</div>
      <div class="pitfall">避坑：别把数码远摄当无损长焦；需要画质时优先走近或后期裁切策略另议。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">直出配方：CC/NC 的作者参数卡</h2>
    <div class="card">
      <h3>横向对照</h3>
      <table>
        <thead><tr><th>项目</th><th>作者口述</th><th>证据层级</th></tr></thead>
        <tbody>
          <tr><td>胶片模拟</td><td>CC 常用，其次 NC</td><td>口播 + Q 菜单 CLASSIC CHROME 画面</td></tr>
          <tr><td>色彩效果 / 蓝 FX</td><td>强 / 强</td><td>口播（「蓝色选择强」经术语校正）</td></tr>
          <tr><td>高光 / 阴影</td><td>-1 / -1</td><td>口播；瞬时菜单可能不同步</td></tr>
          <tr><td>白平衡</td><td>白优先或氛围优先；R-1 B+1</td><td>口播</td></tr>
          <tr><td>动态范围</td><td>200</td><td>口播 + 菜单选中 200 画面</td></tr>
          <tr><td>锐度 / 高 ISO NR / 色彩</td><td>0 / -3 / +4</td><td>口播</td></tr>
        </tbody>
      </table>
      <div class="highlight">方法边界：这是「作者觉得好用的通用起点」，不是对所有肤色/光线的最优解；阴天 NC、人像肤色等场景通常还要再偏。</div>
    </div>
    <div class="card card-orange">
      <h3>风险与避坑</h3>
      <ul>
        <li>照抄 Whisper 原文会得到错误机型与错误接口名称。</li>
        <li>高 ISO 降噪拉到 -3 会保留更多噪点纹理，也更「脏」——喜好问题，不是绝对更好。</li>
        <li>闪光灯 TTL「自动」不等于一定好看；室内色温与反光仍需试拍。</li>
      </ul>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>分区认键：底仓 → 顶盘 → 背面导航 → 镜头/对焦拨杆。</li>
      <li>新手默认：快门 A、ISO A、光圈按题材开大或 A；曝光补偿作微调。</li>
      <li>日常改风格走 Q：胶片模拟 + 闪光灯优先于深菜单。</li>
      <li>直出风格用作者 CC/NC 参数卡作起点，再按光线微调。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>装好电池与卡，开机确认拨盘都在 A，半按对焦拍一张。</li>
      <li>摸一次：曝光补偿旋钮、快门盘上提 ISO、Q 菜单进胶片模拟。</li>
      <li>把口播配方截图进机内自定义，或对照菜单逐项设好。</li>
      <li>试 C 档跟焦与光圈全开人像各一组，再决定是否改 NR/色彩。</li>
      <li>需要「更远」时先评估数码远摄的画质代价，再决定用不用。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>上手机不是先背满菜单，而是「保证能出片的默认态 + 一个改风格的快捷入口（Q）+ 一张可迭代的参数卡」。</p>
  </div>
  <div class="footer">证据来自小红书视频与本地 Whisper 转录 · 参数为作者观点</div>
</div>

    </div>
  </foreignObject>
</svg>
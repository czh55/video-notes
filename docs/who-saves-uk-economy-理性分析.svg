<h1>没有未来？谁能拯救英国经济</h1>
<div class="meta">英国 · 脱欧 · 区域差距 · NEET · 伦敦 · <a href="https://b23.tv/YukSNWQ">原视频</a></div>
<div class="summary"><strong>核心判断：</strong>英国账本：帝国红利退后靠福利/欧洲/市场化补丁；脱欧磨损效率，伦敦虹吸与 NEET 追问「同一未来」。</div>
<div class="card"><h3>结构重组</h3><ul><li><strong>[00:00→03:00] 帝国红利退场</strong> — 赢了两次大战却透支国力；美元体系取代英镑结账时代。</li><li><strong>[03:00→06:00] 三层补丁</strong> — NHS 福利安抚、入欧换规则市场、撒切尔市场化改增长结构并加剧工业城镇阵痛。</li><li><strong>[06:00→11:00] 脱欧与空间极化</strong> — 合规与边境摩擦磨损效率；金融与人才向伦敦扎堆，人均产出差距约 2.4 倍。</li><li><strong>[11:00→15:02] 劳动力断裂</strong> — NEET 近百万、健康限制上升、学历溢价下滑——进入财富积累的时间被往后推。</li></ul></div>
<div class="card"><h3>适用边界</h3><ul>
<li>纪实作者观点与口播口径，金额/车队数为约数，勿当投研结论。</li>
<li>ASR 专名已校正；细节以原视频与官方披露为准。</li>
</ul></div>
<div class="conclusion"><h2>行动结论</h2><ul><li>「谁能拯救」若只盯伦敦金融与主权口号，会漏掉效率、区域再投资与年轻人进入资产系统的通道。</li></ul></div>
<div class="footer">video-notes · who-saves-uk-economy</div>

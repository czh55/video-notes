<h1>特斯拉 FSD 十三年｜硅谷 101</h1>
<div class="meta">特斯拉 · FSD · Robotaxi · 端到端 · AI芯片 · <a href="https://b23.tv/W2Un7fN">原视频</a></div>
<div class="summary"><strong>核心判断：</strong>FSD 十三年：自研芯片与去雷达、占据网络到端到端 V12–V14；Robotaxi 后半场是监管与经济之战。</div>
<div class="card"><h3>结构重组</h3><ul><li><strong>[00:00→09:00] 路线与决裂</strong> — Waymo L4 vs 特斯拉渐进；Mobileye 黑盒→自研算法与双芯片萌芽。</li><li><strong>[09:00→23:00] HW3 与感知</strong> — AI3 高利用率；成本逼供；HydraNet/时序/多摄融合。</li><li><strong>[23:00→38:00] 去雷达与 HW4</strong> — 占据网络+自动标注；摄像头像素/布局与双芯片拍板；GDDR 带宽瓶颈。</li><li><strong>[38:00→52:00] 端到端与 Robotaxi</strong> — V12 验证存活，V13 修剪，V14 加肥；车队扩展成监管游戏。</li><li><strong>[52:00→61:23] AI5 与经济之战</strong> — 流片瞒报、台积电/三星双线；与 Waymo 比的是单位经济与规模。</li></ul></div>
<div class="card"><h3>适用边界</h3><ul>
<li>纪实作者观点与口播口径，金额/车队数为约数，勿当投研结论。</li>
<li>ASR 专名已校正；细节以原视频与官方披露为准。</li>
</ul></div>
<div class="conclusion"><h2>行动结论</h2><ul><li>特斯拉把未成熟系统交给真实车队迭代；技术债用自研与端到端硬扛，最终胜负看单位经济与监管扩展速度。</li></ul></div>

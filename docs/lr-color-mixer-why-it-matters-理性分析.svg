  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天来唠唠Lightroom里超重要的颜色混合调整工具-颜色混合，真的很重要哦！
	
🎨前期准备
[种草R]我们先看看图2中间个粉红色的气球，用三句话描述：这个气球是“粉红色”，它的颜色很“淡”，这个气球很“亮”。其实这三句话就是我们前边讲的色彩三要素：色相（H）、饱和度（S）、明亮度（L）。色相就是颜色的相貌，比如红、橙、紫；饱和度是颜色的鲜艳程度；明亮度则是颜色的亮度。
	
[种草R]下面点开“颜色”右上角的“混合”，可以看到八个颜色调整工具啦。
	
[向右R]从左到右依次是色相红、橙、黄、绿、青、蓝、紫、洋红（图3），和色相环（图4）顺序一样。（最好慢慢把它记熟哦），点击任何一个色彩，都可以通过拉动横条上的圆点来调整它的色相、饱和度和明亮度。
	
[一R]色相调整
[向右R]规律：圆点在中间就是图片中该色相调整前的状态，往左拉就是逐渐往它前边一个色相变化，往右拉就是逐渐往它后边一个色相变化。
	
[种草R]拿红色举例，往左移色相工具，红色会沿色相环逆时针变成紫红色、洋红色；往右移，会顺时针逐渐变成橙色、橙黄色（图5-图7）。举一反三，其他颜色规律一样，自己去试试</div>

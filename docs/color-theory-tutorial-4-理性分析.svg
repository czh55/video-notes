      <div class="container">
  <h1>画阴影别再用黑色了</h1>
  <div class="meta">
    <span class="tag tag-blue">色彩理论</span>
    <span class="tag tag-green">依画面</span>
    <span class="tag tag-orange">8秒</span>
    <span class="tag tag-gray">Angel · 小红书</span>
  </div>
  <p class="summary-line">依画面，这条短片把同一块浅紫立方体画了两遍：红叉的投影收成灰黑，绿勾的亮面偏粉、投影留在深蓝紫里。笔记标题只写「色彩理论教程」，没有口播把这个对照说完。</p>
  <a class="source-link" href="https://xhslink.cn/o/90O6lV5bFoE">原笔记短链</a>

  <div class="timeline">
    <h3>关键画面</h3>
    <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">标题出现。红叉立方体左侧面更灰，绿勾立方体左侧面是更深的紫。两侧右侧都有浅紫色块。</span></div>
    <div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">红叉左下方出现近黑投影。绿勾顶面偏粉，暗面仍是紫，右侧色块从浅粉排到深紫。</span></div>
    <div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">红叉铺开灰地面和灰黑投影，并多了灰色块。绿勾地面偏浅灰绿，投影是深蓝紫。</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">阴影会不会变黑</div>
      <div class="arrow">→</div>
      <div class="node node-orange">红叉：灰面、灰地、近黑投影</div>
      <div class="arrow">→</div>
      <div class="node node-green">绿勾：粉顶、紫暗面、深紫投影</div>
    </div>
  </div>

  <div class="correction">
    <h3>先把证据和推断分开</h3>
    <p>可核对的是三帧上的颜色：红叉投影取样接近黑和灰，绿勾投影取样是深蓝紫，绿勾顶面偏粉。画面没有说「必须用补色」或「地面绿是反光」。Whisper 那句 Hey you, watch I cry 与标题对不上，不作为依据。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">红叉和绿勾各自留下什么颜色</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>依画面，两行从同一类浅紫立方体出发，最后差别落在投影和亮面，不落在物体轮廓。</p>
      <div class="highlight">红叉：暗面灰紫，地面中性灰，投影灰黑，色块里出现灰。绿勾：顶面偏粉，暗面和投影保持紫，地面偏浅灰绿。</div>
      <h3>怎么用</h3>
      <div class="action">临摹时先分开画两块影子：一块只加灰，一块改用比底色更深的紫，并在顶面加一点暖粉。对照的是颜色，不是立方体形状。</div>
      <h3>依据</h3>
      <p>00:00 两侧暗面已经分开；00:04 近黑投影和粉色顶面同时可见；00:08 地面铺开后投影颜色仍分开。</p>
    </div>
    <div class="card card-purple">
      <h3>作者立场，画面能支持到哪一步</h3>
      <p>标题「画阴影别再用黑色了」是作者的判断，红叉和绿勾是配图。依画面，这个判断对应的是投影从灰黑换成深蓝紫，外加亮面偏暖。它没有展示黑色在线稿、纯灰背景或夜景里是否仍然合适。</p>
      <div class="quote">笔记标题只有「色彩理论教程」。更具体的句子在画面上，不在口播里。</div>
    </div>
    <div class="card card-orange">
      <h3>不要从这 8 秒多推一步</h3>
      <div class="pitfall">不要把浅灰绿地面写成已经讲完的环境色反光。画面只让地面和投影颜色不同，没有箭头或文字说明反光。</div>
      <div class="pitfall">不要把右侧色块数写成固定配方。色块是随着涂抹增加的，压缩画面里数不清每一笔。</div>
    </div>
  </div>

  <div class="card">
    <h3>两行对照</h3>
    <table>
      <thead>
        <tr><th>位置</th><th>红叉，00:08</th><th>绿勾，00:08</th></tr>
      </thead>
      <tbody>
        <tr><td>立方体暗面</td><td>灰紫</td><td>深紫</td></tr>
        <tr><td>顶面</td><td>浅紫</td><td>偏粉，带暖色笔触</td></tr>
        <tr><td>地面</td><td>中性灰</td><td>浅灰，略带绿</td></tr>
        <tr><td>投影</td><td>灰黑，接近无彩色</td><td>深蓝紫</td></tr>
        <tr><td>右侧色块</td><td>浅紫，并有灰色块</td><td>浅粉到深紫，不见那排灰</td></tr>
      </tbody>
    </table>
    <p>适用边界：只适用于这条片子里的浅紫立方体和白底演示。换底色、换光源之后，画面没有给出对应结果。</p>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>依画面，标题反对的是阴影用黑，配图把灰黑投影放在红叉下。</li>
      <li>绿勾保留紫色投影，并把顶面涂暖，地面只是略偏灰绿。</li>
      <li>唯一一句转录与画面不符，不能当成讲解。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>画一块浅紫立方体，投影先涂灰，再另涂一版深蓝紫，并排看。</li>
      <li>第二版的顶面加浅粉，暗面不要跟着加灰。</li>
      <li>地面用浅灰即可，先不要加复杂反光。</li>
      <li>色块只记录自己实际用到的颜色，不要照着数不清的笔触凑数量。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>以前会把「别用黑」理解成整幅画不能有暗色。依画面，暗色还在，只是红叉那份暗色变成了灰，绿勾那份暗色留在紫色里。</p>
  </div>
  <p class="footer">证据仅来自本条 8 秒画面与 1 段 Whisper。未访问小红书页面。</p>
</div>
    </div>
  </foreignObject>
</svg>
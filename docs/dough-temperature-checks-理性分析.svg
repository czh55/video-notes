      <h1>面温是信号，状态才是判断</h1>
<table>
<tr><th>页</th><th>图上的数</th><th>接着做什么</th></tr>
<tr><td>1/4</td><td>26.4°C；吐司 25–27，贝果约 24</td><td>出缸量内部</td></tr>
<tr><td>2/4</td><td>26.3°C；丹麦 22–24</td><td>调水温、预冷、中途再量</td></tr>
<tr><td>3/4</td><td>29.8°C</td><td>先停机，按酵母加没加分</td></tr>
<tr><td>4/4</td><td>18.5°C；水温先不超过 35°C</td><td>回到目标面温，80 分钟不胀是个例</td></tr>
</table>
<p>易错：接近 30°C 就当报废，或越冷越好。边界：参考温度不是统一标准。</p>

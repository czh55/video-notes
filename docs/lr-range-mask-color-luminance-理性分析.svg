  <div class="card"><h3>封面/要点：家人们，东哥又来带大家实操LR蒙版工</h3><p>家人们，东哥又来带大家实操LR蒙版工具啦！今天讲讲最后两个超实用的蒙版——颜色范</p></div><div class="card"><h3>第5/8页：学会颜色与明亮度范围蒙版｜修图超自如</h3><p>家人们，东哥又来带大家实操LR蒙版工具啦！今天讲讲最后两个超实用的蒙版——颜色范</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">家人们，东哥又来带大家实操LR蒙版工具啦！今天讲讲最后两个超实用的蒙版——颜色范围和明亮度范围，掌握了它们，你的修图技术直接起飞🛫
🎨颜色范围蒙版
这个蒙版可以根据颜色来精准选择图像中的特定区域。比如风景照里，想单独把绿色植物颜色变得更鲜艳，或者换个色调，还不影响画面其他部分，用它就对了！
	
[向右R]它有个 “精简” 属性，往左滑缩小颜色选取范围，往右滑扩大范围，超方便精准控制。（图2）
🎨明亮度范围蒙版
它是按照像素亮度来选择区域的，不管是明亮区域还是暗部区域，都能自动识别。调整高光和阴影的时候，这个蒙版简直是神器！
	
[向右R]它的 “选择明亮度” 有3个滑块（图3）：
[烟花R]中间 “电池状” 滑块：调整所选明亮度范围的中心值，重新定义被选中亮度区域的中心位置。
[烟花R] 电池两端：右边调亮部范围，左边调暗部范围。
[烟花R]左右 “图钉状” 滑块：分别调整所选明亮度范围的下限和上限，控制选择的最暗和最亮值 。
🖼实操时间
	
[种草R]看图4，我把颜色混合里的黄色调整到 -100 了，还没变成橙色，想接着调整这些不规则又多的黄色区域，径向渐变、线性渐变都不行，用画笔又</div>

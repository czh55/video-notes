      <div class="container root-wrap">
  <h1>夏普 J-SH04：全球第一台拍照手机</h1>
  <div class="meta"><span class="tag tag-blue">科技史</span><span class="tag tag-green">拍照手机</span><span class="tag tag-orange">J-SH04</span><span class="tag tag-purple">夏普</span><span class="tag tag-red">创新</span><span class="tag tag-gray">时长 2分04秒</span><span class="tag tag-gray">理性分析 · 产品史</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9t1LUxBWcGI">原视频</a>
  <div class="summary-line">核心判断：J-SH04的突破不是像素数字，而是把「拍摄→即时发送」写进手机定义；当年被嘲笑的理由（像素低、没人需要）后来被整条产业链替它回答。口播ASR失效，证据以画面字幕与标题卡为准。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">会议室争执：手机加摄像头</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">传感器做出来了</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">拍完直接发邮件/发给朋友</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">2000年9月发布，没人看好</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">竞品跟进证明方向对了</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">标题卡：全球第一台拍照手机</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>通话工具要不要眼睛</div><span class="arrow">→</span><div class="node-green">证据<br/>传感器+发邮件场景</div><span class="arrow">→</span><div class="node-orange">判断<br/>方向对≠当下好卖</div><span class="arrow">→</span><div class="node-blue">行动<br/>用场景定义创新</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：第一台拍照手机=画质最好。纠偏：它赢在品类定义，11万像素只是起点。</p><p>误解：卖不动就说明方向错。纠偏：视频用竞品跟进证明方向，短期销量是另一回事。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：品类诞生的戏剧化复盘</h3>
      <p>短片用会议室、实验室、发布会三段，把J-SH04从争议到验证串起来。</p>
      <div class="quote">他们做就说明方向对了。</div>
      <div class="relation">理解：创新叙事常先输销量、后赢定义。</div>
    </div>
    <div class="card card-green">
      <h3>关键理解：价值在「拍了就能发」</h3>
      <p>字幕反复强调邮件/发给朋友，而不是样张锐度。</p>
      <div class="quote">是拍了马上能发给朋友。</div>
      <div class="relation">用法：评估新品看闭环场景，不看参数榜第一名。</div>
    </div>
    <div class="card card-orange">
      <h3>证据边界：ASR不可用</h3>
      <p>Whisper仅4条乱码分段；分析与实录均重建自本地画面字幕，脚注已说明。</p>
      <div class="quote">因为后来所有人都在替他回答。</div>
      <div class="relation">事实层：片尾自称夏普J-SH04为全球第一台拍照手机（作者叙事）。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">视频中的像素对照（示意）</h2><div class="card"><table><thead><tr><th>对象</th><th>视频给出的像素/信息</th><th>叙事作用</th></tr></thead><tbody><tr><td>J-SH04</td><td>约11万像素</td><td>起点：敢装摄像头</td></tr><tr><td>后续功能机</td><td>约30万像素</td><td>嘲笑理由被逐条追上</td></tr><tr><td>早期智能手机</td><td>约500万像素</td><td>后人替它「回答」</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>「全球第一」表述来自视频标题卡，细部专利/机型争议未展开。</li><li>剧情画面为演绎，不作史料逐帧考证。</li></ul><div class="pitfall">用今天像素标准嘲笑起点产品。</div><div class="pitfall">把首发失败等价于战略错误。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>品类创新看场景闭环。</li><li>短期销量与长期定义可以背离。</li><li>参数嘲笑往往是时间问题。</li></ul><h3>行动清单</h3><ol><li>写清你的产品「拍/做完之后下一步是什么」。</li><li>把反对意见列成清单，标哪些是暂时参数问题。</li><li>用竞品是否跟进检验方向。</li></ol><h3>关键认知转变</h3><p>从「参数够不够」转向「有没有创造新行为」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 2分04秒</div>
</div>
    </div>
  </foreignObject>
</svg>
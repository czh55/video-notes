.source-link{color:#b45309;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style>
      
<div class="container">
  <h1>书法的第一性原理：新手练字抓准核心</h1>
  <div class="meta">
    <span class="tag tag-orange">小红书图文</span>
    <span class="tag tag-gray">4 页公式</span>
    <span class="tag tag-gray">理性分析</span>
  </div>
  <div class="summary-line">核心判断：自学临帖进步慢，多半是在描外形；笔记主张把进步写成「本质 × 控制 × 校正」，并落到线条、结构、章法三条可检查的练习线。</div>
  <a class="source-link" href="https://xhslink.cn/o/1ngmMeddK1M">原笔记短链</a>

  <div class="timeline">
    <h3>证据页序</h3>
    <div class="timeline-item"><span class="timeline-time">1/4</span><span class="timeline-text">总览公式与三列框架</span></div>
    <div class="timeline-item"><span class="timeline-time">2/4</span><span class="timeline-text">线条：方向 × 力度 × 节奏</span></div>
    <div class="timeline-item"><span class="timeline-time">3/4</span><span class="timeline-text">结构：重心 → 主次 → 空间</span></div>
    <div class="timeline-item"><span class="timeline-time">4/4</span><span class="timeline-text">章法：行气 × 空间变化 × 整体节奏</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">看清本质</div><div class="arrow">→</div>
      <div class="node">建立控制</div><div class="arrow">→</div>
      <div class="node">持续校正</div><div class="arrow">→</div>
      <div class="node node-green">整体表现</div>
    </div>
    <p>三条落地线并行：线条控制、结构关系、章法气息；观察—理解—训练贯穿全程（第 1/4 页）。</p>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>「写像了就进步了」→ 笔记明确反对把字写成图像；真正目标是关系、变量与临摹校正（第 1/4、3/4 页）。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">三条公式怎么用</h2>
    <div class="card">
      <h3>线条：先稳再活</h3>
      <p>在讲什么：线条质量由方向控制、力度变化、书写节奏共同决定。</p>
      <p>关键理解：方向管骨架，力度管质感，速度管节奏；中锋、起收、提按、转折是可检查项。</p>
      <div class="action">怎么用：每次练习只盯一两个变量（例如今天只查转折是否清楚），不要同时改外形与全部变量。</div>
      <div class="quote">原文依据（第 2/4 页）：「先把线写稳、写活，再谈一个字好不好看。」</div>
      <div class="pitfall">避坑：只盯外形；一味写慢；只会加力导致粗而无质感。</div>
    </div>
    <div class="card card-orange">
      <h3>结构：关系优先</h3>
      <p>在讲什么：结构=重心+主次+疏密+收放+呼应，不是笔画摆齐。</p>
      <p>关键理解：先稳重心，再让主笔撑势，最后比空间；局部服从整体。</p>
      <div class="action">怎么用：临写前先看重心；可用「挡住主笔字势是否塌」检验主次。</div>
      <div class="quote">原文依据（第 3/4 页）：「临帖不是记位置，而是理解为什么这样安排。」</div>
      <div class="pitfall">避坑：用力均匀、只记位置、局部准而整体散。</div>
    </div>
    <div class="card card-green">
      <h3>章法：局部服从整体</h3>
      <p>在讲什么：章法气息=行气贯通×空间变化×整体节奏；留白也是内容。</p>
      <p>关键理解：字间要有联系，行间要协调，边距与落款参与呼吸。</p>
      <div class="action">怎么用：写完先眯眼看黑白分布，再抠单字；检查正文/落款主次与留白。</div>
      <div class="quote">原文依据（第 4/4 页）：「章法的核心，是让局部变化始终服从整体。」</div>
      <div class="pitfall">避坑：处处等距、每行笔直、忽略落款与边距。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对照：三层各管什么</h3>
    <table>
      <tr><th>层级</th><th>核心公式</th><th>优先检查</th><th>页码</th></tr>
      <tr><td>线条</td><td>方向×力度×节奏</td><td>中锋、起收、提按、转折</td><td>2/4</td></tr>
      <tr><td>结构</td><td>重心+主次+空间</td><td>重心稳、主笔醒、关系不散</td><td>3/4</td></tr>
      <tr><td>章法</td><td>行气×空间×节奏</td><td>字间联系、行间协调、留白呼吸</td><td>4/4</td></tr>
    </table>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>进步是相乘关系：本质、控制、校正缺一不可。</li>
      <li>练字顺序建议：线稳 → 关系清 → 整篇有气息。</li>
      <li>评价标准从「像不像」换成「关系是否成立、变量是否可控」。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>下次临帖前花 10 秒标出范字重心与主笔。</li>
      <li>单次练习只选一个线条检查项（如转折），写完对照第 2/4 页清单。</li>
      <li>写完一行后眯眼看黑白，再决定要不要改单字细节。</li>
      <li>每周留一次整篇练习，专门查行气与留白，不纠结单字。</li>
      <li>把「写像」从目标列表拿掉，改成「变量可复现」。</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：闷头描外形 → 现在：先建可检查的控制变量。</li>
      <li>以前：单字好看就满意 → 现在：字间行气与留白同样计分。</li>
      <li>以前：进步靠多写 → 现在：进步靠对照范本持续校正关系。</li>
    </ul>
  </div>
  <div class="footer">方法边界：作者自学框架，非某书体定论；图上无具体笔迹示范与数值。依据页 1/4–4/4。</div>
</div>
    </div>
  </foreignObject>
</svg>
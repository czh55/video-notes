      <div class="container root-wrap">
  <h1>达芬奇调色师操作动线</h1>
  <div class="meta"><span class="tag tag-blue">个人专栏</span><span class="tag tag-green">达芬奇</span><span class="tag tag-orange">调色</span><span class="tag tag-purple">节点</span><span class="tag tag-red">白平衡</span><span class="tag tag-blue">二级调色</span><span class="tag tag-gray">讨论整理</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="davinci-colorist-workflow-图文实录.html">← 图文实录</a>
  <div class="summary-line">把 Color 页面板按专业动线重排：工作台 → 节点 → 清理 → LUT 前立轴 → 影调 → 二级分区 → 质感 → 动态 → 交付。核心不是会拧每个旋钮，而是知道当前在流水线的哪一站。</div>
  <div class="timeline"><h3>结构时间轴</h3><div class="timeline-item"><span class="timeline-time">01 工作台</span><span class="timeline-text">时间线·节点·示波器就位；光箱留给整场统一</span></div><div class="timeline-item"><span class="timeline-time">02 节点</span><span class="timeline-text">一事一节点；串行打底、并行纠偏</span></div><div class="timeline-item"><span class="timeline-time">03 清理</span><span class="timeline-text">降噪/修复 FX/输入大小，脏信号不进校色</span></div><div class="timeline-item"><span class="timeline-time">04 立轴</span><span class="timeline-text">色彩匹配或 Offset/色温；必须在技术 LUT 前</span></div><div class="timeline-item"><span class="timeline-time">05 影调</span><span class="timeline-text">HDR 分区塑光；曲线精确映射与哑光</span></div><div class="timeline-item"><span class="timeline-time">06 二级</span><span class="timeline-text">限定器·窗口·跟踪·键·切片·扭曲</span></div><div class="timeline-item"><span class="timeline-time">07 质感</span><span class="timeline-text">RGB 混合器防滤镜感；模糊控清晰度</span></div><div class="timeline-item"><span class="timeline-time">08 动态</span><span class="timeline-text">关键帧做光比/Look 渐变；遮罩跟人用跟踪</span></div><div class="timeline-item"><span class="timeline-time">09 交付</span><span class="timeline-text">光箱对白 → 示波器验收 → 快捷导出验证</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">清理信号</div><span class="arrow">→</span><div class="node-green">一级立轴</div><span class="arrow">→</span><div class="node-orange">影调二级</div><span class="arrow">→</span><div class="node">质感交付</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>· 不是从左到右点一遍图标；面板按「工位」挂到动线上才有意义。</p><p>· 白平衡主战场在技术 LUT 之前（Log 域 Offset）；LUT 后再拧全局色温是打补丁。</p><p>· HDR 校色轮不是「只给 HDR 成片用」，而是按亮度带分区塑光的一级增强工具。</p><p>· 键面板不画选区，只修蒙版力度与软硬；Look 浓度常用键输出增益控制。</p><p>· FCP 要严格 LUT 前后分工须用 Custom LUT 堆栈，Camera LUT 会钉死在最前。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解</h2><div class="card"><h3>动线优先于面板词典</h3><p>专业习惯是先问「我现在在清理、立轴、影调还是二级」。同一色轮在 LUT 前做白平衡、在 LUT 后做口味，工具身份不变、工位变了。示波器（Parade/Waveform）是裁判。</p><div class="quote">面板都会用，不如每次只问：我在动线的哪一站？</div><div class="relation">机制：先干净坐标系，再谈好看。</div></div><div class="card card-orange"><h3>节点 = 可开关的流水线</h3><p>串行承载线性职责（还原→变换→风格）；并行从同源分流保护肤色/局部暖色，避免串行污染。绿口传 RGB，蓝口传键；一事一节点便于粘贴同场与 Bypass 对比。</p><div class="quote">顺序即工位</div><div class="relation">对照：FCP 用效果堆栈模拟同一逻辑，上限在并行与键传递。</div></div><div class="card card-green"><h3>立轴：色卡或 Offset，且在变换前</h3><p>有 ColorChecker 用色彩匹配自动立中性与黑白位；无色卡用吸管/色温/Offset，Parade 三列对齐。技术 LUT/CST 放在立轴之后；之后节点只做饱和补偿与风格。</p><div class="quote">白平衡动轴，饱和动距</div><div class="relation">避坑：LUT 钉在首节点再校白 → 显示域分段打补丁。</div></div><div class="card card-purple"><h3>二级选型：色 / 形 / 动 / 力度</h3><p>同色物体→HSL 限定器；光区暗角→窗口（+跟踪）；整类色相收艳→切片器；某团颜色要挪→色度扭曲；软边与 Look 浓度→键面板。</p><div class="quote">先选对蒙版类型，再拧色轮</div><div class="relation">性价比：大窗口+柔化优先于像素级钢笔。</div></div><div class="card card-red"><h3>质感与交付收束</h3><p>RGB 混合器改通道关系防一键滤镜感；模糊/锐化配窗口做局部清晰度。关键帧管参数随时间变；遮罩跟人优先跟踪。最后光箱统一、示波器验收、快捷导出在真环境复看。</p><div class="quote">界面色 ≠ 成片色</div><div class="relation">行动：锚点镜定 Look，同场粘贴节点再微调。</div></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>本文覆盖 Color 页常用面板导览级理解，不是 Fusion/交付页完整手册。</li><li>ACES/RCM 标签细节、监视器校准流程未展开。</li><li>重度降噪与物体移除依赖机器性能；预览可关、导出再开。</li><li>混合色温场景全局白平衡无解，必须窗口/限定器分区。</li></ul><h3>避坑</h3><ul><li>每个面板都拧一点，没有节点职责与 Bypass 对比。</li><li>技术 LUT 在前、白平衡在后，高光色偏修不齐。</li><li>一级轮硬拧亮暖暗冷当风格，像错白平衡滤镜。</li><li>提亮暗部不保黑位，画面发灰。</li><li>Look/LUT 浓度拉满且不用键输出降浓度，全局易脏。</li></ul></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>九段动线：工作台 → 节点 → 清理 → 立轴 → 影调 → 二级 → 质感 → 动态 → 交付</li><li>三条铁律：LUT 前立轴；串行打底并行纠偏；示波器裁决</li><li>二级先选型（色/形/动/力度），再调颜色</li></ul><h3>行动清单</h3><ol><li>建串行模板节点：NR → WB/曝光 → 技术 LUT → HDR/曲线 → 二级 → Look</li><li>一级节点强制开 RGB Parade；交付前开光箱对白</li><li>二级优先窗口+柔化；跟人加跟踪；Look 用键输出控浓度</li><li>预览卡时关时域降噪，导出再开</li><li>每镜结束问：此刻 Bypass 掉风格节点，校正是否仍成立？</li></ol><h3>关键认知转变</h3><p>以前：把达芬奇当成滤镜面板词典从左点到右；现在：按调色师流水线给每个面板分配工位，先立轴再染色，用示波器和 Bypass 结案。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 证据来自讨论整理全文</div>
</div>
    </div>
  </foreignObject>
</svg>
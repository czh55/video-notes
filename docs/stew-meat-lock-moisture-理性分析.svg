      <div class="container root">
<h1>肉类：锁水窗口 × 炖焖两段火</h1>
<div class="meta">炖肉 · 锁水 · 上浆 · 火候 · 图文 · 图文 10 页</div>
<a href="https://xhslink.cn/o/AGPJWOhnFpV">原笔记</a>
<div class="summary">核心判断：嫩靠蛋白窗口与上浆锁水；香靠短时美拉德或先脱水；炖软靠小火胶原水解，润靠微火回汁；冻肉补水后于盐。</div>
<div class="card"><h3>炒嫩</h3><ul><li>65–80℃中心</li><li>盐+淀粉+蛋清三层</li></ul></div>
<div class="card"><h3>炖软润</h3><ul><li>80–95℃水解胶原</li><li>再微火焖回汁</li></ul></div>
<div class="card"><h3>目标分岔</h3><ul><li>嫩→锁水；香→先脱水</li><li>逢炖必炒</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>冻肉：水→盐→浆</li><li>炖肉：大火开→小火烂→微火润</li><li>先问这道菜要嫩还是要香</li></ul></div>
<div class="footer">video-notes · stew-meat-lock-moisture</div>
</div>

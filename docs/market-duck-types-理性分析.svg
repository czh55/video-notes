<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1236" viewBox="0 0 1320 1236">
  <foreignObject x="0" y="0" width="1320" height="1236">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;padding:48px 60px;color:#1e293b}h1{font-size:34px;font-weight:900;color:#1e40af;margin-bottom:8px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;border-left:5px solid #3b82f6}.card h3{font-size:20px;color:#1e40af;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f1f5f9;color:#1e40af}</style>
      <h1>选鸭：日龄先于品种名</h1>
<p>第 1 页只认脸。第 2 页给出总开关：不超过 120 天走爆炒、红烧、短焖；500 天以上走长炖。第 3–6 页都是这条线的例子。</p>
<div class="card"><h3>同一品种会分叉</h3>
<p>高邮鸭在第 4 页按老鸭炖汤、仔鸭做盐水鸭。巢湖鸭在第 6 页老鸭进汤，仔鸭可以进爆炒。只记品种名会买错火候。</p></div>
<table><tr><th>菜</th><th>第 6 页的鸭</th><th>第 3–5 页的避雷</th></tr>
<tr><td>烤、香酥</td><td>北京鸭、樱桃谷</td><td>樱桃谷不要炖过 2 小时；北京鸭不要长时间白水炖</td></tr>
<tr><td>汤</td><td>巢湖、绿头公、连城白、高邮</td><td>绍兴麻鸭瘦，不容易吊奶白汤</td></tr>
<tr><td>爆炒、干锅</td><td>绿头、金定、莆田黑、巢湖仔鸭</td><td>老巢湖不适合快炒</td></tr>
<tr><td>酱卤</td><td>绍兴、高邮、巢湖</td><td>绿头公鸭长时间慢卤会柴</td></tr></table>
<div class="card"><h3>边界</h3>
<p>第 2 页写明这是家常偏好。绿头公鸭只指养殖个体，禁猎写在同一页。品种名录公告号在第 3 页，笔记没有附公告正文。第 7 页的分钟数和 180℃ 是菜谱，不是所有锅具的完成时间。</p></div>
    </div>
  </foreignObject>
</svg>
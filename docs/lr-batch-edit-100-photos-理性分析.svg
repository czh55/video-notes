  <div class="card"><h3>封面/要点：​[种草R]家人们！五一旅行拍了几百</h3><p>​[种草R]家人们！五一旅行拍了几百张美照📸，却被修图累到崩溃？别慌！手机 LR</p></div><div class="card"><h3>第5/10页：五一必学｜ LR 批量修图｜5秒调</h3><p>​[种草R]家人们！五一旅行拍了几百张美照📸，却被修图累到崩溃？别慌！手机 LR</p></div><div class="card"><h3>第9/10页：五一必学｜ LR 批量修图｜5秒调</h3><p>​[种草R]家人们！五一旅行拍了几百张美照📸，却被修图累到崩溃？别慌！手机 LR</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">​[种草R]家人们！五一旅行拍了几百张美照📸，却被修图累到崩溃？别慌！手机 LR 的批量修图功能直接封神！手残党也能秒变修图大师✨，手把手教你快速出片，5秒搞定 100 张照片，赶紧码住学起来！​
	
一、导入照片​
1⃣ 打开 Lightroom，点击底部 “图库”，长按选中要修的所有照片（记得要是相同或相近场景拍的哦📷），再点击 “导入”，把照片统统导入 LR（图 2）。​
	
2⃣ 点击下方的 “lightroom”，接着点击左上角 “下箭头”（图 3），再点 “导入”，就能看到刚才导入的照片啦（图 4、图 5）！​
	
二、复制粘贴​
1⃣ 选样片精修：从导入的照片里挑一张最有代表性的当样片🌟，比如光线、色调最典型的那张。用 LR 的各种神仙工具（曝光、对比度、白平衡、HSL 等等）精细调整，调出你梦中情图的效果！​
	
2⃣ 复制参数：样片修完后，点击右上角的三个点图标（图 6），选择 “复制设置”（图 7）。裁剪、移除、蒙版、镜头模糊这些参数一般不选，当然也可以按实际需求来～选好后点击右上角的 “勾”（图 8），所有调整参数就保存好啦！​
	
3⃣ 批量粘贴：回到导入照片的</div>

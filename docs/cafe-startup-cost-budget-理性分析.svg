<div class="container">
  <h1>开一家咖啡店，到底要准备多少钱？</h1>
  <div class="meta">
    <span class="tag tag-blue">咖啡店</span><span class="tag tag-blue">开店预算</span><span class="tag tag-blue">现金流</span><span class="tag tag-blue">养店钱</span><span class="tag tag-blue">创业准备</span>
    <span class="tag tag-gray">4分07秒</span>
    <span class="tag tag-purple">理性分析 · 咖啡经营 · 启动资金</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/3sv78FfB0sR" target="_blank" rel="noopener">原视频（小红书短链）</a>
  <div class="summary-line">核心命题：开一家小咖啡店到底要准备多少钱？作者结论是「五万先别开、保底十万再启动」——预算必须同时准备开门钱与养店钱；小店模型示意开业前六到七万、缓冲三到四万。真正要防的不是开不了门，而是开门后没有现金撑过销量爬坡，被迫全面降标准进入恶性循环。文中金额为作者建议与示意，非某城报价。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    
      <div class="timeline-item">
        <div class="timeline-time">00:00</div>
        <div class="timeline-text">提问：到底要准备多少钱</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:05</div>
        <div class="timeline-text">五万不是启动线：先不要开</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:20</div>
        <div class="timeline-text">开门 ≠ 具备经营条件（缺养店钱）</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:24</div>
        <div class="timeline-text">建议：保底十万元再启动</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:40</div>
        <div class="timeline-text">只算开业第一天的投入清单</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:00</div>
        <div class="timeline-text">开业是持续花钱的开始</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:30</div>
        <div class="timeline-text">五万硬伤：爬坡期没钱→降标准</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:55</div>
        <div class="timeline-text">一次预算不足→经营恶性循环</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">02:05</div>
        <div class="timeline-text">两个账户：开门钱 + 养店钱</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">02:12</div>
        <div class="timeline-text">小店示意：6–7万 / 3–4万</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">02:35</div>
        <div class="timeline-text">用现金覆盖月数定义调整时间</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">02:50</div>
        <div class="timeline-text">有钱也不全花开业前；有效投入条件</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">03:00</div>
        <div class="timeline-text">8万店 vs 30万店：同赚1万回收难度不同</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">03:10</div>
        <div class="timeline-text">四件事：店型/一次性/月净流出/调整时间</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">03:20</div>
        <div class="timeline-text">开店前三张表</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">03:40</div>
        <div class="timeline-text">收束：保底十万再启动</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">03:50</div>
        <div class="timeline-text">互动与下期：保本杯量（本期未给数字）</div>
      </div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">问题</div>
          准备多少钱
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-red">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">否决</div>
          五万不够
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-orange">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">结构</div>
          开门+养店
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-purple">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">校验</div>
          覆盖月数
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-green">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">行动</div>
          三张表
        </div>
        
      
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解：预算=把店开起来的一次性总价。纠偏：还要准备把店养下去的经营缓冲。</p><p>误解：五万是值得尝试的低成本方案。纠偏：作者认为连开门都勉强，开业后更难维持。</p><p>误解：有十万就可以全花在装修和设备上。纠偏：开业当天账户里还要留缓冲；有二十/三十万也不必盲目做大买贵。</p><p>误解：贵设备/复杂装修天然更专业。纠偏：只有确实提高出杯效率、营业额、复购或降低停机风险，才可能是有效投入。</p><p>误解：总预算一个数字就算完。纠偏：要算店型、一次性投入、保守销量下月净流出、剩余现金能留多少调整时间。</p><p>立场分层：五万/十万阈值与 6–7万/3–4万拆分为作者经营建议与小店示意；非行业强制标准或某城市实测报价。本期未给出保本杯量。</p>
  </div>

  <h2 class="sec-title">观点卡片</h2>
  
    <div class="card card">
      <h3>在讲什么：把「总预算」改写成「还能经营多久」</h3>
      <p>关键理解：决策变量不是开门那天花了多少，而是开门后账户还能不能撑过销量尚未稳定的阶段。用法：任何启动金额都拆成开门钱与养店钱两本账。</p>
      <div class="quote">「不是能不能开门，而是开门以后还能不能继续经营」</div>
      <div class="relation">只算开业第一天 → 开门后持续支出无着落 → 被迫降标准。</div>
    </div>
  
    <div class="card card-red">
      <h3>在讲什么：五万为什么被否决</h3>
      <p>关键理解：在房租极低、无高转让费、装修设备压到极限且老板守店时，五万最多勉强开十平内小店，却很难留下爬坡现金。用法：别把「能开门」当成「能经营」。</p>
      <div class="quote">「五万元不是值得尝试的低成本方案」</div>
      <div class="relation">现金紧 → 机器/水电/原料全面压价 → 出品与体验变差 → 复购更难 → 更紧。</div>
    </div>
  
    <div class="card card-green">
      <h3>在讲什么：十万如何拆成两个账户</h3>
      <p>关键理解：小店模型示意开业前六到七万、缓冲三到四万，合起来对应保底十万。用法：先固定缓冲，再倒逼开业清单砍到「必须现在买」；用保守销量下的月净流出估算现金覆盖月数=调整时间。</p>
      <div class="quote">「这三到四万元能撑多久，不能靠感觉」</div>
      <div class="relation">缓冲不是闲钱装饰，是收入未稳阶段的生存时间。</div>
    </div>
  
    <div class="card card-purple">
      <h3>在讲什么：有效投入 vs 把回本做难</h3>
      <p>关键理解：同样月赚一万，前期投入八万与三十万的回收难度完全不同。用法：贵设备/复杂装修要能证明效率、营业额、复购或停机风险改善；否则只是抬高以后要收回的金额。</p>
      <div class="quote">「否则只是把以后需要收回的钱变多」</div>
      <div class="relation">资本开支上涨 → 保本压力上升；与「看起来更高级」不是同一回事。</div>
    </div>
  
    <div class="card card-orange">
      <h3>在讲什么：开店前三张表 + 四件事</h3>
      <p>关键理解：一次性投入表、每月固定与变动支出表、保守销量现金余额表；并把现在必须买与以后再加分开。用法：先定店型（外卖档口/社区店等），再填四件事，而不是先拍一个总金额。</p>
      <div class="quote">「真正该计算的不是一个孤立的总预算而是四件事」</div>
      <div class="relation">表做完才知道缓冲够不够；不够就不要用五万硬开。</div>
    </div>
  

  <div class="card">
    <h3>横向对照：数字能推出什么</h3>
    <table>
      <thead><tr><th>对照项</th><th>画面/口播示意</th><th>不能单独推出</th></tr></thead>
      <tbody>
        <tr><td>五万元</td><td>作者建议先别开；不是启动线</td><td>任何城市都绝对开不了任何档口</td></tr><tr><td>十万元</td><td>作者建议的保底启动资金</td><td>全国统一开工标准或必然盈利</td></tr><tr><td>6–7万 / 3–4万</td><td>小店模型下开门钱/养店钱拆分示意</td><td>你的城市房租与设备价也刚好落在此区间</td></tr><tr><td>8万店 vs 30万店</td><td>同月赚1万时回收难度不同</td><td>低投入一定更好或高投入一定更差</td></tr><tr><td>三张表</td><td>开业前必须做的现金规划动作</td><td>做完表就等于已验证市场</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>避坑总结</h3>
    <ul><li>只算开门清单，不算开业后持续支出与爬坡期现金。</li><li>把五万当成「低成本试错」而忽略恶性循环风险。</li><li>有十万就全砸装修设备，开业当天账户见底。</li><li>因有二十/三十万就盲目做大、买贵机。</li><li>靠感觉估计缓冲能撑多久，不做保守销量测算。</li><li>把本期未给出的保本杯量自行脑补成具体数字。</li></ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <p>开店预算的关键不是拍一个总价，而是同时准备开门钱与养店钱，并用保守销量下的现金覆盖月数衡量调整时间。作者建议：五万先别开，保底十万再启动；有钱也不要全砸开业前，贵投入必须能证明是有效投入。</p>
    <h3>行动清单</h3>
    <ol><li>列出开业前一次性投入，并标注「现在必须买」与「以后再加」。</li><li>另列每月固定与变动支出（房租、人工、水电、平台、原料等）。</li><li>用保守销量测算开业后月净流出与现金覆盖月数（调整时间）。</li><li>把总现金拆成开门钱与养店钱两本账；开业当天保留缓冲。</li><li>评估贵设备/复杂装修是否提升效率、营业额、复购或降低停机风险。</li></ol>
    <h3>关键认知转变</h3>
    <ul><li>以前：关心「总共要花多少」 → 现在：同时准备开门钱与养店钱</li><li>以前：能开门就算成功启动 → 现在：用现金覆盖月数定义调整时间</li><li>以前：有钱就升级设备装修 → 现在：先问是不是有效投入、会不会抬高回本</li></ul>
  </div>

  <div class="footer">双轨产物 · 理性分析 SVG · 与图文实录共享同一转录与画面证据 · b62g</div>
</div>

    </div>
  </foreignObject>
</svg>
      <div class="container">
<h1>跳绳姿势：三条「不要」清单</h1>
<div><span class="tag">24秒视觉短视频</span><span class="tag">小白白健身记</span></div>
<div class="summary-line">核心判断：这支短视频几乎不靠口播讲原理，而是用三条屏幕禁令快速纠偏——踮脚、抬小臂、勾脚跳太高。</div>
<div class="timeline">
  <div class="timeline-item"><span class="timeline-time">00:01</span><span>字幕「不要踮脚跳」</span></div>
  <div class="timeline-item"><span class="timeline-time">00:15</span><span>字幕「不要跳着跳着抬小臂」</span></div>
  <div class="timeline-item"><span class="timeline-time">00:20</span><span>字幕「不要勾脚跳的太高」</span></div>
  <div class="timeline-item"><span class="timeline-time">00:23</span><span>收束「你学会了吗」</span></div>
</div>
<div class="diagram">
  <div class="node">脚：别踮</div><div class="arrow">→</div>
  <div class="node">臂：别抬小臂</div><div class="arrow">→</div>
  <div class="node">跳：别勾脚冲高</div>
</div>
<div class="card">
  <h3>在讲什么 → 关键理解 → 怎么用</h3>
  <p>三条负向规则覆盖下肢触地方式、转绳动力来源、跳跃幅度。适合当作热身前的 10 秒自检，而不是完整生物力学课。</p>
  <div class="quote">口播依据：Whisper 仅「不要踮脚跳」；其余依据画面字幕。</div>
  <div class="action">怎么用：拍一段自己跳绳侧/正面视频，对照三条字幕逐项打叉。</div>
  <div class="pitfall">避坑：不要把「不要跳太高」理解成完全贴地；视频未给理想离地高度数值。</div>
</div>
<div class="card card-orange">
  <h3>方法边界</h3>
  <p>可验证事实：屏幕出现上述三条禁令文字。UP 主观点：这些是新手应直接抄的错误姿势对照。推断：抬小臂暗示应以腕转绳——片中未口述，属字幕语义推断。</p>
</div>
<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>行动清单</h3>
  <ul>
    <li>跳时检查脚跟是否周期性落地，而不是全程踮起。</li>
    <li>感觉前臂发酸上抬时，有意识把动作交回手腕。</li>
    <li>避免勾脚尖向后甩，控制离地高度。</li>
    <li>用手机侧拍 10 秒，对照三条字幕。</li>
  </ul>
  <h3>认知转变</h3>
  <ul>
    <li>以前：闷头多跳 → 现在：先消掉三个显式错误。</li>
    <li>以前：只看跳得高不高 → 现在：脚、臂、高度一起看。</li>
  </ul>
</div>
<div class="footer">视觉型短视频；口播分段极少。依据 shot 00:01–00:23 与笔记文案。</div>
</div>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1236" viewBox="0 0 1320 1236">
  <foreignObject x="0" y="0" width="1320" height="1236">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;padding:48px 60px;color:#1e293b}h1{font-size:32px;font-weight:900;color:#1e40af;margin-bottom:8px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}.card{background:#fff;border-radius:16px;padding:24px;margin:16px 0;border-left:5px solid #3b82f6}h3{font-size:20px;color:#1e40af;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f1f5f9;color:#1e40af}</style>
      <h1>干煸看皱和芯，不看油多不多</h1><table><tr><th>步骤</th><th>页</th><th>停手标准</th></tr><tr><td>盐抓杀水</td><td>2/6</td><td>厨房纸吸干，否则溅油、锅温掉</td></tr><tr><td>少油慢煸</td><td>3/6</td><td>3–4 汤匙，中小火 8–12 分钟，皱、深绿、微焦</td></tr><tr><td>肉末与香料</td><td>4/6</td><td>肉末到金黄；蒜和干辣椒只给 10–20 秒</td></tr><tr><td>熟透</td><td>5/6</td><td>鲜绿或硬芯都没熟；焯水不能代替煸熟</td></tr></table><div class="card"><h3>边界</h3><p>皂苷和植物血凝素是作者的安全提醒，图上没有剂量。5.4 元是这一盘的成本。肉末种类没有定。</p></div>
    </div>
  </foreignObject>
</svg>
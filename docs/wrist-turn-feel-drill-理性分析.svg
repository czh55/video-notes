      <div class="container">
<h1>跳绳转腕：四向定位找「画圈」感觉</h1>
<div><span class="tag">41秒视觉短视频</span><span class="tag">橙橙Zz</span><span class="tag">口播不可用</span></div>
<div class="summary-line">核心判断：转腕 = 以手腕为中心画圈；找不到感觉时，先用手柄指向的上→前→下→后四点定位，再连成圈，并保持手柄与绳体共线、禁止用手柄拉扯绳子。</div>
<div class="timeline">
  <div class="timeline-item"><span class="timeline-time">00:00</span><span>定义：转手腕是以手腕为中心画圈</span></div>
  <div class="timeline-item"><span class="timeline-time">00:02–11</span><span>四向：1向上 → 2向前 → 3向下 → 4向后</span></div>
  <div class="timeline-item"><span class="timeline-time">00:14</span><span>连起来 = 手腕中心画圈；角度不明显就纠那个方向</span></div>
  <div class="timeline-item"><span class="timeline-time">00:24</span><span>手柄与绳结上方绳体尽量同一直线</span></div>
  <div class="timeline-item"><span class="timeline-time">00:34–39</span><span>腕圈带动手柄追绳；禁上下/前后扯绳</span></div>
</div>
<div class="diagram">
  <div class="node">上</div><div class="arrow">→</div>
  <div class="node">前</div><div class="arrow">→</div>
  <div class="node">下</div><div class="arrow">→</div>
  <div class="node">后</div><div class="arrow">→</div>
  <div class="node">连成腕圈</div>
</div>
<div class="card">
  <h3>在讲什么 → 关键理解 → 怎么用</h3>
  <p>问题不是「手腕转不起来」，而是缺少可检查的空间锚点。作者把抽象手感拆成手柄头扫过的四个方位；胳膊少乱动，腕心当圆心。</p>
  <div class="quote">笔记补充：往下、往后转时手心翻转向前——属作者经验，片中未单独口播验证。</div>
  <div class="action">怎么用：站姿慢转柄，口头报「上前下后」，自拍检查四点是否都指到位，再加速连成圈。</div>
  <div class="pitfall">避坑：把四个点练成停顿式「摆姿势」，而不是连续扫过；或肩肘代偿画大圈。</div>
</div>
<div class="card card-purple">
  <h3>手柄—绳体关系（作者手感因果）</h3>
  <p>屏幕主张：夹角越小 → 绳对手的拉扯越小 → 更好控、少磨手/腕疼、手感不那么重。证据层级是作者经验叙述，未给测力或角度阈值。</p>
  <table>
    <tr><th>可验证画面</th><th>作者观点</th><th>推断（片外）</th></tr>
    <tr><td>四向蓝标与箭头；共线橙条；禁令红框</td><td>腕圈追绳、共线更轻、别扯绳</td><td>共线近似减小杠杆式拉扯——未实测</td></tr>
  </table>
</div>
<div class="card card-orange">
  <h3>方法边界</h3>
  <p>适合：珠节/有柄跳绳、已会基本跳跃但「转不动手腕」的人。不适合：当作伤病康复处方，或替代完整跳绳课（脚法、节奏、绳长未讲）。口播 ASR 全废，结论不得引用 Whisper 文本。</p>
</div>
<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>行动清单</h3>
  <ul>
    <li>慢速报数练四向，确认柄头真指向上/前/下/后。</li>
    <li>连成连续腕圈，哪个方向「糊」就单练那个方向。</li>
    <li>跳起来时瞟一眼：手柄是否与绳结上方绳体大致共线。</li>
    <li>自觉在上下前后硬拽绳时，立刻把动作交回手腕画圈。</li>
  </ul>
  <h3>认知转变</h3>
  <ul>
    <li>以前：凭感觉猛甩胳膊 → 现在：腕心画圈，柄头追四个点。</li>
    <li>以前：怪绳子沉、磨手 → 现在：先查夹角与是否在扯绳。</li>
  </ul>
</div>
<div class="footer">视觉型短视频；Whisper 仅「Zither Harp」。依据屏幕字幕、箭头标注与笔记文案（shot 00:00–00:39）。</div>
</div>
    </div>
  </foreignObject>
</svg>
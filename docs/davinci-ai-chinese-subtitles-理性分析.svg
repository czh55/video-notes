  <h1>达芬奇AI中文字幕｜一键生成超省事 终于发现</h1>
  <div><span class="tag">达芬奇</span><span class="tag">教程</span><span class="tag">小红书</span></div>
  <p class="summary-line">阿芬奇也支持中文字幕识别,操作使用也是非常简单,选择时间线,AI tools,从音频创建字幕,语言选择中文普通话,简体。</p>
  <div class="card"><h3>阿芬奇也支持中文字幕识别,操作使用也是非常简单,</h3><p>阿芬奇也支持中文字幕识别,操作使用也是非常简单,选择时间线,AI tools,从</p></div><div class="card"><h3>选择字幕在右侧的检查器里面,可以修改错别字。点击</h3><p>选择字幕在右侧的检查器里面,可以修改错别字。点击轨道可以对全部的字幕进行一个整体</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">阿芬奇也支持中文字幕识别,操作使用也是非常简单,选择时间线,AI tools,从音频创建字幕,语言选择中文普通话,简体。<br/>最大值可以改小一点,因为这个字符数是按照英文的标准,还可以改成单行或者双行。点击创建,等待识别完成就可以了。<br/>选择字幕在右侧的检查器里面,可以修改错别字。点击轨道可以对全部的字幕进行一个整体修改。<br/>修改字体,颜色,大小,描边,投影等,基本可以满足日常需求。</div>
  <div class='pitfall'>口播可能有同音错字，已按画面步骤校对；参数以检查器实值为准。</div>
  <div class='bound'>短视频速览；具体菜单名以你安装的 Resolve 语言包为准。</div>
  </div>

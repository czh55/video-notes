  <div class="conclusion"><h2>结论</h2><p>画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山改成了口诀那种浅蓝灰，B 是原图：吉卜力的远山是深蓝的，比山顶那片天还蓝。
	
</p></div>

<div class="container">
  <h1>怎么画远山1｜看看吉卜力和达芬奇怎么上色</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山改成了口诀那种浅蓝灰，B 是原图：吉卜力的远山是深蓝的，比山顶那片天还蓝。
	
</p>
  <div class="card"><h3>封面/要点：画远山，你是不是也背过“远处偏蓝、变</h3><p>画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山</p></div><div class="card"><h3>第5/11页：怎么画远山1｜看看吉卜力和达芬奇怎</h3><p>画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山</p></div><div class="card"><h3>第9/11页：怎么画远山1｜看看吉卜力和达芬奇怎</h3><p>画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">画远山，你是不是也背过“远处偏蓝、变淡”？封面是同一张《岁月的童话》，A 把远山改成了口诀那种浅蓝灰，B 是原图：吉卜力的远山是深蓝的，比山顶那片天还蓝。
	
我量了 28 张动画、20 张名画、113 张当代插画，又补了吉田博、川瀬巴水、洛里奇这些名家的 30 张，看远山到底跟着什么变。说到底是一句话：山反射的光穿过空气会减弱，空气又把一部分光散射进我们眼里，看到的远山是这两部分叠在一起。所以隔得越远，远山越往地平线那片天靠。这批样本能比的 188 张里，156 张远山比近景更接近天的颜色。
	
顺着这句话往下推，好几条“例外”就说得通了。晴天的远山多数比天暗，一半的画暗了快两成，往天靠不等于和天差不多；阴天、起雾，远山跟着发灰发白。“变淡”也不一定，因为远山是往天靠，不是往白靠：近处是暗树林，远山显得亮；近处草地被太阳照得很亮，远山反而更暗。同一样东西搬远了也是这样：被照亮的雪会暗下来，背光的林子会亮起来，都只是往天靠，不会越过天。
	
还有一条挺意外：远山比天暗，颜色却可以比天还蓝，一个说明暗，一个说颜色。晴天的插画 48 张里，22 张远山被画得比山顶那片天更蓝。是自然本来这样</div>

.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>掌握面筋松弛感：发面基础</h1>
  <div class="meta"><span class="tag tag-blue">面筋</span><span class="tag tag-green">松弛</span><span class="tag tag-orange">弹性</span><span class="tag tag-purple">可塑性</span><span class="tag tag-gray">时长 10分10秒</span><span class="tag tag-gray">理性分析 · 结构机制</span></div>
  <a class="source-link" href="https://xhslink.cn/o/64FkrmNShQ1">原视频</a>
  <div class="summary-line">核心判断：面筋同时拥有弹性与可塑性，但不会在同一时刻拉满两者；整形的关键是等松弛完成状态切换——好搓就上，不好搓就放。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">洗面出现面筋</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">麦谷/麦胶原料</span></div><div class="timeline-item"><span class="timeline-time">03:30</span><span class="timeline-text">弹性网与可塑胶</span></div><div class="timeline-item"><span class="timeline-time">05:40</span><span class="timeline-text">松弛=活结松开</span></div><div class="timeline-item"><span class="timeline-time">06:50</span><span class="timeline-text">中间饧发10–20分钟</span></div><div class="timeline-item"><span class="timeline-time">08:40</span><span class="timeline-text">成团前调水</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">原料<br/>两种蛋白+水</div><span class="arrow">→</span><div class="node-green">结构<br/>弹簧网+胶水</div><span class="arrow">→</span><div class="node-orange">状态<br/>紧张↔松弛</div><span class="arrow">→</span><div class="node-blue">行动<br/>等待再整形</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：面团应又弹又软同时最强。纠偏：两者分时出现。</p><p>误解：回缩就要更用力揉。纠偏：硬揉会更紧或撕网，应等待。</p><p>误解：成团后还能随意加水。纠偏：黄金窗口在成团前。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：面筋是骨架</h3>
      <p>洗面多出来的可吃网络；无它面包撑不住。</p>
      <div class="quote">它扮演着骨架的角色</div>
      <div class="relation">油麦粉对照证明「无筋」后果。</div>
    </div>
    <div class="card card-green">
      <h3>关键理解：相反特性共存</h3>
      <p>麦谷给弹性，麦胶给可塑；靠状态切换统一。</p>
      <div class="quote">它俩并非同时出现</div>
      <div class="relation">解释为何揉完要饧。</div>
    </div>
    <div class="card card-purple">
      <h3>怎么用：松弛口诀</h3>
      <p>先松弛再整形；复杂造型可多次静置。</p>
      <div class="quote">好搓就上不好搓就放</div>
      <div class="relation">压面机同样适用。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：硬低水面团</h3>
      <p>贝果类可能半小时仍紧，可延长并分段静置。</p>
      <div class="quote">增加到一小时都别慌</div>
      <div class="relation">吐司法棍仍难则先查水量。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">状态对照</h2><div class="card"><table><thead><tr><th>状态</th><th>手感</th><th>适合做</th></tr></thead><tbody><tr><td>紧张（刚揉）</td><td>回弹强、难擀</td><td>继续揉筋／排气前</td></tr><tr><td>松弛（静置后）</td><td>绵、易塑</td><td>整形、擀皮</td></tr><tr><td>静置过久</td><td>发酵过度风险</td><td>组织／支撑变差</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>蛋白质名称口语化，非教材级生化。</li><li>时间区间为经验值，随配方变化。</li></ul><div class="pitfall">回缩时加暴力。</div><div class="pitfall">整形阶段才发现水少却硬加水。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>面筋=可切换的网。</li><li>整形前先等。</li><li>水在成团前调。</li></ul><h3>行动清单</h3><ol><li>整形前强制静置并记录分钟。</li><li>回缩立刻停手计时。</li><li>下次揉面先看面絮再成团。</li></ol><h3>关键认知转变</h3><p>从「力气塑形」转向「等状态再动手」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 10分10秒</div>
</div>
    </div>
  </foreignObject>
</svg>
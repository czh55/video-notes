<div class="container">
  <h1>ISO 25600，真的是相机犯蠢了吗？</h1>
  <div><span class="tag">摄影</span><span class="tag">光影</span><span class="tag">教程</span></div>
  <p class="summary-line">你拍鸟,快门射1600分之一秒,光圈射F9,结果相机直接给你ISO25600,你第一反应是什么?</p>
  <div class="card"><h3>你拍鸟,快门射1600分之一秒,光圈射F9,结果</h3><p>你拍鸟,快门射1600分之一秒,光圈射F9,结果相机直接给你ISO25600,你</p></div><div class="card"><h3>那不同曝光模式其实就是谁决定什么的分配不同。</h3><p>那不同曝光模式其实就是谁决定什么的分配不同。</p></div><div class="card"><h3>第一个,最高ISO,这是你的画质底线。</h3><p>第一个,最高ISO,这是你的画质底线。</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">你拍鸟,快门射1600分之一秒,光圈射F9,结果相机直接给你ISO25600,你第一反应是什么?<br/>这自动ISO也太蠢了吧,但我们今天就算一笔账,在这个光线条件下,你坚持1600分之一秒和F9,相机其实根本没有别的选择。<br/>不是相机不会算,是你给它出的题根本没有DISO的答案。<br/>先别急着记ISO是什么,你真正要搞懂的是相机到底在替你解决什么问题。<br/>拍照的时候你其实在做三个决定,光圈,决定你要多少景深,多少虚化,快门,决定你要冻结动作还是拖动残影。</div>
  <div class='pitfall'>口播可能有同音错字；菜单名/参数以软件实机为准。</div>
  <div class='bound'>摄影基础向；器材与场地条件不同时参数需微调。</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>你拍鸟,快门射1600分之一秒,光圈射F9,结果相机直接给你ISO25600,你第一反应是什么?</p></div>

.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>你对我付出了什么？</h1>
  <div class="meta"><span class="tag tag-blue">猫</span><span class="tag tag-green">关系梗</span><span class="tag tag-orange">付出</span><span class="tag tag-gray">时长 26秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9UlgbLqgNff">原视频</a>
  <div class="summary-line">用猫对峙演绎「付出清单」闭环：质问付出→反问图谋→揭示留下本身即收益。视觉梗，不作情感指南。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">质问付出</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">反问图什么</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">为何在意付出</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">不走因已得到</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">质问<br/>你付出什么</div><span class="arrow">→</span><div class="node-green">反击<br/>你图什么</div><span class="arrow">→</span><div class="node-orange">收束<br/>留下=已得</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>Whisper 无效，全文依画面字幕。</p><p>猫行为被拟人化，非动物行为学结论。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>付出辩论的镜像结构</h3>
      <p>一方要清单，另一方用「你图什么」把举证责任拨回，形成短视频爽感。</p>
      <div class="quote">你对我付出了什么？ / 你图我什么</div>
      <div class="relation">修辞：闭环质问适合梗，不适合认真调解。</div>
    </div>
    <div class="card card-orange">
      <h3>「不走」被解释成已经获利</h3>
      <p>结尾把继续关系本身当作对方已得收益，终止清单游戏。</p>
      <div class="quote">因为你已经得到了你想要的</div>
      <div class="relation">分层：剧本推理，不是对真实关系的验证。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>26 秒娱乐向，无方法论展开。</li><li>勿将字幕话术直接用于冲突升级。</li></ul><div class="pitfall">把拟人字幕当成猫的真实动机。</div><div class="pitfall">在现实争执中复制「闭环质问」导致冷战。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>结构是质问-镜像-收束</li><li>适合当梗</li><li>不适合当处方</li></ul><h3>行动清单</h3><ol><li>当表情包理解即可</li><li>若讨论真实关系，改用具体事件而非清单对轰</li></ol><h3>关键认知转变</h3><p>以前：被「你付出了什么」堵死；现在：能看穿短视频如何把话术闭环制造爽感。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 26秒</div>
</div>
    </div>
  </foreignObject>
</svg>
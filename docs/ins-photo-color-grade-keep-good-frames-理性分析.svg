  <foreignObject x="0" y="0" width="1320" height="1875">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}.container{max-width:1200px;margin:0 auto}h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}h2{font-size:24px;color:#1e40af;margin:28px 0 14px}.summary-line{font-size:18px;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin:16px 0}.card{background:#fff;border-radius:16px;padding:28px;margin:16px 0;border-left:5px solid #3b82f6;box-shadow:0 4px 24px rgba(0,0,0,.06)}.card h3{color:#1e40af;margin-bottom:10px}.action{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:10px 0;border-left:4px solid #3b82f6}.pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:10px 0;border-left:4px solid #ef4444;color:#991b1b}ul{padding-left:22px}li{margin:6px 0;color:#475569}.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:32px;margin-top:28px}.conclusion h2{color:#fff}.footer{text-align:center;color:#94a3b8;font-size:13px;padding:28px 0}</style>
      <div class="container">
<h1>构图留底，调色交货</h1>
<p class="summary-line">十组 Yes/But：野生题材同一构图，用对比度、分区曝光与色温把灰雾 Raw 收成可发布画面——不要删掉「构图不错但还没调色」的片子。</p>
<div class="card"><h3>核心命题</h3><p>删除键不该惩罚未完成的后期；该惩罚的是无主体、无光位的废片。</p></div>
<div class="card"><h3>十组对照</h3><ul><li>松鼠逆光剪影 Yes vs 提亮细节 But</li><li>大象水岸金线 Yes vs 头顶留白过多 But</li><li>哈欠虎雾林 Yes vs 欠曝灰雾 But</li><li>羚羊日落剪影 Yes vs 扁平暖金 But</li><li>瀑布崖壁 Yes vs 雾霾平灰 But</li><li>雄狮草地 Yes vs 环境均亮 But</li><li>雾林鹿 Yes vs 灰片无层次 But</li><li>灰冠鹤 Yes vs 低饱和灰底 But</li><li>双虎互动 Yes vs 雾霾 Raw But</li><li>豹脸特写 Yes vs 过暖草绿 But</li></ul></div>
<div class="card"><h3>行动清单</h3>
<div class="action">入库标准：主体清晰 + 光位成立 → 再谈调色；调色顺序：遮罩压背景 → 曲线对比 → 色温情绪。</div>
<div class="pitfall">忌：因欠曝/灰雾直接删除；忌：全局提亮抹掉剪影；忌：只加饱和不加对比。</div></div>
<div class="conclusion"><h2>结论</h2><p>Yes 是承诺兑现，But 是半成品。ins 风野生片的关键产能，藏在「敢留灰片」的工作流里。</p></div>
<p class="footer">小红书 · Lee的审美积累</p></div>
    </div>
  </foreignObject>
</svg>
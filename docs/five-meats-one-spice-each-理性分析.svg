.root-wrap{background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px}</style>
      <div class="container root-wrap">
<h1>五肉一味：去腥配对表</h1>
<div class="meta"><span class="tag tag-orange">烹饪</span><span class="tag tag-blue">香料化学</span><span class="tag tag-green">去腥</span></div>
<div class="summary-line">核心判断：腥源化学不同，葱姜蒜只能打辅助；用「本命香料」对准分子，比料酒堆料更稳。</div>
<div class="timeline"><h3>关键证据时间轴</h3>
<div class="timeline-item"><span class="timeline-time">00:34</span><span>五类腥≠一种</span></div>
<div class="timeline-item"><span class="timeline-time">00:51</span><span>猪/牛</span></div>
<div class="timeline-item"><span class="timeline-time">02:10</span><span>羊/鸡</span></div>
<div class="timeline-item"><span class="timeline-time">03:32</span><span>鱼白芷/紫苏</span></div>
</div>
<div class="diagram">
<div class="node node">认腥源</div>
<div class="arrow">→</div>
<div class="node node node-orange">选本命料</div>
<div class="arrow">→</div>
<div class="node node node-green">葱姜辅佐</div>
</div>
<div class="correction"><h3>常见误解纠偏</h3><p>「多放葱姜蒜总管用」「牛羊都扔八角」会错配；炒炖胡椒颜色也别反着来。</p></div>
<div class="card "><h3>配对速记</h3>
<table><tr><th>肉</th><th>本命</th><th>备注</th></tr>
<tr><td>猪</td><td>八角</td><td>脂肪腥</td></tr>
<tr><td>牛</td><td>胡椒+迷迭香</td><td>炒黑炖白</td></tr>
<tr><td>羊</td><td>孜然+小茴香</td><td>膻在脂肪</td></tr>
<tr><td>鸡</td><td>花椒</td><td>骨髓渗腥</td></tr>
<tr><td>鱼</td><td>白芷炖/紫苏烧</td><td>三甲胺+泥腥</td></tr>
</table>
</div>
<div class="conclusion"><h2>总结与行动</h2>
<h3>核心要点</h3><ul><li>化学配对 &gt; 料多</li><li>葱姜是辅路</li><li>鱼要分炖/烧</li></ul>
<h3>行动清单</h3><ul><li>冰箱常备八角花椒白胡椒孜然紫苏</li><li>炖牛改白胡椒</li><li>淡水鱼红烧加紫苏</li></ul>
</div><div class="footer">video-notes · b65u · 理性分析</div></div>

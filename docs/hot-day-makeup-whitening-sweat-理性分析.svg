<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2402" viewBox="0 0 1320 2402">
  <foreignObject x="0" y="0" width="1320" height="2402">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:32px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:22px;font-weight:700;color:#1e40af;margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
h3{font-size:17px;font-weight:700;color:#334155;margin-bottom:8px}
p,li{font-size:15px;line-height:1.75;color:#475569;margin-bottom:6px}
ul,ol{padding-left:22px}
.tag{display:inline-block;padding:4px 12px;border-radius:18px;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:4px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-red{background:#fee2e2;color:#991b1b}.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:10px 0 16px}
.summary-line{font-size:16px;line-height:1.7;padding:16px 20px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:16px;color:#334155;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:14px;padding:18px 22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline-item{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:13px;font-weight:700;color:#3b82f6;min-width:64px}
.timeline-text{font-size:14px;color:#475569}
.diagram{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:12px 0;background:#fff;border-radius:14px;margin-bottom:16px}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:12px;padding:12px 14px;text-align:center;min-width:120px;font-weight:700;font-size:13px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.node-red{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fca5a5;color:#991b1b}
.arrow{font-size:20px;color:#94a3b8}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;border-left:5px solid #3b82f6;box-shadow:0 3px 16px rgba(0,0,0,.04)}
.card.card-orange{border-left-color:#f59e0b}.card.card-green{border-left-color:#10b981}.card.card-red{border-left-color:#ef4444}
.card .pitfall{background:#fef2f2;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:13px;color:#991b1b}
.card .action{background:#eff6ff;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:13px;color:#1e40af}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:14px 18px;border-radius:12px;margin-bottom:14px}
.correction h3,.correction p{color:#92400e}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
th{background:#f1f5f9;padding:10px 12px;text-align:left;color:#1e40af}td{padding:10px 12px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:18px;padding:28px;margin-top:20px}
.conclusion h2{color:#fff;border:none;margin-top:0}.conclusion li,.conclusion p{color:rgba(255,255,255,.92)}
.footer{text-align:center;color:#94a3b8;font-size:12px;padding:24px 0 8px}
.root-wrap{background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:8px}</style>
      <div xmlns="http://www.w3.org/1999/xhtml"><div class="container root-wrap">
  <h1>标题是出汗妆，内容是万能句型包</h1>
  <div class="meta"><span class="tag tag-blue">英语</span><span class="tag tag-green">资料分享</span><span class="tag tag-red">标题偏差</span><span class="tag tag-gray">2分34秒</span></div>
  <div class="summary-line">外链文案强调热天妆白化出汗，口播主线却是生活开场 + 万能句型/词块资料与练习法。分析以 ASR 为准，并标注标题偏差。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">浮夸穿搭开场</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">侄子来杭 / 逛吃</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">万能句型资料约30篇</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">make/take/how was 例</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">主系表/主谓宾+块</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">孩子练习+合集+豆包</span></div></div>
  <div class="diagram"><div class="node node-red">标题：妆白化/出汗</div><div class="arrow">≠</div><div class="node node-green">口播：句型资料包</div></div>
  <div class="correction"><h3>边界 / 证据限制</h3><p>ASR：万能巨星→句型；主卫兵/主戏表→主谓宾/主系表；拜当劳→麦当劳。</p></div>
  <h2>结构化观点</h2>
  <div class="card card-green"><h3>内容主线</h3><p>高频块（make/take…）叠在基本句型上，强调开口与抗遗忘。</p></div><div class="card "><h3>方法</h3><p>真实对话对象（孩子）+ 主页合集 + LLM topic 展开。</p></div><div class="card card-red"><h3>偏差处理</h3><p>不把本文写成防脱妆教程。</p></div>
  
  <div class="conclusion">
    <h2>总结与行动</h2>
    <ul><li>消费标题前先核对口播。</li><li>资料包的价值在「块+句型+使用场景」。</li></ul>
    <h3>行动</h3>
    <ol><li>从 make/take 各写 5 个搭配并造句。</li><li>选 1 个 how was… 情景每日问答。</li></ol>
    <h3>避坑</h3>
    <ul><li>只收藏资料不开口。</li><li>按标题期待美妆步骤会失望。</li></ul>
  </div>
  <div class="footer">双轨产物 · 理性分析 · 证据来自转录与画面</div>
</div></div>
    </div>
  </foreignObject>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2544" viewBox="0 0 1320 2544">
  <foreignObject x="0" y="0" width="1320" height="2544">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff7ed;color:#292524}
.wrap{padding:44px 56px 36px}
h1{font-size:32px;line-height:1.35;color:#1c1917;margin-bottom:8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:#b45309;margin-bottom:8px}
.meta{font-size:14px;color:#78716c;margin-bottom:16px}
.meta a{color:#b45309}
.lede{font-size:17px;line-height:1.7;background:#fff;border-left:4px solid #b45309;border-radius:12px;padding:16px 18px;margin-bottom:22px;color:#44403c}
h2{font-size:22px;color:#9a3412;margin:26px 0 12px}
h3{font-size:16px;color:#1c1917;margin-bottom:8px}
p,li{font-size:15px;line-height:1.7;color:#44403c}
ul,ol{padding-left:22px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:8px}
th{background:#ffedd5;color:#9a3412;text-align:left;padding:10px 12px;font-size:13px}
td{padding:10px 12px;border-top:1px solid #fed7aa;vertical-align:top;font-size:14px;color:#44403c}

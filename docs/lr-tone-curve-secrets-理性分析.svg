  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天带大家玩转LR颜色曲线工具🚀这可是调色大神都爱用的“调色之王”，掌握它，绝美色调轻松拿捏，晋升大神不是梦！
	
[种草R]简单回顾下白色曲线。曲线由横、纵坐标和45度直线构成，从下到上对应黑、阴影、曝光、高光、白色5区域。这次的“红、绿、蓝”3根颜色曲线，和白色曲线逻辑相通（参考图2）。
	
▶️实战环节
	
问题[一R]：暗部加红、中间加绿、高光加蓝咋操作？
	
[种草R]点红色曲线，在中间及亮部打锚点固定，上拉暗部锚点，暗部瞬间添红（参考图3）。
	
[种草R]点绿色曲线，在暗部和高光打锚点，上拉中间锚点，中间绿色饱满起来（参考图4）。
	
[种草R]点蓝色曲线，固定暗部和中间，上拉高光明锚点，高光就有蓝色啦（参考图5）。
	
问题[二R]：中间区域加黄色咋弄？
	
[种草R]曲线没直接的黄色，怎么办呢？别着急，用上节课互补色口诀“红绿蓝-青品黄”。互补色是此消彼长关系：
	
🔴红色增加，青色减少；反之亦然，色轮上二者相对。
🟢绿色增加，洋红色减少；绿色减少，洋红色增加。
🔵蓝色增加，黄色减少；蓝色减少，黄色增加。
	
[种草R]办法就是下调中间区域蓝色曲线，</div>

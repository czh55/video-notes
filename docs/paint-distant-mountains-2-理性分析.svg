  <h1>怎么画远山系列2｜远山无石，隐隐如眉</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近。
	

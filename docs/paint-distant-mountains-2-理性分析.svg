  <div class="card"><h3>封面/要点：上一篇讲远山跟着天变颜色，那只用墨色</h3><p>上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近</p></div><div class="card"><h3>第5/13页：怎么画远山系列2｜远山无石，隐隐如</h3><p>上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近</p></div><div class="card"><h3>第9/13页：怎么画远山系列2｜远山无石，隐隐如</h3><p>上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近</p></div><div class="card"><h3>第13/13页：怎么画远山系列2｜远山无石，隐隐</h3><p>上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">上一篇讲远山跟着天变颜色，那只用墨色的山水呢？不靠蓝色，也能靠浓淡和疏密画出远近。
	
古人有句口诀，传为王维：远山无石，隐隐如眉。远山不细画石头，淡淡一道，像眉毛。动画背景也能借这个思路：远处少画细节，或用留白分开前后。少画不等于画糊。
	
为什么省掉石头，山反而远？远处的纹理既变小，又可能被空气削弱反差，细小、低反差的石缝更容易看不清，大轮廓仍可保留。郭熙说“非无也，如无耳”，不是没有画是看起来像没有。
	
也不是一律淡。晴天空气清，吉田博《穗高山》的远山还留着山脊和残雪；雾天可以省掉更多细节。髡残这张远山更深、纹理起伏更强；查士标这张远近墨色接近，远处纹理并没有减弱。青绿山水还会给远山设色。淡和无石是常用办法，不是规矩。</div>

  <div class="card"><h3>行动清单</h3><div class="action">▶️认识Lightroom
	
🌱宝子们，今天东哥给你们唠唠一款超好用的修图调色APP，叫Lightroom。不管你是摄影小白，还是修图大神，都能在里面找到乐趣。今天主要就是带大家初步认识一下它，后面我会一步一步，从简单到复杂，仔仔细细地教大家怎么用。
这软件有免费的功能，也有付费的。需要全功能免费安装包的，关注➕群获取哦。
	
▶️功能详解
	
[一R]裁剪工具：这个工具就像是给照片“整容”。有时候咱们拍的照片，构图不太满意，就可以用它二次构图。你想把照片裁剪成正方形，就选一比一的比例，然后在照片上拖动调整，把你想要的部分框起来，一张新构图的照片就诞生啦！除了一比一，还有像五比四、十六比九等比例，你要是有特殊要求，注意：横构图、竖构图切换点“完成”左边的“小框”哦。（图2）
	
[二R]一键滤镜（预设）：这个功能简直是懒人的福音！里面有一大堆现成的滤镜。什么现代风、艺术效果，各种风格都有。随便选一个滤镜，照片马上就换上了新“妆容”，调色就这么简单，分分钟让你的照片变得高大上。（图3）
	
[三R]自动功能：它能根据照片的情况，自动帮你调色修图。如果你一次性有好多照片要处理，这个自动功</div>

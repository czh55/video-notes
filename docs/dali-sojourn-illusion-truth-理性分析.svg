<h1>大理旅居：把幻觉换成账单清单</h1>
<div class="meta">大理 · 旅居 · 云南 · 生活方式 · 图文 · 图文 11 页</div>
<a href="https://xhslink.cn/o/37YzEj4asZ9">原笔记</a>
<div class="summary">核心判断：旅居失败点不在风景不够美，而在把旅游消费习惯、住房条件、跨片区交通、雨季与远程工作账，误当成「换城自动清零」。</div>
<div class="card"><h3>钱与吃</h3><ul><li>开销看账单与习惯，不看城市名</li><li>特产尝鲜≠每日吃饭闭环</li></ul></div>
<div class="card"><h3>住与走</h3><ul><li>住房六件套：光/声/水/厨/洗/网</li><li>雨季与跨片区决定真实半径</li></ul></div>
<div class="card"><h3>工作与心</h3><ul><li>远程工作仍有交付与收入约束</li><li>情绪行李会跟行李箱一起到</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>先试住普通工作日+雨天</li><li>列愿意接受的不方便清单</li><li>别用明信片照片决定长租</li></ul></div>
<div class="footer">video-notes · dali-sojourn-illusion-truth</div>

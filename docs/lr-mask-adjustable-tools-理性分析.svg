  <div class="card"><h3>封面/要点：[种草R]家人们！东哥又来带着大家玩</h3><p>[种草R]家人们！东哥又来带着大家玩转 LR 修图啦💥！今天咱们重点盘一盘蒙版里</p></div><div class="card"><h3>第5/10页：解锁隐藏功能｜LR蒙版可调工具详解</h3><p>[种草R]家人们！东哥又来带着大家玩转 LR 修图啦💥！今天咱们重点盘一盘蒙版里</p></div><div class="card"><h3>第9/10页：解锁隐藏功能｜LR蒙版可调工具详解</h3><p>[种草R]家人们！东哥又来带着大家玩转 LR 修图啦💥！今天咱们重点盘一盘蒙版里</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们！东哥又来带着大家玩转 LR 修图啦💥！今天咱们重点盘一盘蒙版里的修图选项和编辑里的选项到底有啥不一样！
	
[种草R]点开蒙版能看到 “亮度、颜色、效果、细节、光学” 几个工具（图2），编辑里有 “自动、亮度、颜色、模糊、效果、细节、光学、配置文件”（图3）。编辑里的工具之前都讲过，今天就主攻蒙版和编辑里都有的工具用法差异～
	
[彩虹R]亮度工具
蒙版里的 “亮度” 少了曲线功能，其他和编辑里的基本一致！虽然少了曲线，但该调亮调暗还是能满足日常修图需求哒
	
[彩虹R]颜色工具
这个工具差异超大，家人们快拿小本本记好📒！
	
[种草R]蒙版颜色：少了 “分级”“混合” 和 “自然饱和度”，但多了 “色相” 和 “颜色” 小工具！
	
[烟花R]色相：条形色块被黑线分成两部分，下边的小圆圈会自动定位到蒙版区域主色调位置，右上角显示 “0.0” 说明没调整过色相（图4）
	
[种草R]左右滑动圆圈就能改变色相，简单来说就是原色相 + 滑动到位置上方的色彩 = 新色彩！你可以把色相看做一个360度的圆环：红→橙→黄→绿→青→蓝→品红→红，循环往复。图4青色滑到最右边加上红</div>

  <div class="card"><h3>行动清单</h3><div class="action">宝子们👋，今天接着聊 Lightroom 的使用方法。东哥会把修图核心步骤拆解成 “傻瓜操作”，让大家看完马上就能上手！👇​
	
[种草R]在开始前，跟大家说一下，Lightroom 已升级到 10.0 版本，有些地方有变化。从今天起，我都按 10.0 版本讲解。之前教程是 9.0 版本，工具名称可能不同，宝子们➕群找我要最新 APP 安装包哦。
	
[种草R]言归正传，今天讲讲 Lightroom 里两个实用工具：配置文件功能和自动调整工具，超简单，一看就会。
	
[一R]先看配置文件功能，点击 “编辑” 后的最后一个选项就是它，这功能类似美图秀秀的一键滤镜，堪称 “傻瓜式” 调色神器🧑‍🎨。随便选张照片，点击配置文件功能，就会出现很多滤镜。宝子们能根据喜好挑选不同滤镜，还能点击 “收藏夹” 旁的下箭头，快速找到 “现代、老式、艺术效果” 等不同风格的滤镜（图 2）。
	
[二R]再讲讲自动调整工具，在 10.0 版本中，它位于最左边的 “动作” 里，点击 “动作” 就能看到 “自动”。这个工具最大的优势就是能一键修图（主要自动调整亮度和色彩），特别适合懒人。其原理是，当照片亮度低、</div>
  <div class='pitfall'>以图内文字为准；文案话题标签已剥离。</div>
  <div class='bound'>图文轮播笔记；无时间轴口播。</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>宝子们👋，今天接着聊 Lightroom 的使用方法。东哥会把修图核心步骤拆解成 “傻瓜操作”，让大家看完马上就能上手！👇​
	
[种草R]在开始前，跟大家说一</p></div>

  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，上回东哥带大家实操了画笔蒙版，不少小伙伴直呼打开新世界大门！今天，咱们接着冲，深挖蒙版工具——径向渐变蒙版！
	
🎨径向渐变蒙版大揭秘
径向渐变蒙版，能打造圆形或椭圆形的调整区域，调整效果从中心向边缘逐渐过渡。简单来说，调整参数时，中心点变化最明显，越往四周，变化效果越弱。
	
🎨径向渐变蒙版的“可调节秘籍”
羽化：羽化堪称渐变效果的灵魂参数！羽化值越高，边缘过渡就像奶油一样丝滑，超自然；羽化值越低，边界就跟刀刻一样清晰。家人们看图2，羽化值0、50、100下，边缘变化是不是一目了然！
	
🖼实操环节：手把手教你逆袭废片
以图3为例，这张照片乍一看，整体平淡：人物部分黑漆漆，主体完全不突出；绿植有一块亮得扎眼；后方红色广告牌超抢镜；绿植光影像被“一键磨平”，毫无层次感。别慌，径向渐变蒙版来救场！
	
[向右R]拯救“小黑”人物：创建蒙版，调高亮度，微调颜色，人物瞬间“C位出道”！（图4、图5）
	
[向右R]处理抢眼广告牌：创建蒙版，调低颜色饱和度，广告牌瞬间低调了（图6、图7）
	
[向右R]驯服“高亮”绿植：创建蒙版，压低亮度、颜色饱和度和清晰度，让绿植低调又自然</div>

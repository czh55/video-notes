      <div class="container root">
<h1>鱼香与调味时序：酸→色→味→鲜→醋</h1>
<div class="meta">炖鱼 · 调味顺序 · 去腥 · 火候 · 图文 · 图文 14 页</div>
<a href="https://xhslink.cn/o/5RUhNzwSEnm">原笔记</a>
<div class="summary">核心判断：鱼虾先酸中和胺腥+物理清理；香靠高温油脂与酯化；顺序先色后味后鲜；醋分锅边出香与起锅出味；汤色看乳化。</div>
<div class="card"><h3>去腥</h3><ul><li>酸碱中和胺类</li><li>内脏黑膜血线必清</li></ul></div>
<div class="card"><h3>时序</h3><ul><li>先调色再调味后提鲜</li><li>断生开始入味；九分熟吃余温</li></ul></div>
<div class="card"><h3>鱼与汤</h3><ul><li>脂肪润鱼</li><li>大火乳化奶白 / 小火清汤</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>红烧鱼中段锅边醋、出锅再点酸</li><li>上色前别先大盐</li><li>要奶白就煎香+翻滚乳化</li></ul></div>
<div class="footer">video-notes · stew-fish-seasoning-order</div>
</div>

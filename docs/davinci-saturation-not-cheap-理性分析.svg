<div class="container">
  <h1>饱和度怎么加才不廉价</h1>
  <div class="meta">
    <span class="tag tag-blue">调色</span>
    <span class="tag tag-green">达芬奇</span>
    <span class="tag tag-orange">HSV / HSL</span>
    <span class="tag tag-purple">RGB 混合器</span>
    <span class="tag tag-gray">3分42秒 · Vivi Lyn</span>
  </div>
  <div class="summary-line">廉价感不是「饱和度」这个词本身，而是只在 RGB 里拉一个总饱和。把节点改到 HSV 或 HSL 后只开通道二，饱和会带着不同的明度走法；RGB 混合器则改颜色分离。三条路都能变艳，变出来的不是同一种艳。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">提出问题：想更鲜艳，手里却依赖饱和度。00:04–00:30 口播空档，画面先摆出三种方法。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:30</div><div class="timeline-text">RGB 三通道在色彩空间切到 HSV 或 HSL 后，变成色相、饱和度、明度或亮度。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:04</div><div class="timeline-text">关掉通道一和通道三，只留通道二。HSL 操作同理。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:32</div><div class="timeline-text">曲线左中右对应低、中、高饱和，她拿来对照 Lift、Gamma、Gain，并声明算法不同。初学推荐色轮。</div></div>
    <div class="timeline-item"><div class="timeline-time">02:08</div><div class="timeline-text">两节点参数相同。HSV 更压明度、颜色更密；她否认这等于胶片减色模型。</div></div>
    <div class="timeline-item"><div class="timeline-time">02:38</div><div class="timeline-text">HSL 更轻，亮度留得更好，颜色不如 HSV 扎实。</div></div>
    <div class="timeline-item"><div class="timeline-time">02:47</div><div class="timeline-text">RGB 混合器改输出混合比，增强分离和对比。红绿蓝加同样数值，Key Out Gain 控力度。过度破坏肤色和灰阶。</div></div>
    <div class="timeline-item"><div class="timeline-time">03:18</div><div class="timeline-text">没有更高级的方法。按素材和意图选。她个人 HSV 用得相对更多。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>一拉饱和就廉价</div>
      <div class="arrow">→</div>
      <div class="node">隔离<br/>通道二才是饱和</div>
      <div class="arrow">→</div>
      <div class="node node-green">对比<br/>HSV 厚 / HSL 轻</div>
      <div class="arrow">→</div>
      <div class="node node-orange">另路<br/>混合器管分离</div>
      <div class="arrow">→</div>
      <div class="node">行动<br/>按意图选，不排序</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解</h3>
    <p>把 HSV 的厚重感写成「这就是胶片」。作者在 02:28 前后明确否定：视觉相似不等于胶片减色成像模型。另一处误解是把三条方法排成新手、进阶、专业。片尾她说不存在更高级、更专业的一种。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">通道二为什么能单独加饱和</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>达芬奇节点默认色彩空间下，三个通道是红绿蓝。切到 HSV，通道变成色相、饱和度、明度；切到 HSL，第三通道她称为亮度。只留通道二，这个节点上的曲线或色轮就主要打在饱和度上。</p>
      <div class="highlight">关键理解：同样叫「加饱和」，操作对象从 RGB 总饱和，换成了某一种色彩空间里的饱和分量。分量定义变了，连带的明度变化也会变。</div>
      <div class="action">怎么用：先右键节点确认 Color Space 已是 HSV 或 HSL，再在 Channels 里关掉通道一和通道三，然后才拉曲线或一级色轮。顺序反了，拉的仍是红绿蓝。</div>
      <div class="quote">原文依据（00:35–01:10，已按画面校正）：色彩空间切到 HSV 或 HSL 后，通道变成 Hue、Saturation、Value 或 Lightness；只保留通道二，只针对饱和度调整。识别稿「只保 edereen 道二」按 01:04 字幕读成「只保留通道二」。</div>
    </div>
    <div class="card card-purple">
      <h3>作者观点，不是软件定义</h3>
      <p>她把 Value 和 Lightness 分别说成明度和亮度，这是她的口播译法。视频没有给出达芬奇在该节点里 Value 与 Lightness 的公式差异，也没有演示关掉通道之后示波器上明度是否完全不动。能核对的是操作顺序和她对视觉结果的描述。</p>
    </div>
    <div class="card card-orange">
      <h3>曲线对照不要当成同一算法</h3>
      <p>她说曲线左边、中间、右边对应低、中、高饱和，并对应 Lift、Gamma、Gain。下一句立刻收回：两种工具的作用区域和算法并不一样，细节在她的系统课里，本期不展开。</p>
      <div class="pitfall">不要按「左等于 Lift」去抄数值。对照只帮助记住三段饱和，不能互换参数。</div>
      <div class="relation">初学她推荐色轮，因为更好控、更精准。这是教学建议。对比演示仍用曲线，并且两个节点参数相同，方便看模型差异而不是参数差异。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">同样的参数，两种饱和</h2>
    <div class="card card-green">
      <h3>HSV：密度上来，明度被压</h3>
      <p>在讲什么：参数对齐之后，HSV 加饱和会带上更明显的明度压缩和颜色密度。有人觉得像胶片的厚重。</p>
      <div class="highlight">关键理解：厚重是明度被压、颜色变密的观感。作者把「像胶片」限定为相似性，并否定它等于减色成像。</div>
      <div class="action">怎么用：要颜色更结实、能接受画面变暗一档时，先试 HSV 通道二。看完用 Grab Still 留静帧，不要凭记忆和下一版比。识别稿里的 Grab Steel、镜针按静帧命令理解为 Grab Still。</div>
      <div class="quote">原文依据（02:18–02:36）：HSV 提高饱和度时伴随更明显的明度压缩和颜色密度提升；本质上不等于真正的胶片减色成像模型。</div>
    </div>
    <div class="card">
      <h3>HSL：更轻，亮度留得更住</h3>
      <p>在讲什么：同一参数下，HSL 的颜色更轻，亮度保留更好，色彩没有 HSV 扎实。</p>
      <div class="insight">怎么用：肤色或已经很亮的素材，若 HSV 一加就发闷，改到 HSL 再留通道二。这是按她的视觉描述做的推断，视频没有单独做一组肤色失败案例。</div>
      <div class="quote">原文依据（02:38–02:47）：HSL 的颜色会更轻，亮度保留更好，色彩没有 HSV 扎实。</div>
    </div>
  </div>

  <div class="card">
    <h3>三种加法怎么选</h3>
    <table>
      <tr><th>方法</th><th>动的是什么</th><th>她描述的结果</th><th>她标出的边界</th></tr>
      <tr><td>HSV 通道二</td><td>饱和分量，第三通道是明度</td><td>明度压缩更明显，颜色密度更高，观感更厚</td><td>像胶片，但不是胶片减色模型</td></tr>
      <tr><td>HSL 通道二</td><td>饱和分量，第三通道是亮度</td><td>颜色更轻，亮度留得更好，不如 HSV 扎实</td><td>操作与 HSV 同理，视觉结果不同</td></tr>
      <tr><td>RGB 混合器</td><td>输出通道的混合比例</td><td>颜色分离和对比增强，更有张力，结构更清楚</td><td>过度会破坏肤色和灰阶；力度用 Key Out Gain 收</td></tr>
    </table>
    <p>选择条件来自片尾，属于作者观点：看素材实际情况和创作意图，不按「更专业」排序。她补充自己的使用比例是 HSV 相对更高，没有给出次数或百分比。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">混合器不是第四种饱和旋钮</h2>
    <div class="card card-red">
      <h3>在讲什么</h3>
      <p>RGB 混合器通过调整输出通道里的混合比例，增强颜色分离和色彩对比。操作是红、绿、蓝三个输出加上同样的数值，再到 Key 面板的 Key Out Gain 控制力度。</p>
      <div class="highlight">关键理解：前两种是「只处理饱和分量」，混合器是「改 RGB 输出怎么互相混合」。张力来自分离，不来自把饱和滑杆推高。</div>
      <div class="action">怎么用：三个输出先加同一方向的数值，再只用 Key Out Gain 缩放整段效果。不要在混合比已经很大时继续加 Gain。</div>
      <div class="pitfall">她点名的事故是肤色和灰阶被破坏。视频没有给出「同样的数值」是多少，也没有给出 Key Out Gain 的安全区间。单帧上的滑块读数不能当成她的推荐值。</div>
      <div class="quote">原文依据（02:47–03:18）：调整 RGB 输出通道里的混合比例来增强颜色分离和色彩对比；红绿蓝增加同样的数值；Key Out Gain 控制力度；用力过度会破坏肤色和灰阶。</div>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>加饱和之前先改节点色彩空间。不改的话，三个通道仍是红绿蓝。</li>
      <li>HSV 与 HSL 的共同操作是只留通道二；差异在结果：一个更压明度，一个更留亮度。</li>
      <li>厚重感可以拿来做选择，不能拿来声称已经在模拟胶片减色。</li>
      <li>RGB 混合器解决的是分离和对比，力度用 Key Out Gain 收，过度伤肤色和灰阶。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>复制两条节点，一条 HSV、一条 HSL，都只开通道二，参数拉成一样，Grab Still 对比。</li>
      <li>初学先用一级色轮推这颗饱和，曲线留到能分清低中高饱和之后。</li>
      <li>要结构更清楚时另开 RGB 混合器，三个输出同向加一点，再用 Key Out Gain 缩放。</li>
      <li>每加一档就看肤色和灰阶，发脏就退，不要用「更专业」说服自己继续加。</li>
      <li>把「像胶片」写成观感备注，不写成色彩科学结论。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>以前：饱和度是一个旋钮，拉高就鲜，鲜过了就廉价。现在：廉价往往是明度、分离和饱和被同一下拉扯。先选定色彩空间里的哪一个分量，再决定要厚、要亮，还是要分开。</p>
  </div>
  <p class="footer">立场：操作顺序和视觉描述来自 Vivi Lyn 的口播与调色页画面。曲线与色轮的算法差异、混合器的具体数值、胶片减色的公式，视频都没有展开。00:04–00:30 的方法介绍来自抽帧字幕，不在 Whisper 分段里。</p>
</div>

    </div>
  </foreignObject>
</svg>
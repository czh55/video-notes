      <div class="container root">
  <h1>云南：为何装得下这么多风景</h1>
  <span class="tag">山河志</span><span class="tag">图文</span>
  <div><a href="https://xhslink.cn/o/6N7CoSKA3rK">原笔记短链</a></div>
  <div class="summary">核心判断：巨大落差 + 纵列山脉分水 + 垂直带与干湿分异，再加稀缺坝子供城市——多样性来自地形机制，不是景点堆砌。</div>
  <div class="card"><h3>结构抓手</h3><ul><li>6740→76.4 m，一省落差逾 6600 米</li><li>三江并流：山脊作分水岭各走其谷</li><li>同海拔可干热可雨林；约 6% 坝子聚城</li><li>四世界：纵谷 / 热带河谷 / 湖盆 / 喀斯特梯田</li></ul></div>
  <div class="conclusion"><h2>行动</h2><ul><li>先画西北高东南低剖面</li><li>解释三江「近而不交」用分水岭一句</li><li>旅行选线：先认四世界再点景点</li></ul></div>
  <div class="footer">video-notes · yunnan-so-many-landscapes</div></div>
    </div>
  </foreignObject>

<div class="container">
  <h1>富士 X100VI：溢价退去后怎么回看</h1>
  <div class="meta">
    <span class="tag tag-blue">摄影器材</span>
    <span class="tag tag-green">X100VI</span>
    <span class="tag tag-orange">作者观点</span>
    <span class="tag tag-gray">6分14秒 · 本地源截断</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/1FnZTYTSaUG">原视频 · 江航屹</a>
  <div class="summary-line">核心命题：溢价退去后，X100VI 更值得用「好玩 + 复古直出性格」来评估，而不是用「新传感器是否显著更锐」这一条尺子。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">电子茅台叙事 → 半年回看；好玩优先于好用</span></div>
    <div class="timeline-item"><span class="timeline-time">02:37</span><span class="timeline-text">F2 标板：全开一般，边角不崩；极致锐度约 F5.6–F8</span></div>
    <div class="timeline-item"><span class="timeline-time">03:38</span><span class="timeline-text">最近对焦约 10cm，近极限柔光，微距弱</span></div>
    <div class="timeline-item"><span class="timeline-time">03:48</span><span class="timeline-text">焦外圆斑/布丁/二线性；F2.8 多边形；硬味复古</span></div>
    <div class="timeline-item"><span class="timeline-time">05:12</span><span class="timeline-text">轴向色散与紫边可控，非 APO</span></div>
    <div class="timeline-item"><span class="timeline-time">05:31</span><span class="timeline-text">跟焦解放；外对焦声响震动 → 预期七代优化</span></div>
    <div class="timeline-item"><span class="timeline-time">06:14</span><span class="timeline-text">胶片模拟话题刚起，本地源截断</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">溢价退去<br/>还该不该买/留？</div>
      <div class="arrow">→</div>
      <div class="node node-orange">证据：锐度·近摄<br/>焦外·色散·对焦</div>
      <div class="arrow">→</div>
      <div class="node node-green">判断：好玩优先<br/>性格镜头</div>
      <div class="arrow">→</div>
      <div class="node">行动：按场景选<br/>别用实验室尺子</div>
    </div>
  </div>

  <div class="correction">
    <h3>认知纠偏</h3>
    <p>「升到 40MP 就一定明显更锐」在本片证据下不成立：全开发挥不出传感器全部实力，日常感知升级「吃力不讨好」。够用 ≠ 冲解析力换代。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">分项判断</h2>

    <div class="card">
      <h3>解析力：实验室尴尬，日常够用</h3>
      <p><strong>在讲什么：</strong>全开 F2 标板中央/四角；收光圈到 F2.8 仅略增；极致约 F5.6–F8。</p>
      <p><strong>关键理解：</strong>新传感器实力被定焦全开光学限制；边角无断崖是加分项。</p>
      <p><strong>怎么用：</strong>街拍/人像日常放心；要贴标板级锐度就收光圈或别拿它当风光墙。</p>
      <div class="quote">「对日常拍摄来说，这个升级完全是吃力不讨好的……实际用起来完全够用。」</div>
      <div class="relation">立场：可验证画面（标板）+ 作者购买观点（五代或许更有理由）分层。</div>
    </div>

    <div class="card card-purple">
      <h3>焦外：性格件，不是奶油完美虚化</h3>
      <p><strong>在讲什么：</strong>圆斑、布丁猫眼、偏心同心圆、亮圈二线性；F2.8 多边形；边缘泡泡糖感；实拍偏硬。</p>
      <p><strong>关键理解：</strong>硬味被作者正面叙事为「复古」，并与胶片模拟卖点对齐（深讲未收录）。</p>
      <p><strong>怎么用：</strong>喜欢奶油无瑕光斑的人会失望；喜欢复古硬焦外可视为特征。作者提到美科 35/1.8 Pro 作相似参考（画面有对照标注）。</p>
      <div class="highlight">F2 看圆斑性格；需要更圆更干净时别默认收到 F2.8——本片显示多边形几乎全屏。</div>
    </div>

    <div class="card card-green">
      <h3>对焦：能力升级最「可感知」的一项</h3>
      <p><strong>在讲什么：</strong>跑断腿连拍/视频跟焦稳；外对焦有声响震动。</p>
      <p><strong>关键理解：</strong>相对解析力，跟焦解放更符合「第六代处理器红利」的体感。</p>
      <p><strong>怎么用：</strong>动态主体、视频可用；安静场合注意对焦噪音；期待无声内对焦留给下一代。</p>
      <div class="quote">「在实拍中基本没有对焦的焦虑……这个镜头应该会是下一代要着重优化的地方。」</div>
    </div>

    <div class="card card-orange">
      <h3>近摄与色散：边界条件</h3>
      <ul>
        <li>最近对焦约 10cm + 近极限柔光 → 不当微距机</li>
        <li>轴向色散/紫边良好但不 APO → 高对比边缘放大会看见</li>
        <li>适配复古表达是作者审美判断，不是光学无色差证明</li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3>横向对照（片中信息）</h3>
    <table>
      <thead>
        <tr><th>维度</th><th>X100VI（本片）</th><th>对照/边界</th></tr>
      </thead>
      <tbody>
        <tr><td>解析力升级感知</td><td>日常够用，全开不锐</td><td>作者认为五代或更有购买理由（观点）</td></tr>
        <tr><td>焦外</td><td>圆斑+二线性+硬味</td><td>喜好可看美科 35/1.8 Pro 相似风格</td></tr>
        <tr><td>对焦</td><td>连拍/视频跟得住</td><td>外对焦噪音震动待七代</td></tr>
        <tr><td>近摄</td><td>~10cm，近距柔</td><td>不胜任真正微距</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-red">
    <h3>避坑</h3>
    <div class="pitfall">别用「40MP 标板全开」当唯一购买理由——本片证据显示感知弱。</div>
    <div class="pitfall">别默认收光圈到 F2.8 焦外更好看——多边形几乎全屏。</div>
    <div class="pitfall">别当静音微距机：外对焦有声，近距易软。</div>
    <div class="pitfall">胶片模拟深讲本地缺失：勿把本篇当成完整直出配方指南。</div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>回看尺子：好玩与性格 &gt; 传感器纸面升级</li>
      <li>光学：日常够锐、焦外有瑕有味、近摄弱</li>
      <li>系统：对焦已解放，外对焦仍是短板</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>试机时专门看：取景器切换乐趣、F2 焦外、跟焦噪音</li>
      <li>需要墙级锐度：规划 F5.6–F8 或换系统，不赌全开 40MP</li>
      <li>动态拍摄：可依赖跟焦；安静场合先试对焦声</li>
      <li>对比五代：若只为解析力，按作者观点重新算账</li>
      <li>等胶片模拟结论：补看完整片或作者其他直出专题</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：新传感器 = 明显更锐 → 现在：全开光学可能吃掉升级</li>
      <li>以前：焦外瑕疵 = 差 → 现在：硬味可被叙事成复古特征</li>
      <li>以前：旁轴味机对焦焦虑 → 现在：VI 跟焦体感已换代，噪音另算</li>
    </ul>
  </div>

  <div class="footer">基于 Whisper 111 段非空转录 + 画面证据 · 本地源约 06:14 截断 · 分析视角：决策分层而非安利</div>
</div>

    </div>
  </foreignObject>
</svg>
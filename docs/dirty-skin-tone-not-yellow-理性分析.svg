.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>肤色脏不是黄的错｜统一色彩才是干净</h1>
  <div class="meta"><span class="tag tag-blue">修图</span><span class="tag tag-green">肤色</span><span class="tag tag-orange">减黄</span><span class="tag tag-purple">高光</span><span class="tag tag-red">统一色彩</span><span class="tag tag-gray">时长 4分30秒</span><span class="tag tag-gray">理性分析 · 人像修图</span></div>
  <a class="source-link" href="https://xhslink.cn/o/5SzcDie0bJq">原视频</a>
  <div class="summary-line">核心判断：脏肤色优先是局部色相/高光关系不统一，不是「黄」本身有罪；先定位脏在哪，再决定要不要减黄，禁止无诊断狂改。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">反问：事实真如此吗</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">说不出脏在哪</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">眉鼻翼唇下排查</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">高光冷感问题</span></div><div class="timeline-item"><span class="timeline-time">03:00</span><span class="timeline-text">黄色并没有错</span></div><div class="timeline-item"><span class="timeline-time">04:00</span><span class="timeline-text">不要一上来哐哐改</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>脸脏要不要减黄</div><span class="arrow">→</span><div class="node-green">证据<br/>局部不统一+高光跳</div><span class="arrow">→</span><div class="node-orange">判断<br/>黄色无罪</div><span class="arrow">→</span><div class="node-blue">行动<br/>先定位再动手</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：有黄就减黄。纠偏：图层金句——肤色脏从来都不是黄色的错。</p><p>误解：滑杆数字是重点。纠偏：重点是选区定位与色彩统一。</p><p>ASR极差：依据硬字幕与PS界面重建。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：诊断先于减黄</h3>
      <p>能说出脏在眉/鼻翼/唇下/高光，才有资格动可选颜色。</p>
      <div class="quote">肤色脏从来都不是黄色的错。</div>
      <div class="relation">统一色彩=干净。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：排查顺序</h3>
      <p>①全局看是否真脏；②局部色相；③高光冷感与突出性；④最后才减黄。</p>
      <div class="quote">而不是一上来就哐哐一顿改。</div>
      <div class="relation">流程比插件重要。</div>
    </div>
    <div class="card card-orange">
      <h3>工具提示</h3>
      <p>演示栈含曲线、可选颜色、色相饱和度、渐变映射；数字（如黄-31%）是当次示范非通用配方。</p>
      <div class="quote">黄色并没有错。</div>
      <div class="relation">抄流程不抄参数。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>培训剪辑，非完整课时。</li><li>参数随原图光线变化。</li></ul><div class="pitfall">全局狂减黄导致死灰。</div><div class="pitfall">高光过冷造成脏感却继续减黄。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>黄色≠脏。</li><li>脏=不统一。</li><li>先定位再改。</li></ul><h3>行动清单</h3><ol><li>修图前写出「脏在哪」一句话。</li><li>单独开关高光层对比。</li><li>减黄前后做局部色相检查。</li></ol><h3>关键认知转变</h3><p>从「灭黄」转向「统一色彩关系」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 4分30秒</div>
</div>
    </div>
  </foreignObject>
</svg>
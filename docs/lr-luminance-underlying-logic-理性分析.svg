<div class="container">
  <h1>LR亮度底层逻辑大揭秘｜告别瞎调乱调</h1>
  <div><span class="tag">Lightroom</span><span class="tag">修图</span><span class="tag">教程</span></div>
  <p class="summary-line">[种草R]家人们👋，我是东哥～今天是咱们的第六节修图课，来讲最基础、超重要但又是用得最多的 LR 亮度调整工具，进入正题前还是提醒一下，需要最新版APP的关注➕</p>
  <div class="card"><h3>封面/要点：[种草R]家人们👋，我是东哥～今天是</h3><p>[种草R]家人们👋，我是东哥～今天是咱们的第六节修图课，来讲最基础、超重要但又是</p></div><div class="card"><h3>第5/9页：LR亮度底层逻辑大揭秘｜告别瞎调乱调</h3><p>[种草R]家人们👋，我是东哥～今天是咱们的第六节修图课，来讲最基础、超重要但又是</p></div><div class="card"><h3>第9/9页：LR亮度底层逻辑大揭秘｜告别瞎调乱调</h3><p>[种草R]家人们👋，我是东哥～今天是咱们的第六节修图课，来讲最基础、超重要但又是</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们👋，我是东哥～今天是咱们的第六节修图课，来讲最基础、超重要但又是用得最多的 LR 亮度调整工具，进入正题前还是提醒一下，需要最新版APP的关注➕群哦！✨
	
[种草R]“亮度”在软件下边“编辑”工具栏中的第二个，是个类似太阳的图标🌞。咱平常拍照，相机或手机不给力，照片不是暗了、曝了，就是灰扑扑的，这个工具就能让照片变得干净又通透，超厉害！
	
[种草R]今天这期只讲怎么用，搞懂基础理论🧐，下期再举例实操哈。
	
[种草R]一张照片有不同亮度区域，人眼能分辨，但软件不行。所以开发者用 0 - 255 这 256 个数字代表不同亮度，数字越小越暗，越大越亮。
	
[种草R]还把这些数字归成五类：0 - 38 是黑色，39 - 77 是阴影，78 - 166 是曝光，167 - 227 是高光，218 - 255 是白色。对应到照片上，最暗是黑色，较暗是阴影，正常亮是曝光，较亮是高光，最亮是白色。咱们就用这五个工具调不同亮度区域。（图2、图3）
	
[向右R]现在打开 Lightroom，用一张图演示，大家可以下载图3用LR打开边学习边操作哦。点“编辑”里那个像太阳的亮度工具</div>

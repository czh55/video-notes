<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2765" viewBox="0 0 1320 2765">
  <foreignObject x="0" y="0" width="1320" height="2765">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:24px;font-weight:700;color:#1e40af;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:18px;font-weight:700;color:#334155;margin-bottom:10px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:17px;line-height:1.7;color:#334155;padding:18px 22px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:22px 26px;margin-bottom:22px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:32px;margin-bottom:24px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:16px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:14px;padding:16px 22px;text-align:center;min-width:140px;font-weight:700;font-size:15px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{font-size:22px;color:#94a3b8}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:18px 22px;border-radius:12px;margin-bottom:22px}
.correction h3,.correction p{color:#92400e}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:18px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}.card.card-orange{border-left-color:#f59e0b}.card.card-purple{border-left-color:#8b5cf6}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:32px;margin-top:28px}
.conclusion h2{font-size:24px;font-weight:800;margin-top:0;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:17px;font-weight:700;color:rgba(255,255,255,.9);margin:16px 0 8px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:28px 0 12px}
</style>
      
<div class="container">
  <h1>核心是压力机制，不是收肚子</h1>
  <div class="meta"><span class="tag tag-blue">体态</span><span class="tag tag-green">力量训练</span><span class="tag tag-gray">2分04秒</span></div>
  <div class="summary-line">核心=腹压与骨盆-胸廓对位，不是收肚子秀腹肌。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><div class="timeline-time">00:12</div><div class="timeline-text">澄清误解</div></div><div class="timeline-item"><div class="timeline-time">01:02</div><div class="timeline-text">开口对位</div></div><div class="timeline-item"><div class="timeline-time">01:52</div><div class="timeline-text">动态匹配</div></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">收腹迷思</div><div class="arrow">→</div><div class="node node-green">压力机制</div><div class="arrow">→</div><div class="node node-orange">胸廓↔骨盆</div></div></div>
  <div class="correction"><h3>常见误解</h3><p>腹肌硬=核心强；可能只是浅层收紧。</p></div>
  <div class="card"><h3>对位检查</h3><p>两个开口是否同轴匹配。</p><div class="insight">深蹲前先呼吸撑起腹压再屈髋。</div><div class="quote">胸廓要随时去匹配骨盆</div></div><div class="card card-orange"><h3>边界</h3><p>教学观点片，个体伤病需专业评估。</p></div>
  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3><p>先对位再加载。</p>
    <h3>行动清单</h3><ol><li>镜子侧脸检查开口</li><li>无负重练呼吸腹压</li></ol>
    <h3>避坑总结</h3><ul><li>只卷腹当核心</li><li>曲髋塌对位</li></ul>
    <h3>关键认知转变</h3><ul><li>以前：收紧肚子 → 现在：对齐开口建压</li></ul>
  </div>
  <div class="footer">基于小红书视频本地转录与画面整理 · 2026-10-02</div>
</div>

    </div>
  </foreignObject>
</svg>
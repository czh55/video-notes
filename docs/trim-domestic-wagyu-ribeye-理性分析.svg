      <div class="container root-wrap">
  <h1>精修国产和牛眼肉</h1>
  <div class="meta"><span class="tag tag-blue">眼肉</span><span class="tag tag-green">眼肉芯</span><span class="tag tag-orange">排酸</span><span class="tag tag-purple">精修</span><span class="tag tag-gray">时长 3分13秒</span><span class="tag tag-gray">理性分析 · 分割语义</span></div>
  <a class="source-link" href="https://xhslink.cn/o/890KoBbVp4u">原视频</a>
  <div class="summary-line">核心判断：眼肉、眼肉芯、眼肉盖常常是同一解剖区域的不同切分边界；精修包含去软骨、筋膜、外膘，排酸腊化壳是工艺痕迹。油脂越白越好是作者转述的日本观感标准之一。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">未修眼肉原貌</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">留下眼肉芯</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">去软骨与排酸壳说明</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">去筋膜外膘与重量</span></div><div class="timeline-item"><span class="timeline-time">03:05</span><span class="timeline-text">三名一肉收尾</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>三个名字是不是三种肉</div><span class="arrow">→</span><div class="node-green">证据<br/>遮挡对比同一部位</div><span class="arrow">→</span><div class="node-orange">判断<br/>分法不同</div><span class="arrow">→</span><div class="node-blue">行动<br/>问清切分边界</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：腊化壳=变质。纠偏：作者将其联系到72小时以上排酸。</p><p>误解：眼肉芯是完全不同肌肉。纠偏：视频强调同一部位不同分法。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：名称消歧</h3>
      <p>用遮挡演示眼肉与眼肉芯关系，并点到眼肉盖。</p>
      <div class="quote">其实它是一个部位，只是分个方式不同。</div>
      <div class="relation">菜单翻译优先于营销新词。</div>
    </div>
    <div class="card card-green">
      <h3>精修成本从哪来</h3>
      <p>软骨、筋膜、外膘与约两三公斤损耗；澳牛处理路径可不同。</p>
      <div class="quote">没有修割的一条眼肉大概有10公斤以上。</div>
      <div class="relation">单价要折叠出成率。</div>
    </div>
    <div class="card card-purple">
      <h3>油脂颜色作为观感指标</h3>
      <p>白色度用于判别好坏（作者转述日本标准之一）。</p>
      <div class="quote">油脂越白越好。</div>
      <div class="relation">观感辅助，非唯一科学指标。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">名称对照（视频逻辑）</h2><div class="card"><table><thead><tr><th>名称</th><th>视频中的含义</th></tr></thead><tbody><tr><td>眼肉</td><td>整段/公认牛排部位</td></tr><tr><td>眼肉芯</td><td>去掉部分边界后的核心</td></tr><tr><td>眼肉盖</td><td>同一区域另一分法称谓</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>澳牛对比为口述。</li><li>「霉」边需结合画面理解，不作病理含义。</li></ul><div class="pitfall">被三个名字重复收费。</div><div class="pitfall">把排酸壳当坏肉退货标准。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先问切分边界再比价。</li><li>精修损耗是价格组成部分。</li><li>排酸改变表面与口感预期。</li></ul><h3>行动清单</h3><ol><li>下单写明要芯/要盖/要整条。</li><li>观察油脂色与筋膜是否去净。</li><li>牛排场景确认厚度与部位匹配。</li></ol><h3>关键认知转变</h3><p>从「背名词」转向「看刀路与边界」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分13秒</div>
</div>
    </div>
  </foreignObject>
</svg>
      <div class="container root">
<h1>散装陕西：地理先切，移民再缝</h1>
<div class="meta">陕西 · 陕北 · 关中 · 陕南 · 地域文化 · 图文 · 图文 11 页</div>
<a href="https://xhslink.cn/o/1jlX9MYfqJR">原笔记</a>
<div class="summary">核心判断：陕西「散装」首先来自北山/秦岭与黄长江水系分野，再叠加晋语/中原官话/西南官话与多层移民；西安不能代表全省。</div>
<div class="card"><h3>三自然区</h3><ul><li>陕北黄土边塞</li><li>关中渭河帝王平原</li><li>陕南汉江南方感</li></ul></div>
<div class="card"><h3>语言与行政</h3><ul><li>三种方言可能互不通</li><li>三秦初不含陕南；行省后才拼合</li></ul></div>
<div class="card"><h3>彩蛋</h3><ul><li>北京时间在临潼/蒲城</li><li>中亚陕西村与走西口/下湖人</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>介绍陕西先问「哪一块」</li><li>用餐桌与方言验证地理切分</li><li>勿用兵马俑单点概括全省</li></ul></div>
<div class="footer">video-notes · shaanxi-loose-pack-jiangnan</div>

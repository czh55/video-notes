  <div class="conclusion"><h2>结论</h2><p>封面是同一只南瓜：左边一种橙平涂，右边从暗红走到亮黄。哪一个像点着了？
	
我拆了几张 1910 年前后的万圣节明信片，南瓜灯能“发光”，靠的是三件事：
	
①</p></div>

<div class="container">
  <h1>怎么画夜景？看看吉卜力和梵高怎么上色</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">画夜景，你会先铺一层蓝吗？封面四张月夜：吉卜力和惠斯勒画蓝，库因吉画绿，弗里德里希画褐。绿和褐算画错了吗？
	
三种都画得出月夜，差在最显眼的颜色放在哪。《回忆</p>
  <div class="card"><h3>封面/要点：画夜景，你会先铺一层蓝吗？封面四张月</h3><p>画夜景，你会先铺一层蓝吗？封面四张月夜：吉卜力和惠斯勒画蓝，库因吉画绿，弗里德里</p></div><div class="card"><h3>第5/10页：怎么画夜景？看看吉卜力和梵高怎么上</h3><p>画夜景，你会先铺一层蓝吗？封面四张月夜：吉卜力和惠斯勒画蓝，库因吉画绿，弗里德里</p></div><div class="card"><h3>第9/10页：怎么画夜景？看看吉卜力和梵高怎么上</h3><p>画夜景，你会先铺一层蓝吗？封面四张月夜：吉卜力和惠斯勒画蓝，库因吉画绿，弗里德里</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">画夜景，你会先铺一层蓝吗？封面四张月夜：吉卜力和惠斯勒画蓝，库因吉画绿，弗里德里希画褐。绿和褐算画错了吗？
	
三种都画得出月夜，差在最显眼的颜色放在哪。《回忆中的玛妮》的蓝多在暗处，月光照到的裙子反而接近白；库因吉把大部分画面压得很暗，河面上的绿格外突出；弗里德里希的树和人物压得很暗，月亮周围的暖色更显眼。
	
现在的动画和插画多画冷色，但没有想的那么蓝。吉卜力 105 张夜景，暗处多是灰灰的深色，只带一点蓝。我又翻了 30 位常画风景的画师最近的作品，76 张夜景里 69 张暗处偏冷，暗处颜色浓的例子比吉卜力多。
	
老画家里，库因吉和雷明顿的绿集中在月光照到的地方，暗处颜色淡得多；格里姆肖是另一种，整张铺绿。弗里德里希把树和人压暗，暖色围着月亮；透纳反过来，整张亮成一片黄白。老画有光油发黄、翻拍偏色。
	
常见的一种搭配是暗处冷、亮处暖，梵高的《星月夜》、广重的《猿若町夜景》都是这样。有暖色亮部的 90 张夜景里，76 张的暗部平均色偏冷。同一块灰放在橙色旁边会显得更蓝，所以亮处画暖一点，夜不用涂得很蓝。灯和火多到占满画面时，整张也可以暖。
	
为什么大家默认画蓝？月光其实是被月</div>

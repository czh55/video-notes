      <div class="container root"><h1>光加法 / 颜料减法</h1>
<a href="https://xhslink.cn/o/8qdhDFOjr7J">原视频</a>
<div class="summary">核心判断：「红+绿」在光里是能量叠加（黄），在颜料里是吸收叠加（近泥）。课堂红黄蓝是实用系，不是物理 RGB 的否定。</div>
<div class="card"><ul>
<li>眼睛加总光；耳朵可拆声</li>
<li>物种锥细胞数不同 → 色世界不同</li>
</ul></div>
<div class="conclusion"><ul><li>调光用加法思维；调颜料用减法思维</li></ul></div>
<div class="footer">video-notes · red-green-light-vs-paint</div></div>

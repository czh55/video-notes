  <div class="card"><h3>封面/要点：[种草R]家人们，今天东哥手把手教大</h3><p>[种草R]家人们，今天东哥手把手教大家借助直方图模仿修图，轻松拿捏大师同款氛围感</p></div><div class="card"><h3>第5/14页：不藏了！巧用直方图｜3 分钟调出大</h3><p>[种草R]家人们，今天东哥手把手教大家借助直方图模仿修图，轻松拿捏大师同款氛围感</p></div><div class="card"><h3>第9/14页：不藏了！巧用直方图｜3 分钟调出大</h3><p>[种草R]家人们，今天东哥手把手教大家借助直方图模仿修图，轻松拿捏大师同款氛围感</p></div><div class="card"><h3>第13/14页：不藏了！巧用直方图｜3 分钟调出</h3><p>[种草R]家人们，今天东哥手把手教大家借助直方图模仿修图，轻松拿捏大师同款氛围感</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天东哥手把手教大家借助直方图模仿修图，轻松拿捏大师同款氛围感照片！
	
🎈分析大师作品
先看图 2，是日本摄影师滨田英明的作品。再看图 3，其直方图显示绝大多数像素集中在高光区域和白色区域。这就是我们修图要参考的方向啦。
	
🎨模拟修图实战
这次用图 4 来实操，图 5 是最终成片。先分析图 4 的直方图，能看到大多数像素集中在中间区域。
	
1⃣ 光影调整：我们的思路是整体提高亮度，尤其要调亮蓝色背景暗部，让直方图往右移动。
	
[种草R]打开 “亮度” 工具，把曝光度、对比度、高光、阴影、黑色色阶、白色色阶都调高（看图 6、图 7）。这时直方图成功右移，整体调性已经和图 2 很接近了。
	
[种草R]此时中间区域仍有大量蓝色，如果继续整体提亮，其他区域容易过曝。这时候，就可以通过 “颜色混合” 工具，调整特定颜色的明亮度，减少对其他区域的影响。
	
2⃣ 色调模仿：图 2 的色调以青绿色、蓝色为主，饱和度很低，绿色还稍带点黄。
	
[种草R]这就轮到 “颜色混合” 工具登场啦！按照 “红橙黄绿青蓝紫洋红” 的顺序逐个调整。就拿图 4 来说，重点是把草地调整为低饱</div>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1926" viewBox="0 0 1320 1926">
  <foreignObject x="0" y="0" width="1320" height="1926">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;padding:48px 60px;color:#1e293b}h1{font-size:34px;font-weight:900;color:#1e40af;margin-bottom:8px}h2{font-size:22px;color:#1e40af;margin:28px 0 10px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;border-left:5px solid #3b82f6}.card h3{font-size:20px;color:#1e40af;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:15px;background:#fff;margin-bottom:20px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f1f5f9;color:#1e40af}ul{margin:0 0 8px 20px}li{margin:6px 0;line-height:1.7}</style>
      <h1>土豆淀粉和玉米淀粉：图上只比出了色和透</h1>
<p>四页笔记里，有对照的是干粉和糊。炸菜是成品照片。粉条、烘焙、上浆只出现在说明里。</p>
<div class="card"><h3>核心命题</h3>
<p>标题说差别很大。能指认的差别是：土豆淀粉干粉更白，糊更亮更透；玉米淀粉干粉偏淡黄，糊更浑。酥脆、回软、粉条和蛋糕没有并排证据。</p></div>
<h2>证据落在哪一页</h2>
<table><tr><th>判断</th><th>图上</th><th>说明里另写的</th></tr>
<tr><td>干粉外观</td><td>第 1 页：土豆更亮白，玉米偏淡黄</td><td>纯马铃薯提取、粉质细腻</td></tr>
<tr><td>糊的透明度</td><td>第 2 页写明鲜亮对浑浊</td><td>勾芡汤汁亮而不浑</td></tr>
<tr><td>炸菜</td><td>第 3、4 页有成品，无淀粉名、无对照</td><td>锅包肉、炸酥肉更酥，凉了不回软</td></tr>
<tr><td>粉条、上浆、烘焙</td><td>四页都没有</td><td>土豆做粉条；玉米腌肉、蛋糕、饼干</td></tr></table>
<div class="card"><h3>怎么用</h3>
<ul>
<li>要亮芡：按第 2 页，优先看土豆淀粉那一碗的透明度，而不是只看干粉色。</li>
<li>干粉颜色只能当初步分辨，第 1 页没有写掺假或纯度的判断方法。</li>
<li>挂糊炸：说明推荐土豆淀粉，但第 3、4 页不能当作对照实验。</li>
<li>玉米淀粉在说明里被分到上浆和烘焙，图上没有这些成品。</li>
</ul></div>
<div class="card"><h3>不要做成的事</h3>
<ul>
<li>不要用第 3、4 页的卖相证明「凉了不回软」，页上没有放置时间。</li>
<li>不要把未标注的炸片直接写成土豆淀粉作品。</li>
<li>不要把说明里的粉条筋道、蛋糕饼干，当成这四张图已经演示过。</li>
</ul></div>
<div class="card"><h3>边界</h3>
<p>这是一篇厨房对照加作者选品说明。糊的亮和浑是画面结论。酥脆时长、回软、粉条口感、烘焙结构都还停在说明文字。两种淀粉的糊化温度、用量比例，笔记没有给。</p></div>
    </div>
  </foreignObject>

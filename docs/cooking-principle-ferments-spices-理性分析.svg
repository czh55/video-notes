      <div class="container root">
<h1>发酵料·香料·干货：先问溶解介质</h1>
<div class="meta">烹饪原理 · 香料 · 发酵料 · 调味 · 图文 · 图文 12 页</div>
<a href="https://xhslink.cn/o/6WyVqRefRiQ">原笔记</a>
<div class="summary">核心判断：香气多脂溶靠油温唤醒；去腥/腌制用水溶；盐管渗透方向；微量糖与干货水补鲜。原理优先于死记菜谱。</div>
<div class="card"><h3>出香化学</h3><ul><li>酯化：锅边淋发酵料</li><li>葱姜蒜/香料：油热萃取</li></ul></div>
<div class="card"><h3>味觉杠杆</h3><ul><li>糖锁鲜、盐定底糖修形</li><li>盐渗透：保水与脱水分策</li></ul></div>
<div class="card"><h3>绿色与淡味</h3><ul><li>焯烫灭酶护绿</li><li>干货+泡发水补核苷酸</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>改方先问：脂溶还是水溶？</li><li>香料流程：泡→煸→煮</li><li>泡香菇海米水沉淀回用</li></ul></div>
<div class="footer">video-notes · cooking-principle-ferments-spices</div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="云南从雪山纵谷到热带河谷：落差、三江并流、垂直带、坝子与四世界。">
  <title>为什么一个云南，装得下这么多风景？｜图文实录</title>
  <style>
  *{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;color:#292524;background:#f0fdf4}
  .container{width:min(960px,100%);margin:0 auto;padding:48px 32px 80px}
  a{color:#166534}.kicker{font-size:13px;letter-spacing:.08em;color:#166534;font-weight:700}
  h1{font-size:32px;line-height:1.35;margin:8px 0 12px}
  .meta{color:#78716c;font-size:14px;margin-bottom:18px}.lede{font-size:17px;color:#44403c}
  .story-section{margin:40px 0}
  .story-section h2{font-size:21px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #bbf7d0}
  img{display:block;max-width:100%;height:auto}
  figure{margin:24px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(22,101,52,.08)}
  figcaption{padding:14px 18px;color:#57534e;font-size:14px}
  .time-badge{font-weight:700;color:#166534;margin-right:6px}
  @media(max-width:640px){.container{padding:28px 18px 56px}h1{font-size:26px}}
  </style>
<style id="cap-en-style">
.cap-bilingual{padding:14px 18px}.cap-bilingual .cap-zh{color:#57534e;font-size:14px;line-height:1.7}.cap-bilingual .cap-zh .time-badge{font-weight:700;color:#b45309;margin-right:6px}.cap-bilingual .cap-en{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed #e7e5e4;color:#0f766e;font-size:14px;line-height:1.7}.cap-speak{flex:none;width:34px;height:34px;border:none;border-radius:50%;background:#0f766e;color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}.cap-speak:hover{background:#115e59;transform:scale(1.08)}.cap-speak.playing{background:#b45309;animation:capPulse 1s infinite}@keyframes capPulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
  <main class="container">
    <header>
      <p class="kicker">图文实录 · 小红书 · 山河志</p>
      <h1>为什么一个云南，装得下这么多风景？</h1>
      <p class="meta">2026-10-29 · 图文 6 页 · <a href="https://xhslink.cn/o/6N7CoSKA3rK">原文短链</a></p>
      <p class="lede">「中国地理·14」用六张图解释云南多样性：巨大落差、三江并流、垂直带与干湿分异、坝子聚城，最后收成四个地理世界。无口播，按页序读图。</p>
    </header>
    <article>
      <section class="story-section" id="p1">
        <h2>第 1 页：从雪山纵谷到热带河谷</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/01.jpg" alt="云南山河总览：西北高东南低四带" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">1/6</span>西北高东南低：卡瓦格博 6740 米到河口 76.4 米；雪山纵谷（怒澜金）、高原湖盆（洱海滇池）、喀斯特梯田、热带河谷（西双版纳）。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/53e6c7b46bc5.mp3" type="button" aria-label="Play English audio">🔊</button><span>Yunnan overview: NW high–SE low; gorge, lake basins, karst terraces, tropical valleys.</span></div>
<audio class="cap-audio" src="audio/53e6c7b46bc5.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p2">
        <h2>第 2 页：6740 米到 76.4 米</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/02.jpg" alt="海拔剖面：雪峰到河口" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">2/6</span>一省落差逾 6600 米：卡瓦格博→香格里拉高原→昆明湖盆→河口；从高寒雪峰落到暖热河谷。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/ac5d750696a8.mp3" type="button" aria-label="Play English audio">🔊</button><span>Elevation profile from Kawagarbo to Hekou—over 6600 m of relief.</span></div>
<audio class="cap-audio" src="audio/ac5d750696a8.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p3">
        <h2>第 3 页：三江并流为何不交汇</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/03.jpg" alt="三江并行剖面：分水岭隔开河谷" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">3/6</span>高黎贡—怒山—云岭纵列，怒江、澜沧江、金沙江各走其谷，山脊作分水岭；滇西北并行百余公里后分入萨尔温、湄公与长江。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/ed8824e2c9ca.mp3" type="button" aria-label="Play English audio">🔊</button><span>Three Parallel Rivers: ridges keep Nu, Lancang, and Jinsha apart.</span></div>
<audio class="cap-audio" src="audio/ed8824e2c9ca.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p4">
        <h2>第 4 页：海拔管冷暖，地形分干湿</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/04.jpg" alt="垂直带与干热河谷对比" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">4/6</span>白马雪山垂直带：雪峰—流石滩—树线—山地森林—河谷灌丛；同约 500 米，元江干热河谷 vs 西双版纳雨林，水分不同。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/a4249a84793a.mp3" type="button" aria-label="Play English audio">🔊</button><span>Vertical belts on Baima Snow Mountain; same ~500 m can be dry-hot or rainforest.</span></div>
<audio class="cap-audio" src="audio/a4249a84793a.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p5">
        <h2>第 5 页：约 6% 的坝子为何聚拢城市</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/05.jpg" alt="坝子聚落：山地间平坦盆地" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">5/6</span>群山中平地稀缺，坝子约占全省 6%，城镇农田交通挤在保山、大理、昆明等湖盆/坝子。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/cce697f01756.mp3" type="button" aria-label="Play English audio">🔊</button><span>~6% dam/basin land holds towns, farms, and transport.</span></div>
<audio class="cap-audio" src="audio/cce697f01756.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p6">
        <h2>第 6 页：云南的四个地理世界</h2>
        <figure>
          <img src="assets/yunnan-so-many-landscapes/06.jpg" alt="四世界分区总图" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">6/6</span>西北雪山纵谷、西南热带河谷、滇中高原湖盆、东南喀斯特与梯田——先认山河再选路线。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/702b69cf8716.mp3" type="button" aria-label="Play English audio">🔊</button><span>Four geographic worlds: gorge, tropical valleys, lake basins, karst terraces.</span></div>
<audio class="cap-audio" src="audio/702b69cf8716.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section></article>
  </main>
<script id="cap-en-script">
(function(){
  function stopOthers(except){
    document.querySelectorAll('.cap-audio').forEach(function(a){
      if(a!==except){a.pause();a.currentTime=0;}
    });
    document.querySelectorAll('.cap-speak.playing').forEach(function(b){
      if(!except||b.dataset.audio!==except.dataset.audio){b.classList.remove('playing');}
    });
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.cap-speak');
    if(!btn)return;
    var cap=btn.closest('.cap-bilingual');
    if(!cap)return;
    var au=cap.querySelector('.cap-audio');
    if(!au)return;
    if(au.paused){
      stopOthers(au);
      btn.classList.add('playing');
      au.play();
    }else{
      au.pause();au.currentTime=0;btn.classList.remove('playing');
    }
  });
  ['pause','ended'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(e.target.classList&&e.target.classList.contains('cap-audio')){
        var cap=e.target.closest('.cap-bilingual');
        if(cap){var b=cap.querySelector('.cap-speak');if(b)b.classList.remove('playing');}
      }
    },true);
  });
})();
</script>
</body>
</html>

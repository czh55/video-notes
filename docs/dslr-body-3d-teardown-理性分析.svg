      <div class="container root-wrap">
  <h1>单反相机3D组件解构</h1>
  <div class="meta"><span class="tag tag-blue">单反</span><span class="tag tag-green">反光镜</span><span class="tag tag-orange">五棱镜</span><span class="tag tag-purple">快门</span><span class="tag tag-red">CMOS</span><span class="tag tag-gray">时长 1分02秒</span><span class="tag tag-gray">理性分析 · 机身光路</span></div>
  <a class="source-link" href="https://xhslink.cn/o/1S68naEsiaq">原视频</a>
  <div class="summary-line">核心判断：单反按下快门是一套光路让路与帘幕曝光序列；取景靠镜与棱镜，记录靠传感器与处理器——人机界面只是末端。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">按下快门的一瞬间</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">01 卡口触点</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">03 五棱镜转正</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">05 焦平面快门</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">07 图像处理器</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">快门五步序列</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>快门瞬间发生什么</div><span class="arrow">→</span><div class="node-green">证据<br/>九解剖+五序列</div><span class="arrow">→</span><div class="node-orange">判断<br/>光路机器观</div><span class="arrow">→</span><div class="node-blue">行动<br/>用序列理解曝光</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：单反拍照=按键。纠偏：镜抬起与前后帘时序决定曝光。</p><p>ASR不可用，依字幕。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：取景与曝光两套光</h3>
      <p>取景：反光镜→五棱镜→取景器；对焦：副镜相位；曝光：帘幕+CMOS+处理器。</p>
      <div class="quote">前帘落下开始曝光，后帘追上结束曝光</div>
      <div class="relation">电子帘/机械帘差异可由此理解。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：故障联想</h3>
      <p>取景黑想镜/棱镜；对焦慢想AF模块；噪点想传感器与高感；卡满想存储路径。</p>
      <div class="quote">把电信号算成照片，写进存储卡</div>
      <div class="relation">维修沟通用模块名。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：单反路径特有</h3>
      <p>无反微单无此反光镜光路；本片不展开无反。</p>
      <div class="quote">ANATOMY OF A DSLR</div>
      <div class="relation">品类限定。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">快门序列</h2><div class="card"><table><thead><tr><th>步</th><th>动作</th></tr></thead><tbody><tr><td>1</td><td>反光镜抬起</td></tr><tr><td>2</td><td>前帘打开</td></tr><tr><td>3</td><td>曝光</td></tr><tr><td>4</td><td>后帘关闭</td></tr><tr><td>5</td><td>反光镜复位</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>示意为光学单反结构教学。</li></ul><div class="pitfall">用无反经验硬套反光镜故障。</div><div class="pitfall">忽略触点通信谈兼容。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>取景与曝光分流。</li><li>帘幕定义曝光时窗。</li><li>处理器完成可读照片。</li></ul><h3>行动清单</h3><ol><li>默写快门五步。</li><li>对照说明书找电池/卡门位置。</li><li>学曝光时联想前帘后帘。</li></ol><h3>关键认知转变</h3><p>从「按快门」转向「跑完光路序列」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分02秒</div>
</div>

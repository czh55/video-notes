<div class="container">
  <h1>咖啡豆出油，是更香还是放坏了？</h1>
  <div class="meta">
    <span class="tag tag-blue">咖啡豆</span><span class="tag tag-blue">表面出油</span><span class="tag tag-blue">深烘</span><span class="tag tag-blue">储存</span><span class="tag tag-blue">香气</span>
    <span class="tag tag-gray">2分04秒</span>
    <span class="tag tag-purple">理性分析 · 咖啡手作 · 选豆储存</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/2ZHWNtP6QqN" target="_blank" rel="noopener">原视频（小红书短链）</a>
  <div class="summary-line">核心命题：整豆表面油亮能否当作「更香」或「放坏了」的证据？作者结论是否定的——油亮主要说明油脂迁到了表面；深烘与存放会加速这一过程，但油光与挥发香气不是同一条曲线。决策应组合烘焙深度、日期、开袋与储存条件，并以实际香气味道为主；霉变属安全边界，不在风味比较范围内。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    
      <div class="timeline-item">
        <div class="timeline-time">00:00</div>
        <div class="timeline-text">提问：油亮是更香还是放坏？立刻双否</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:12</div>
        <div class="timeline-text">画面：豆子本就有油；烘焙促进向表面迁移</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:30</div>
        <div class="timeline-text">浅烘干爽≠无油；存放出油=迁移</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:54</div>
        <div class="timeline-text">油光≠香气；氧化可能出哈喇味</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:19</div>
        <div class="timeline-text">清单：深烘/日期/开袋/密封/温度</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:40</div>
        <div class="timeline-text">霉变勿试喝；油亮≠必须扔掉</div>
      </div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">问题</div>
          油亮说明什么
        </div>
        <div class="arrow">→</div>
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">机制</div>
          油脂表面迁移
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-orange">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">拆分</div>
          油光 ≠ 香气
        </div>
        <div class="arrow">→</div>
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">判断</div>
          深度+日期+储存
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-green">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">行动</div>
          盯味道不盯反光
        </div>
        
      
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解：油亮=更香。纠偏：看见的是油，闻到的是挥发香气物质；油光变多不等于香气变多。</p><p>误解：油亮=放坏了。纠偏：烘焙日期近的深烘豆表面见油可以是常态；需结合日期与储存，不能一见油就判坏。</p><p>误解：表面干爽=新鲜。纠偏：浅烘本来就不容易出油；干爽不能单独证明新鲜。</p><p>误解：出油就要扔。纠偏：油亮只说明油到了表面；真正该停喝的是明显霉变，以及香气味道明显劣化且储存失控的情况。</p><p>立场分层：迁移机制与清单步骤属作者科普叙事（画面引用 Schenker·2000 为示意非原图）；「更香/放坏」二元否决与行动建议是作者观点。</p>
  </div>

  <h2 class="sec-title">观点卡片</h2>
  
    <div class="card card">
      <h3>在讲什么：油光的物理含义</h3>
      <p>关键理解：普通原味豆表面油来自内部，不是凭空变出来的。用法：看见油光时先问「迁移是否合理」，再问「香气是否还在」。</p>
      <div class="quote">「这不是存放让豆子凭空多了油，而是原有的油脂继续移到了表面」</div>
      <div class="relation">烘焙深度 × 存放过程 → 表面可见油增多；天数只是弱代理变量。</div>
    </div>
  
    <div class="card card-purple">
      <h3>在讲什么：油与香必须拆开</h3>
      <p>关键理解：感官通道不同——视觉油光 vs 嗅觉挥发物。用法：评估豆子时闻干香、湿香与杯中味道，不要用反光强度代替嗅闻。</p>
      <div class="quote">「油光变多不等于香气也变多」</div>
      <div class="relation">存放可使油更显眼，同时香气散失/氧化，甚至哈喇——两条曲线可反向。</div>
    </div>
  
    <div class="card card-green">
      <h3>在讲什么：可执行的判断清单</h3>
      <p>关键理解：把「油亮」降级为弱信号，把可核验字段升为主信号。用法：深烘？烘焙日期？开袋多久？密封？是否高温？</p>
      <div class="quote">「如果是烘焙日期很近的深烘豆，不能一见油就认定它坏了」</div>
      <div class="relation">同一包豆冲法不变但香气变弱 → 查储存与新鲜度，而不是庆祝「更油」。</div>
    </div>
  
    <div class="card card-red">
      <h3>在讲什么：安全边界高于风味争论</h3>
      <p>关键理解：风味比较回答「好不好喝」，不回答「安不安全」。用法：见明显霉变/霉渍，停止试喝，不要用出油逻辑覆盖安全判断。</p>
      <div class="quote">「但风味比较不是安全检测」</div>
      <div class="relation">油亮争论止步于感官品质；霉变属于丢弃级风险。</div>
    </div>
  

  <div class="card">
    <h3>横向对照：信号能推出什么</h3>
    <table>
      <thead><tr><th>信号</th><th>可能意味着</th><th>不能单独推出</th></tr></thead>
      <tbody>
        <tr><td>刚开袋就很油亮</td><td>常见于深烘；烘焙时已见油光</td><td>一定更香 / 一定坏了</td></tr><tr><td>放着放着才出油</td><td>存放中油脂继续外迁</td><td>只靠天数判定品质</td></tr><tr><td>表面干爽</td><td>常见于浅烘</td><td>一定新鲜</td></tr><tr><td>油亮但有哈喇/陈旧味</td><td>香气散失或油脂氧化风险升高</td><td>「油多所以更好」</td></tr><tr><td>明显霉变</td><td>安全问题，应停止试喝</td><td>用风味辩论替代丢弃</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>避坑总结</h3>
    <ul><li>冲着油光买豆，把反光当新鲜或风味代理。</li><li>一见油就扔掉，误伤烘焙日期近的深烘豆。</li><li>用「放了多少天」单变量判决，忽略烘焙方式与温度密封。</li><li>把油更多解释成更香，掩盖香气散失与氧化。</li><li>在霉变豆子上继续做风味比较。</li></ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <p>油亮是表面油脂迁移的可见结果，不是香气仪表，也不是变质判定器。深烘与存放会改变可见油量；香气与安全要另案处理。</p>
    <h3>行动清单</h3>
    <ol><li>买豆：不以油光为选豆主指标；优先看烘焙日期、烘焙深度与储存说明。</li><li>开袋：密封、避开高温；把「亮不亮」降级为次要观察。</li><li>冲煮对照：同一包豆、冲法不变时，若香气明显变弱，优先查储存与新鲜度。</li><li>安全一票否决：明显霉变不试喝。</li><li>自我提问：这包豆是刚开袋就油亮，还是存放后才出油？用时间线补全判断。</li></ol>
    <h3>关键认知转变</h3>
    <ul><li>以前：油亮=好豆或坏豆 → 现在：油亮=油到了表面，需组合其他证据</li><li>以前：盯反光 → 现在：盯香气、味道与储存史</li><li>以前：风味与安全混谈 → 现在：霉变单独一票否决</li></ul>
  </div>

  <div class="footer">双轨产物 · 理性分析 SVG · 与图文实录共享同一转录证据 · 不同于 coffee-bean-oil-myth（浓缩泡沫议题）</div>
</div>

    </div>
  </foreignObject>
</svg>
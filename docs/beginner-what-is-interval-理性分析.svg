      <div class="container root-wrap">
  <h1>新手必：音程是什么？</h1>
  <div class="meta"><span class="tag tag-blue">音程</span><span class="tag tag-green">纯增减</span><span class="tag tag-orange">大小</span><span class="tag tag-purple">乐理</span><span class="tag tag-gray">时长 6分18秒</span><span class="tag tag-gray">理性分析 · 命名流程</span></div>
  <a class="source-link" href="https://xhslink.cn/o/cV14Is4eeW">原视频</a>
  <div class="summary-line">核心判断：音程名=先数度数再定前缀；1458 走纯增减，其余走大小；同音异名会改变关系名，所以必须先看记谱落点。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">增一度 vs 小二度</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">大小三度推进</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">增四／减五撞上1458</span></div><div class="timeline-item"><span class="timeline-time">02:20</span><span class="timeline-text">先定几度再定前缀</span></div><div class="timeline-item"><span class="timeline-time">05:30</span><span class="timeline-text">半音计数练习</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>音程怎么叫</div><span class="arrow">→</span><div class="node-green">步骤<br/>度数→前缀</div><span class="arrow">→</span><div class="node-orange">分流<br/>1458 vs 其他</div><span class="arrow">→</span><div class="node-blue">练习<br/>数半音验证</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：距离一样名字就一样。纠偏：升 do 与降 re 距离近，名称可不同。</p><p>误解：所有音级都用大小。纠偏：1458 用纯增减。</p><p>误解：先背前缀。纠偏：视频强调先定几度。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：一度家族</h3>
      <p>同音不同记法 → 增一度／小二度，像亲属称呼不同。</p>
      <div class="quote">我和我哥的关系，和我和我弟的关系能一样吗</div>
      <div class="relation">记谱选择进入命名。</div>
    </div>
    <div class="card card-green">
      <h3>关键理解：两套前缀</h3>
      <p>1458：纯／增／减；其他：大／小。</p>
      <div class="quote">只有涉及到这四个人的时候，才搞这种纯增减</div>
      <div class="relation">分流记牢可减少乱叫。</div>
    </div>
    <div class="card card-purple">
      <h3>怎么用：流程</h3>
      <p>先数几度，再看半音决定前缀。</p>
      <div class="quote">先确定几度 再确定几度前缀</div>
      <div class="relation">可当场用于白板练习。</div>
    </div>
    <div class="card card-orange">
      <h3>证据缺口</h3>
      <p>中段口播空洞，规则以白板与字幕为准。</p>
      <div class="quote">取决于你记在哪里</div>
      <div class="relation">多看两遍是作者明示策略。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">前缀分流</h2><div class="card"><table><thead><tr><th>度数家族</th><th>常用前缀</th><th>例子（视频）</th></tr></thead><tbody><tr><td>1/4/5/8</td><td>纯／增／减</td><td>增四、减五、纯五</td></tr><tr><td>2/3/6/7</td><td>大／小</td><td>大二、小三、小六</td></tr><tr><td>同音异名</td><td>名称可变</td><td>升do=增一；降re=小二</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>不讲复音程、音律频率比。</li><li>例题以 C 调白板为主。</li></ul><div class="pitfall">跳过度数直接猜大小。</div><div class="pitfall">把增四减五当成两套无关知识。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>度数优先。</li><li>1458 分流。</li><li>记谱决定名称。</li></ul><h3>行动清单</h3><ol><li>默写 1–8 默认性质表。</li><li>任取两音先数度再定前缀。</li><li>用半音数验证一次小六。</li></ol><h3>关键认知转变</h3><p>从「背名称表」转向「走命名流程」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 6分18秒</div>
</div>
    </div>
  </foreignObject>
</svg>
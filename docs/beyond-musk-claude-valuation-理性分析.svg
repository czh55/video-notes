<h1>超越马斯克？Claude 估值大战怎么看</h1>
<div class="meta">Anthropic · Claude · 估值 · TAM · AI · <a href="https://b23.tv/gvHEjOo">原视频</a></div>
<div class="summary"><strong>核心判断：</strong>Anthropic/Claude 天价估值=四波资本+TAM/饭碗叙事+云厂商绑定；完美定价下容错极低。</div>
<div class="card"><h3>结构重组</h3><ul><li><strong>[00:00→04:00] 出身与资金</strong> — 安全路线另起炉灶；硅谷信仰支票与云巨头战略入股。</li><li><strong>[04:00→10:00] Agent 时刻</strong> — Claude Code 等推动企业需求；估值看 TAM 而非当期利润。</li><li><strong>[10:00→18:26] 绑定与坎</strong> — 亚马逊/谷歌多重身份；烧钱换故事，完美定价下必须持续狂飙。</li></ul></div>
<div class="card"><h3>适用边界</h3><ul>
<li>纪实作者观点与口播口径，金额/车队数为约数，勿当投研结论。</li>
<li>ASR 专名已校正；细节以原视频与官方披露为准。</li>
</ul></div>

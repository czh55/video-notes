<h1>软硬光：边缘优先，相对光源大小</h1>
<div class="meta">硬光 · 柔光 · 用光 · 摄影基础 · 图文 · 图文 6 页</div>
<a href="https://xhslink.cn/o/9oWVlIl8nhI">原笔记</a>
<div class="summary">核心判断：软硬看阴影过渡；由主体视角的光源大小主导。柔化靠面/距/反射；硬光用投影与纹理；柔光可保留方向甚至用黑旗做高反差。</div>
<div class="card"><h3>判别</h3><ul><li>看边缘不是看亮度</li><li>相对光源大小是关键</li></ul></div>
<div class="card"><h3>变柔</h3><ul><li>更大发光面 / 更近 / 白墙弹</li><li>改位后重曝光</li></ul></div>
<div class="card"><h3>用法</h3><ul><li>硬：纹理·投影·戏剧</li><li>柔：人像产品+可选黑旗</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>固定机位只改光源大小做对照</li><li>布柔光仍放侧前方</li><li>补光与柔化分开想</li></ul></div>
<div class="footer">video-notes · hard-light-vs-soft-light-2</div>
</div>

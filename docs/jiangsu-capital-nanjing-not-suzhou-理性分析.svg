      <div class="container root">
<h1>江苏省会为什么是南京</h1>
<span class="tag">省会选址</span><span class="tag">图文 8 页</span>
<div><a href="https://xhslink.cn/o/1hbF35jP8NI">原笔记短链</a></div>
<div class="summary">核心判断：南京省会地位来自长期行政双中心传统、都城山河条件、1949 后整合与 1952 政治确认；苏州后来的经济体量不能回溯改写机关选址成本。</div>
<div class="card"><h3>时间线抓手</h3><ul>
<li>清：江宁（总督）+ 苏州（巡抚）双中心</li>
<li>1927–1929：南京首都化，省会迁镇江</li>
<li>1949 分治 → 1952 信件 → 1953-01-01 建省定南京</li>
<li>苏州 GDP 再高，迁省会仍是整套行政搬家</li>
</ul></div>
<div class="conclusion"><h2>行动</h2><ul>
<li>对照河南篇：都是「历史名城 vs 当代行政中心」拆题</li>
<li>记一句：经济排名 ≠ 自动迁省会</li>
</ul></div>
<div class="footer">video-notes · jiangsu-capital-nanjing-not-suzhou</div></div>
    </div>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="3771" viewBox="0 0 1320 3771">
  <foreignObject x="0" y="0" width="1320" height="3771">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:24px;font-weight:700;color:#1e40af;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:18px;font-weight:700;color:#334155;margin-bottom:10px}
p,li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:8px}
ul{padding-left:22px}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}
.meta{margin:12px 0 16px}
.summary-line{font-size:17px;padding:18px 22px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-weight:700;color:#3b82f6;min-width:88px;font-variant-numeric:tabular-nums}
.diagram{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:16px 0}
.node{background:#eff6ff;border:2px solid #93c5fd;border-radius:14px;padding:14px 18px;font-weight:700;color:#1e40af;text-align:center;min-width:120px}
.node-green{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.node-orange{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.arrow{color:#94a3b8;font-size:22px}
.card{background:#fff;border-radius:16px;padding:24px;margin:14px 0;border-left:5px solid #3b82f6;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card.card-purple{border-left-color:#8b5cf6}.card.card-orange{border-left-color:#f59e0b}.card.card-green{border-left-color:#10b981}
.quote{background:#f8fafc;padding:12px 14px;border-radius:10px;margin:10px 0;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.highlight{background:#fef3c7;padding:12px 14px;border-radius:10px;margin:10px 0;color:#92400e;border-left:4px solid #f59e0b}
.pitfall{background:#fef2f2;padding:12px 14px;border-radius:10px;margin:10px 0;color:#991b1b;border-left:4px solid #ef4444}
.action{background:#eff6ff;padding:12px 14px;border-radius:10px;margin:10px 0;color:#1e40af;border-left:4px solid #3b82f6}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #e2e8f0;padding:10px 12px;text-align:left}th{background:#f8fafc;color:#1e40af}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:32px;margin-top:28px}
.conclusion h2,.conclusion h3{color:#fff;border:none;padding:0}
.conclusion li{color:rgba(255,255,255,.92)}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:24px 0}</style>
      
<div class="container">
  <h1>Lightroom 调色：用形状取代乱拖</h1>
  <div class="meta">
    <span class="tag tag-blue">12分20秒</span>
    <span class="tag tag-green">颜色分级</span>
    <span class="tag tag-orange">3Y Line Tri</span>
  </div>
  <div class="summary-line">核心命题：Lightroom 三色轮不是「凭感觉搓点」，而是在色轮上摆出可复用的和谐形状；先定形状与主导影调，中间调最后，再用锁轴快捷键与明亮度/混合/平衡收口。</div>

  <div class="timeline">
    <h3>证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00-00:50</span><span>痛点：乱拖→重置；提出四形记忆</span></div>
    <div class="timeline-item"><span class="timeline-time">00:50-02:20</span><span>直线形 +「先主导影调、中间调最后」</span></div>
    <div class="timeline-item"><span class="timeline-time">02:20-03:40</span><span>Shift 锁色相 / Command 锁饱和</span></div>
    <div class="timeline-item"><span class="timeline-time">03:40-05:10</span><span>明亮度治发灰；混合与平衡</span></div>
    <div class="timeline-item"><span class="timeline-time">05:10-08:00</span><span>三角形：顺原片倾向 + 定点微调</span></div>
    <div class="timeline-item"><span class="timeline-time">08:00-10:40</span><span>Y 形：主导色反向锚定分裂互补</span></div>
    <div class="timeline-item"><span class="timeline-time">10:40-12:20</span><span>3Y Line Tri 回顾与边界</span></div>
  </div>

  <h2>核心脉络</h2>
  <div class="diagram">
    <div class="node">乱拖色轮</div><div class="arrow">→</div>
    <div class="node node-orange">先想形状</div><div class="arrow">→</div>
    <div class="node">主导影调先调</div><div class="arrow">→</div>
    <div class="node node-green">中间调最后</div><div class="arrow">→</div>
    <div class="node">明亮度/混合收口</div>
  </div>

  <div class="card">
    <h3>在讲什么 → 关键理解 → 怎么用</h3>
    <p>把 Midtones / Shadows / Highlights 三个点映射到经典色轮和谐：直线≈单色，三角≈三角和谐，Y/外形≈分裂互补，三点组合≈更散的多色锚点。</p>
    <div class="quote">「只要记住你在 Lightroom 色轮上摆出的形状，就能找到非常适合照片的配色。」</div>
    <div class="action">怎么用：打开颜色分级前先在脑中选一种形状；先点主导影调色轮，中间调留到最后。</div>
  </div>

  <div class="card card-purple">
    <h3>操作层：锁轴与收口</h3>
    <ul>
      <li>Shift：锁色相，只调饱和度</li>
      <li>Command/Ctrl：锁饱和度，只调色相</li>
      <li>明亮度：发灰/滤镜感时压暗对应影调</li>
      <li>混合：控制影调间过渡快慢；平衡：整体偏高光色或阴影色</li>
    </ul>
  </div>

  <div class="card card-green">
    <h3>四形对照</h3>
    <table>
      <tr><th>形状</th><th>点位关系</th><th>适用直觉</th></tr>
      <tr><td>直线</td><td>三点近乎同色相轴</td><td>统一暖/冷单色推进</td></tr>
      <tr><td>三角形</td><td>三影调分向拉开</td><td>需要更丰富但可控的对比</td></tr>
      <tr><td>Y / 外形</td><td>一侧一色、对侧分裂两色</td><td>主导色已很强，需互补平衡</td></tr>
      <tr><td>三点组合</td><td>更松散的多锚点</td><td>探索期试色</td></tr>
    </table>
  </div>

  <div class="card card-orange">
    <h3>避坑与边界</h3>
    <div class="pitfall">不要把「形状」当成必须几何完美的尺子——视频明确说大致成形即可。</div>
    <div class="pitfall">不要在主导色已很强时仍从同方向加色；Y 形案例是先锚互补方向。</div>
    <div class="highlight">立场分层：四形命名与顺序是 UP 主工作流（观点）；Shift/Command 行为与面板控件是可验证界面事实；「一定更好看」属审美判断，需对照原片。</div>
    <p>方法边界：演示以风光/海岸/林湖为主；人像肤色约束、局部蒙版与 HSL 前置未展开。片尾课程导流非技术结论。</p>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>行动清单</h3>
    <ul>
      <li>下一张图先选直线/三角/Y 之一，再动色轮。</li>
      <li>写下「主导影调」是高光还是阴影，先调它，中间调最后。</li>
      <li>练习 10 次 Shift 锁色相与 Command 锁饱和。</li>
      <li>出现滤镜感时，先动阴影明亮度，再动混合/平衡。</li>
      <li>某色过重：定位对应顶点，锁饱和微调色相。</li>
    </ul>
    <h3>认知转变</h3>
    <ul>
      <li>以前：三个点各自凭感觉 → 现在：三点共同组成一个形状。</li>
      <li>以前：中间调最先搓 → 现在：中间调用来平衡收口。</li>
      <li>以前：发灰就加饱和 → 现在：先查明亮度与过渡。</li>
    </ul>
  </div>
  <div class="footer">依据 b64m Whisper 全部分段与画面演示；专有名词按面板语义校正。</div>
</div>
    </div>
  </foreignObject>
</svg>
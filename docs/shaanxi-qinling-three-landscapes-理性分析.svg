      <div class="container root">
  <h1>陕西：一道秦岭，三种山河</h1>
  <span class="tag">山河志</span><span class="tag">图文</span>
  <div><a href="https://xhslink.cn/o/56Uq3sFvHia">原笔记短链</a></div>
  <div class="summary">核心判断：用秦岭当脊柱，把陕西拆成黄土—关中—秦巴三层，再叠水系南北分流、十城与 5A——比背单个景点名更稳。</div>
  <div class="card"><h3>结构抓手</h3><ul><li>陕北黄土铸骨、关中渭河平原、陕南秦巴与汉水</li><li>秦岭分气候/水系/植被，北黄河、南长江</li><li>十城共生 + 关中最密的 5A 矩阵</li></ul></div>
  <div class="conclusion"><h2>行动</h2><ul><li>默画三横带 + 太白峰</li><li>用「北干南湿」解释作物与民居差异</li><li>5A 按关中/陕北/陕南三类归堆记忆</li></ul></div>
  <div class="footer">video-notes · shaanxi-qinling-three-landscapes</div></div>

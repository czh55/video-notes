  <h1>LR修图党狂喜！动作（魔法棒）功能全解析！</h1>
  <div><span class="tag">Lightroom</span><span class="tag">修图</span><span class="tag">教程</span></div>
  <p class="summary-line">家人们！东哥带着新版LR超神功能来啦💥！今天掰开揉碎讲新版LR的动作（魔法棒）功能，手把手教你从修图小白逆袭成大神！​
	
✨【魔法棒工具大揭秘】​
点开LR首</p>
  <div class="card"><h3>封面/要点：家人们！东哥带着新版LR超神功能来啦</h3><p>家人们！东哥带着新版LR超神功能来啦💥！今天掰开揉碎讲新版LR的动作（魔法棒）功</p></div><div class="card"><h3>第5/12页：LR修图党狂喜！动作（魔法棒）功能</h3><p>家人们！东哥带着新版LR超神功能来啦💥！今天掰开揉碎讲新版LR的动作（魔法棒）功</p></div><div class="card"><h3>第9/12页：LR修图党狂喜！动作（魔法棒）功能</h3><p>家人们！东哥带着新版LR超神功能来啦💥！今天掰开揉碎讲新版LR的动作（魔法棒）功</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">家人们！东哥带着新版LR超神功能来啦💥！今天掰开揉碎讲新版LR的动作（魔法棒）功能，手把手教你从修图小白逆袭成大神！​
	
✨【魔法棒工具大揭秘】​
点开LR首页第一个图标🪄，这里面藏着5个宝藏工具（图2），每个都超实用！​
	
1⃣自动：老功能换新家！​
它就是原来LR里排在首位的工具，现在加入动作大家庭啦～点击“自动”，LR会智能分析照片，一键调整曝光、对比度、色彩平衡等参数。比如拍暗的夜景照，点一下，瞬间提亮！前边第一、四节课有详细讲解，还没学的宝子赶紧补课📚！​
	
2⃣主体&amp;背景：懒人修图神器！​
本质是蒙版里的“选择主体”和“选择背景”，但在这里更便捷！点击后弹出“流行、亮、暖光”等超多预设风格。也可直接调整曝光和饱和度（图3）。
	
[烟花R]重点：这里点击后会自动生成蒙版，也就是点击蒙版后可以看到已经创建好了两个蒙版（图4、图5）。简单修图在这里用，想要做更多调整还是到蒙版里操作～​
	
3⃣修饰：人像修图天花板！​
专门为人像照片设计，打开自动识别牙齿、眼睛、皮肤、头发、衣服👀（图6）。​
	
[气球R]牙齿：“美白”功能超自然，注意别调太夸张，不然像假牙🦷​（图7）</div>

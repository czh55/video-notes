      <div class="container root-wrap">
  <h1>会不会配色其实就差一点点</h1>
  <div class="meta"><span class="tag tag-blue">配色</span><span class="tag tag-green">分割</span><span class="tag tag-orange">强调</span><span class="tag tag-purple">互补色</span><span class="tag tag-red">中性色</span><span class="tag tag-gray">时长 2分30秒</span><span class="tag tag-gray">理性分析 · 设计配色</span></div>
  <a class="source-link" href="https://xhslink.cn/o/ANOOA9kPwM3">原视频</a>
  <div class="summary-line">核心判断：配色高低往往差在「交界处那一点点」——中性色分割让互补可居；强调色（互补/亮灰/高饱和提亮）让近似色与暗调重新有焦点。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">交界插中性色</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">品牌蓝橙+灰</span></div><div class="timeline-item"><span class="timeline-time">00:23</span><span class="timeline-text">名为色彩分割</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">近似色插蓝=强调</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">橙色邮箱蓝信息</span></div><div class="timeline-item"><span class="timeline-time">02:15</span><span class="timeline-text">暗调插高饱和</span></div><div class="timeline-item"><span class="timeline-time">02:25</span><span class="timeline-text">四种强调示例</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>为什么差一点点</div><span class="arrow">→</span><div class="node-green">证据<br/>分割与强调案例</div><span class="arrow">→</span><div class="node-orange">判断<br/>交界与焦点可控</div><span class="arrow">→</span><div class="node-blue">行动<br/>先加分隔再加强调</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：互补色不能一起用。纠偏：用中性色分割就能缓和。</p><p>误解：强调=多加颜色。纠偏：常常是插入一小块对比色。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：分割 vs 强调</h3>
      <p>分割让对立色可共处；强调让主色场里出现唯一焦点。</p>
      <div class="quote">会不会配色，其实就差一点点。</div>
      <div class="relation">技巧粒度在「一小块」。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：两步检查</h3>
      <p>①互补是否过疲劳→加灰分隔；②画面是否无焦点→加互补/亮灰/高饱和点。</p>
      <div class="quote">这就是色彩的强调。</div>
      <div class="relation">邮箱与路牌是生活训练场。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：四种强调为常见型</h3>
      <p>视频自称生活中最常见四种示例，不是穷尽色彩理论。</p>
      <div class="quote">希望你在生活中遇见它们时会想起这个视频。</div>
      <div class="relation">观察任务重于背公式。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">手法速查</h2><div class="card"><table><thead><tr><th>手法</th><th>插入什么</th><th>效果</th></tr></thead><tbody><tr><td>分割</td><td>中性色/灰</td><td>缓和互补疲劳</td></tr><tr><td>互补强调</td><td>互补小色块</td><td>制造焦点</td></tr><tr><td>亮灰强调</td><td>亮灰</td><td>标识性上升</td></tr><tr><td>暗调提亮</td><td>高明度高饱和</td><td>路牌级醒目</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>品牌名为口播转写，可能有ASR误差。</li><li>中段时间轴有跳秒。</li></ul><div class="pitfall">大面积互补却无分隔。</div><div class="pitfall">强调色面积过大变第二主色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>差一点在交界。</li><li>分割可居，强调可焦。</li><li>生活场景是题库。</li></ul><h3>行动清单</h3><ol><li>下一张图先只改交界1%面积。</li><li>街头拍3个强调色案例。</li><li>主色确定后再选强调策略。</li></ol><h3>关键认知转变</h3><p>从「换色相盘」转向「管交界与焦点」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 2分30秒</div>
</div>
    </div>
  </foreignObject>

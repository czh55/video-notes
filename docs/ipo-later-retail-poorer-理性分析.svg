      <div class="container root-wrap">
  <h1>上市越来越晚，散户越来越穷？</h1>
  <div class="meta"><span class="tag tag-blue">IPO</span><span class="tag tag-green">私募</span><span class="tag tag-orange">散户</span><span class="tag tag-purple">VC</span><span class="tag tag-red">二级市场</span><span class="tag tag-gray">时长 13分30秒</span><span class="tag tag-gray">市场机制分析</span></div>
  <a class="source-link" href="https://b23.tv/KBYh7Se">原视频</a>
  <div class="summary-line">IPO 变晚的核心不是监管偶然，而是私募资金池与法规让融资/退出/员工变现不必再依赖公开上市；散户因此更晚才买到更贵更大的公司，私募流动性基建成为配套工程。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">昔日迷你 IPO vs 今日巨型私有</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">IPO 年龄翻倍</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">融资轮次体量跃迁</span></div><div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">七年 IPO 率下降</span></div><div class="timeline-item"><span class="timeline-time">04:00</span><span class="timeline-text">养老金进另类资产</span></div><div class="timeline-item"><span class="timeline-time">07:00</span><span class="timeline-text">JOBS 与 private 更久</span></div><div class="timeline-item"><span class="timeline-time">10:40</span><span class="timeline-text">私募市场基础设施</span></div><div class="timeline-item"><span class="timeline-time">11:40</span><span class="timeline-text">中国份额转让 / S 基金</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">现象<br/>IPO 变晚</div><span class="arrow">→</span><div class="node-green">机制<br/>私募接住</div><span class="arrow">→</span><div class="node-orange">结果<br/>散户更晚</div><span class="arrow">→</span><div class="node">补丁<br/>私募流动性</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：公司不上市=失败或骗局。纠偏：可能是主动选择与融资能力。</p><p>误解：散户变穷只因不会选股。纠偏：优质早期 beta 更多在合格投资者池内。</p><p>误解：私募二级等于给散户开放独角兽。纠偏：多数仍有合格投资者与额度门槛。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解</h2>
    <div class="card card-blue">
      <h3>成长阶段迁移</h3>
      <p>公开市场仍重要，但捕获指数级成长的时间窗整体前移到私募；IPO 更像巨无霸的流动性事件。</p>
      
      
    </div>
    <div class="card card-purple">
      <h3>墙被拆掉</h3>
      <p>大钱、二级转让与更高股东人数门槛，削弱「必须 IPO」的压力，强化 private longer 循环。</p>
      <div class="quote">以前靠 IPO 解决的问题，现在不 IPO 也能解决。</div>
      
    </div>
    <div class="card card-orange">
      <h3>基础设施化</h3>
      <p>NPM、S 基金、份额平台说明：私募大到需要价格发现与退出管道，而不能只靠熟人撮合。</p>
      
      
    </div></div>
  <div class="section"><h2 class="sec-title">谁在什么阶段赚钱</h2><div class="card"><table><thead><tr><th>阶段</th><th>主要参与者</th><th>散户位置</th></tr></thead><tbody><tr><td>早期成长</td><td>VC/增长私募</td><td>通常进不去</td></tr><tr><td>私募后期</td><td>PE/主权/养老金</td><td>偶有间接</td></tr><tr><td>IPO 后</td><td>公开市场</td><td>可买但更贵更大</td></tr></tbody></table></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>视频偏美中机制对比，未覆盖发行制度改革细节。</li><li>访谈噪音段不作独立论据。</li><li>「散户越来越穷」是结构隐喻，非入户收入统计结论。</li></ul><div class="pitfall">把未上市高估值当已兑现回报。</div><div class="pitfall">忽略私募流动性折价与信息劣势。</div></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>IPO 年龄与七年上市率是硬现象。</li><li>低利率+另类配置+JOBS 是机制三角。</li><li>流动性补丁在追赶私募体量。</li></ul><h3>行动清单</h3><ol><li>看新股故事时问：多少成长已在私募完成。</li><li>配置上区分公开 beta 与私募准入现实。</li><li>跟踪本国份额转让与公募间接私募产品风险披露。</li></ol><h3>关键认知转变</h3><p>从「等 IPO 发财」转向「理解成长被私募前置」。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 13分30秒</div>
</div>
    </div>
  </foreignObject>
</svg>
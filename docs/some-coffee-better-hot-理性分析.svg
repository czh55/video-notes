.summary-line{font-size:17px;line-height:1.7;padding:18px 22px;background:#fff;border-radius:12px;border-left:4px solid #b45309;margin-bottom:18px;color:#44403c}
.map{background:#fff;border-radius:18px;padding:28px;margin-bottom:20px}
.map h2{margin-top:0;border:none;padding:0}

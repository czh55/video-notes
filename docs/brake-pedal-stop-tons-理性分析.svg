      <div class="container root-wrap">
<h1>刹车：力如何被放大</h1>
<div class="meta"><span class="tag tag-blue">物理</span><span class="tag tag-orange">汽车</span><span class="tag tag-green">线控</span></div>
<div class="summary-line">核心判断：脚力经杠杆、真空、液压面积比放大；线控改信号链但不取消液压执行与机械兜底；脚力存在饱和点。</div>
<div class="timeline"><h3>关键证据时间轴</h3>
<div class="timeline-item"><span class="timeline-time">00:17</span><span>杠杆</span></div>
<div class="timeline-item"><span class="timeline-time">00:23</span><span>真空助力</span></div>
<div class="timeline-item"><span class="timeline-time">00:52</span><span>帕斯卡轮缸</span></div>
<div class="timeline-item"><span class="timeline-time">01:33</span><span>线控</span></div>
<div class="timeline-item"><span class="timeline-time">02:43</span><span>脚力饱和</span></div>
</div>
<div class="diagram">
<div class="node node">杠杆</div>
<div class="arrow">→</div>
<div class="node node node-orange">真空助力</div>
<div class="arrow">→</div>
<div class="node node node-green">液压面积比</div>
</div>
<div class="correction"><h3>常见误解纠偏</h3><p>「踩得越死刹车越强」在达到最大制动力后不成立；ABS/路面附着才是极限。</p></div>
<div class="card "><h3>两条架构</h3>
<table><tr><th>类型</th><th>踏板角色</th><th>特点</th></tr>
<tr><td>传统液压</td><td>直接传力</td><td>熄火变沉</td></tr>
<tr><td>线控</td><td>传感器</td><td>可回收、需冗余</td></tr>
</table>
</div>
<div class="conclusion"><h2>总结与行动</h2>
<h3>核心要点</h3><ul><li>三级放大</li><li>线控是信号不是魔术</li><li>脚力有天花板</li></ul>
<h3>行动清单</h3><ul><li>口述 150 倍例子</li><li>区分真空失效与刹车油失效</li><li>紧急制动注重早踩稳踩而非狂踩</li></ul>
</div><div class="footer">video-notes · b65bo · 理性分析</div></div>
    </div>

      <div class="container root-wrap"><h1>耳朵怎么听出和弦里有几个音？</h1><div class="meta"><span class="tag tag-blue">泛音</span><span class="tag tag-green">基频</span><span class="tag tag-orange">和弦</span><span class="tag tag-purple">听音</span><span class="tag tag-gray">时长 3分16秒</span><span class="tag tag-gray">理性分析 · 听觉认知</span></div><a class="source-link" href="https://xhslink.cn/o/1VSYARWlmfy">原视频</a><div class="summary-line">核心判断：分音靠的是谐波打包，不是「最响」也不是「差频」；听和弦先外后内。</div><div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">几个音？</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">泛音列</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">消失基频</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">非差频</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">和弦分组</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">听法</span></div></div><div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>怎么分音</div><span class="arrow">→</span><div class="node-green">证据<br/>泛音/实验</div><span class="arrow">→</span><div class="node-orange">判断<br/>谐波打包</div><span class="arrow">→</span><div class="node">行动<br/>先外后内</div></div></div><div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR 击频→基频；耳窝→耳蜗；古中→古筝。</p><p>误解：音高=最响分音——纠偏：共同周期。</p></div><div class="section"><h2 class="sec-title">观点拆解</h2><div class="card card-purple"><h3>单音≠单频</h3><p>泛音列被耳蜗拆开，再被大脑打包。</p><div class="quote">这一整组叫泛音列</div><div class="relation">为和弦分音打地基。</div></div><div class="card "><h3>消失的基频</h3><p>去掉基频音高仍在，说明看周期结构。</p><div class="quote">这叫消失的基频</div><div class="relation">解释古筝强泛音不改音高。</div></div><div class="card card-orange"><h3>不是差频</h3><p>整体平移后差不变音高变。</p><div class="quote">所以耳朵听的不是差</div><div class="relation">否决差频捷径。</div></div><div class="card card-green"><h3>听和弦口令</h3><p>先最高再最低最后中间；中间可早出/颤音。</p><div class="quote">所以听和弦要先外后内</div><div class="relation">可立刻练习。</div></div></div><div class="section"><h2 class="sec-title">机制对照</h2><div class="card"><table><thead><tr><th>说法</th><th>对吗</th><th>要点</th></tr></thead><tbody><tr><td>听最响那条</td><td>否</td><td>看共同周期</td></tr><tr><td>听差频</td><td>否</td><td>平移实验否决</td></tr><tr><td>按整数倍打包</td><td>是</td><td>偏开就跳出</td></tr></tbody></table></div></div><div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>科普动画级解释，非心理声学论文。</li><li>乐器音色差异会改难度。</li></ul><div class="pitfall">把八度当两个同等显著的音。</div><div class="pitfall">一上来死磕中间声部。</div></div></div><div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>谐波打包成音</li><li>非最响非差频</li><li>先外后内</li></ul><h3>行动清单</h3><ol><li>单音听泛音分离</li><li>合唱弦先哼外声部</li><li>中间音加颤试听</li></ol><h3>关键认知转变</h3><p>从「数音头」转向「听谐波组」。</p></div><div class="footer">双轨产物之二 · 理性分析 · 3分16秒</div></div>
    </div>

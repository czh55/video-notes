<div class="container">
  <h1>小 Ollie 第二步：垂直蹲起怎么蹲</h1>
  <div class="meta">
    <span class="tag tag-blue">运动动作</span>
    <span class="tag tag-green">滑板 Ollie</span>
    <span class="tag tag-orange">下蹲储能</span>
    <span class="tag tag-purple">小红书 · 34秒</span>
  </div>
  <div class="summary-line">核心判断：Ollie 前的下蹲是「垂直拉开大腿储能」，不是往后坐；压成髋-膝-踝三折叠后释放回弹，用大腿把上身顶出去——半蹲够用，受力在前脚掌，重心直上直下。</div>
  <a class="source-link" href="https://xhslink.cn/o/8OFoTSbnZXl">原视频（小红书短链）</a>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">点题「垂直蹲起」：站板半蹲滑行</span></div>
    <div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">纠偏：下蹲不是往下坐；大腿拉开储能</span></div>
    <div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">「三折叠」：红箭头标髋/膝/踝同时屈曲</span></div>
    <div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">弹簧隐喻：释放回弹 + 大腿顶上身</span></div>
    <div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">爆发演示：尾压起板、人离地</span></div>
    <div class="timeline-item"><span class="timeline-time">00:29</span><span class="timeline-text">双脚受力点：前后脚均压前脚掌</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node node-orange">往后坐<br/>重心后移</div>
      <div class="arrow">→</div>
      <div class="node">垂直拉开<br/>大腿储能</div>
      <div class="arrow">→</div>
      <div class="node">三折叠<br/>压实弹簧</div>
      <div class="arrow">→</div>
      <div class="node node-green">回弹上顶<br/>半蹲爆发</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>把下蹲做成「坐椅子」会让重心后移、脚跟压死，后面很难把上身和板一起干净顶起。作者主张的是垂直方向的拉开与压缩：像压弹簧，而不是往后倒进座椅。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">观点拆解</h2>

    <div class="card">
      <h3>1. 下蹲的物理任务：拉开储能</h3>
      <p><strong>在讲什么：</strong>蹲不是为了「蹲得低好看」，而是给起跳准备弹性势能。</p>
      <p><strong>关键理解：</strong>大腿被拉开像弹力带；蹲到位时应感到绷紧拉伸，而不是松垮坐死。</p>
      <p><strong>怎么用：</strong>每次练习先问「大腿有没有被拉开」，再问「蹲得深不深」。</p>
      <div class="quote">证据来源：画面字幕「大腿肌肉被拉开 储能」+ 作者笔记「像弹力带一样被拉开，储存弹性势能」。</div>
    </div>

    <div class="card card-purple">
      <h3>2. 起身靠大腿上顶，不只是脚蹬地</h3>
      <p><strong>在讲什么：</strong>发力叙事从「蹬地」改写为「释放回弹 + 大腿顶上身」。</p>
      <p><strong>关键理解：</strong>脚与地面的作用力仍存在，但作者强调可感知的主动环节是伸髋伸膝把躯干抛上去；弹簧特效强化「先压后松」。</p>
      <p><strong>怎么用：</strong>起身瞬间想「顶上身」，而不是只想「踩地板」。</p>
      <div class="highlight">立场分层：发力口令是作者教学主张；生物力学精确分解视频未给出，练习以体感与画面为准。</div>
      <div class="quote">证据来源：字幕「释放回弹 / 大腿把上身顶起」+ 笔记「不是单纯靠脚蹬地面」。</div>
    </div>

    <div class="card card-green">
      <h3>3. 三折叠：髋-膝-踝一起折</h3>
      <p><strong>在讲什么：</strong>压缩形态要完整，避免单关节代偿。</p>
      <p><strong>关键理解：</strong>只弯膝、髋不折或踝锁死，弹簧压不实，回弹路径也会歪。</p>
      <div class="action">行动：镜子或侧拍检查三点折角是否同时出现；作者画面用红箭头反复强调。</div>
      <div class="quote">证据来源：画面标注「说 n 遍的三折叠」+ 髋/膝/踝红箭头。</div>
    </div>

    <div class="card card-orange">
      <h3>4. 幅度与受力：半蹲 + 前脚掌</h3>
      <p><strong>在讲什么：</strong>够用深度与站板压力分布。</p>
      <p><strong>关键理解：</strong>半蹲即可；压力落在前后脚的前脚掌，配合重心直上直下，才容易干脆爆发。</p>
      <div class="pitfall">避坑：蹲太深却坐进脚跟；或前脚掌虚浮、脚跟死撑——两者都会破坏垂直回弹。</div>
      <div class="quote">证据来源：笔记「半蹲幅度就够用」「重心直上直下」+ 示意图「双脚站板受力点」前脚掌高亮。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">错误蹲 vs 垂直蹲起</h2>
    <div class="card">
      <table>
        <thead>
          <tr><th>维度</th><th>往后坐（易错）</th><th>垂直蹲起（作者主张）</th></tr>
        </thead>
        <tbody>
          <tr><td>重心轨迹</td><td>明显后移</td><td>直上直下</td></tr>
          <tr><td>大腿感受</td><td>松垮或后链代偿</td><td>拉开、绷紧储能</td></tr>
          <tr><td>关节形态</td><td>常只弯膝</td><td>髋-膝-踝三折叠</td></tr>
          <tr><td>起身意图</td><td>硬蹬地面</td><td>释放回弹，大腿顶上身</td></tr>
          <tr><td>站板压力</td><td>易压脚跟</td><td>前脚掌受力点</td></tr>
          <tr><td>幅度策略</td><td>越深越好（误）</td><td>半蹲够用，求爆发干脆</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">方法边界</h2>
    <div class="card">
      <p>适用于滑板 Ollie 入门阶段的蹲伸感觉训练；不替代完整 Ollie（弹板、前脚抹板、收腿等后续步骤）。膝/踝伤病史、平衡能力差异视频未评估——疼痛或失控时停止。配乐盖住口播，结论优先采信画面字幕与作者笔记，而非 ASR 歌词。</p>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>下蹲 = 垂直拉开储能，不是往后坐。</li>
      <li>压缩要三折叠；起身释放回弹，大腿顶上身。</li>
      <li>半蹲够用；前后脚压力放在前脚掌。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>无板或静板：垂直半蹲 8–10 次，只检查「大腿拉开感」。</li>
      <li>侧拍一张：确认髋、膝、踝三点折角（三折叠）。</li>
      <li>站板感受前脚掌压力，再做「压紧→干脆弹起」。</li>
      <li>起身口令换成「顶上身」，少念「使劲踩」。</li>
      <li>能稳定半蹲爆发后，再衔接到完整 Ollie 弹板练习。</li>
    </ol>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：蹲得越低越好 → 现在：半蹲拉开、能弹即可。</li>
      <li>以前：起跳=脚蹬地 → 现在：起跳=回弹 + 大腿上顶。</li>
      <li>以前：只盯膝盖弯曲 → 现在：髋-膝-踝一起折。</li>
    </ul>
  </div>

  <div class="footer">证据：画面字幕 + 作者笔记文案 · ASR 仅为英文 BGM 歌词 · 分析视角：动作结构</div>
</div>
    </div>
  </foreignObject>
</svg>
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>普通人审丑积累</h1>
  <div class="meta"><span class="tag tag-blue">审丑</span><span class="tag tag-green">五官搭配</span><span class="tag tag-orange">美商</span><span class="tag tag-purple">互斥</span><span class="tag tag-gray">时长 49秒</span><span class="tag tag-gray">理性分析 · 审美训练</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AYyQhz65iZS">原视频</a>
  <div class="summary-line">核心判断：普通人变美的高效路径是先积累「审丑」——记住特征A与特征B的互斥，避免缺陷互相放大，而不是先追单点网红长相。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">眼型短→眉峰勿低</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">眼距宽→鼻背勿窄</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">眼位低→卧蚕勿宽</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">眼睛突→泪沟勿平</span></div><div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">下颌宽→泪沟勿凹</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">中庭长→鼻头高光勿低</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>为什么学了很多还显差</div><span class="arrow">→</span><div class="node-green">证据<br/>互斥搭配清单</div><span class="arrow">→</span><div class="node-orange">判断<br/>先审丑再增材</div><span class="arrow">→</span><div class="node-blue">行动<br/>闪卡式自检</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：单点变美就能整体好看。纠偏：视频强调组合禁忌。</p><p>ASR术语跳动（TG/列G等），按泪沟/眉峰等语境理解。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：互斥表</h3>
      <p>八条「A出现时B不能同时强化」的口令，训练对失衡的敏感度。</p>
      <div class="quote">OK你学会了下一个</div>
      <div class="relation">美商是识别错误搭配的速度。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：妆造决策树</h3>
      <p>先给自己贴特征标签，再划掉互斥项（卧蚕宽度、眉峰高度、唇厚等）。</p>
      <div class="quote">普通人审丑积累</div>
      <div class="relation">减法优先于加法。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：不是医美处方</h3>
      <p>快闪口令有简化与绝对化；个体骨骼与审美目标不同，不能直接当手术/填充方案。</p>
      <div class="quote">OK你都学会了下课</div>
      <div class="relation">当闪卡，不当医嘱。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>口令式简化模型。</li><li>术语以画面语境校正ASR。</li></ul><div class="pitfall">照搬网红单点却踩互斥。</div><div class="pitfall">把口令当成唯一真理。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>丑感常来自组合。</li><li>审丑是变美前置技能。</li><li>先停错再求对。</li></ul><h3>行动清单</h3><ol><li>列出自己3个主特征。</li><li>对照视频划掉互斥妆造。</li><li>改妆后只看是否还踩互斥。</li></ol><h3>关键认知转变</h3><p>从「我要加点什么」转向「我不能同时要什么」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 49秒</div>
</div>
    </div>
  </foreignObject>
</svg>
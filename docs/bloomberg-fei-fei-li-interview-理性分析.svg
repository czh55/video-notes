      <div class="container">
<h1>彭博深度专访李飞飞：世界模型与物理智能</h1>
<div class="meta">李飞飞 · 世界模型 · ImageNet · Marble · AI伦理 · <a href="https://b23.tv/ukdyHwP">原视频</a></div>
<div class="summary"><strong>核心判断：</strong>李飞飞谈 ImageNet 遗产与 World Labs：世界模型补上物理世界的编辑/行动/规划，并警惕神之复合。</div>
<div class="card"><h3>结构重组</h3><ul><li><strong>[00:00→06:00] 看的遗产</strong> — ImageNet 竞赛 + AlexNet/GPU 打开现代深度学习叙事。</li><li><strong>[06:00→12:00] 世界模型</strong> — 编辑、行动、规划三功能；Marble 生成可探索 3D。</li><li><strong>[12:00→18:00] 创业早期</strong> — 专注单点；资本与算力需求不确定；类比 LLM 爆发前。</li><li><strong>[18:00→24:05] 责任与边界</strong> — 向领导人给科学事实；强技术可被滥用；民主社会需共同掌控而非停摆。</li></ul></div>
<div class="card"><h3>适用边界</h3><ul>
<li>纪实作者观点与口播口径，金额/车队数为约数，勿当投研结论。</li>
<li>ASR 专名已校正；细节以原视频与官方披露为准。</li>
</ul></div>
<div class="conclusion"><h2>行动结论</h2><ul><li>从「看图」到「在物理世界里行动与规划」是下一章；技术越强，越要拒绝个人神谕式叙事。</li></ul></div>

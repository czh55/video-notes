  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们！今天来教大家玩转Lightroom预设的魔法🔮进入正题前，需要安装包的家人们，➕群找我拿最新APP安装包。
	
💡预设是什么？
简单讲就是“懒人滤镜包”，类似美图秀秀的一键滤镜，把调好的参数存为模板，下次直接套到其他照片上。
	
✨如何创建自己的预设？
	
[种草R]先调出一张满意的照片（我这张青橙色调还行😎）。点击右上角三个点「创建预设」（图2）
	
[种草R]给预设起个名字，比如「夜景青橙色调」。名称下面的“预设组”，默认是“用户预设”，这里很关键，点击下箭头按风格或场景新建预设组，像“人像”“风景”“夜景”“复古”“ins风”等，方便后续查找。下边的“蒙版、镜头模糊、几何”等选项，通常默认不勾选，因为不同照片这些要素不同，也可按需勾选，最后点击“√”完成保存（图3）。
	
💡保存好的预设在哪找？
	
[种草R]点击下方的“预设”图标（两个交叉重叠的圈），点击“您的版本”，就能看到自己新建的预设组“夜景”，再点进去，就能找到“夜景青橙色调”啦（图4）。除了自己创建，点击“建议”和“高级版”，还能看到APP自带的很多预设，可按需选用。
	
📸如何用预设一键修图？</div>

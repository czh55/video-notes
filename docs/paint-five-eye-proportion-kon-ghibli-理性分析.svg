  </div>
  <div class="conclusion"><h2>结论</h2><p>先猜猜封面哪张是千寻的原图，答案在第 2 页。外面常说的口诀“五眼”说脸横着正好五只眼宽，两眼之间占一只。千寻的两眼之间放得下两只多，看着却一点不怪。
	
放几</p></div>

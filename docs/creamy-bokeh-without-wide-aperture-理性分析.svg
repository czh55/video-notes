      <div class="container root-wrap">
  <h1>没有大光圈？4招拍出奶油般虚化</h1>
  <div class="meta"><span class="tag tag-blue">虚化</span><span class="tag tag-green">光圈</span><span class="tag tag-orange">物距</span><span class="tag tag-purple">焦距</span><span class="tag tag-red">背景距离</span><span class="tag tag-gray">时长 1分19秒</span><span class="tag tag-gray">理性分析 · 景深控制</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8VvaEBhebFT">原视频</a>
  <div class="summary-line">核心判断：奶油背景是光圈×物距×焦距×背景距离的乘积；大光圈只是变量之一，口诀「开大、靠近、拉长、推远」。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">立题反驳</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">光斑原理</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">变量1光圈</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">变量2靠近</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">变量3焦距×2→虚化×4</span></div><div class="timeline-item"><span class="timeline-time">00:52</span><span class="timeline-text">变量4推远背景</span></div><div class="timeline-item"><span class="timeline-time">01:13</span><span class="timeline-text">四字口诀</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>无大光圈如何虚化</div><span class="arrow">→</span><div class="node-green">证据<br/>四变量对照图</div><span class="arrow">→</span><div class="node-orange">判断<br/>乘积模型</div><span class="arrow">→</span><div class="node-blue">行动<br/>背口诀实拍</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：只有F1.8才有虚化。纠偏：几何与距离可补。</p><p>误解：焦距加倍虚化加倍。纠偏：画面称约×4。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：四旋钮</h3>
      <p>同一基准上分别开大、靠近、拉长、推远，观察光斑直径变化。</p>
      <div class="quote">开大、靠近、拉长、推远</div>
      <div class="relation">外拍前选两个旋钮组合。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：套餐示例</h3>
      <p>视频示例：靠近+55mm+背景20m外，可胜过贴墙F1.8。</p>
      <div class="quote">就赢了离墙1米拍的F1.8</div>
      <div class="relation">先让背景远离再谈光圈。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：透视变形</h3>
      <p>靠近与长焦会改变脸部透视，人像需权衡。</p>
      <div class="quote">退後一點讓人一樣大</div>
      <div class="relation">构图与虚化联立。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">基准与变量（画面）</h2><div class="card"><table><thead><tr><th>变量</th><th>操作示意</th></tr></thead><tbody><tr><td>光圈</td><td>F4 → F2</td></tr><tr><td>人距</td><td>约3m → 1.5m</td></tr><tr><td>焦距</td><td>50 → 100（虚化约×4）</td></tr><tr><td>背景</td><td>人后3m → 30m</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>倍数关系为视频教学示意，精确DO F公式未展开。</li></ul><div class="pitfall">贴墙拍还怪光圈。</div><div class="pitfall">只拉长焦忽略构图空间。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>虚化可合成。</li><li>背景距离常被低估。</li><li>口诀可外带。</li></ul><h3>行动清单</h3><ol><li>同一人像拍四版各改一变量。</li><li>优先检查身后是否有纵深。</li><li>套头镜先走到虚化再考虑购新镜。</li></ol><h3>关键认知转变</h3><p>从「买大光圈」转向「调四旋钮」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分19秒</div>
</div>
    </div>
  </foreignObject>

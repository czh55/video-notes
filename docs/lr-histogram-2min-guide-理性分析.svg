<div class="container">
  <h1>🔥2分钟看懂直方图｜轻松告别瞎调乱调！</h1>
  <div><span class="tag">Lightroom</span><span class="tag">修图</span><span class="tag">教程</span></div>
  <p class="summary-line">[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直接上手修图，可它绝对是修图的关键密码，掌握看直方图的技巧，修图能力直接起飞🛫今天</p>
  <div class="card"><h3>封面/要点：[种草R]家人们，今天必须给你们分享</h3><p>[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直</p></div><div class="card"><h3>第5/18页：🔥2分钟看懂直方图｜轻松告别瞎调乱</h3><p>[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直</p></div><div class="card"><h3>第9/18页：🔥2分钟看懂直方图｜轻松告别瞎调乱</h3><p>[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直</p></div><div class="card"><h3>第13/18页：🔥2分钟看懂直方图｜轻松告别瞎调</h3><p>[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直</p></div><div class="card"><h3>第17/18页：🔥2分钟看懂直方图｜轻松告别瞎调</h3><p>[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天必须给你们分享修图界的“隐藏神器”——直方图📊别看它不能直接上手修图，可它绝对是修图的关键密码，掌握看直方图的技巧，修图能力直接起飞🛫今天东哥手把手带家人们认识这个“修图神器”，赶紧先码住🌟
	
[一R]快速锁定直方图
[种草R]打开LR，点击右上角三个点的工具（图2），找到“视图选项”（图3），再点“直方图”，直方图就会出现在照片一角啦✨
	
[种草R]直方图里有灰色、红色、绿色和蓝色，灰色是照片三种颜色信息叠加而成（图4）。横坐标代表亮度，从0到255，最左边是纯黑，最右边是纯白；纵坐标代表对应亮度的像素数量，堆积得越高，说明对应亮度和色彩的像素越多（图5）。
	
[种草R]举个例子，一张全灰照片，直方图只会在横坐标正中间显示像素，意味着照片既没亮部，也没暗部，只有灰色（图6）。
	
[二R]用直方图拿捏照片明暗
[彩虹R]高亮（调）照片：这张照片整体超亮，直方图较亮部分高高耸起，黑色阴影信息少得可怜，白色区域蓝色最多，红色和绿色集中在高光区域（图7）。
	
[种草R]降低曝光，直方图信息就会往左边中间调区域跑（图8）；要是继续提升曝光，直方图信息会向右边区域</div>

<h1>DeepSeek 连融两轮 500 亿：梁文锋想干什么</h1>
<div class="meta">DeepSeek · 梁文锋 · 开源 · 融资 · AGI · <a href="https://b23.tv/1LCbtK0">原视频</a></div>
<div class="summary"><strong>核心判断：</strong>DeepSeek 连融为期权定价留人；开源权重省推理卡并换国产算力生态，战略减法奔 AGI。</div>
<div class="card"><h3>结构重组</h3><ul><li><strong>[00:00→01:30] 融资画像</strong> — 腾讯/宁德/京东等入场，梁本人重仓；号称不缺钱却融资。</li><li><strong>[01:30→03:00] 抢人战场</strong> — 核心作者被挖；无融资则期权无对价，对抗不了明码标价 offer。</li><li><strong>[03:00→06:24] 开源换卡</strong> — 不做一堆热闹方向；开源权重省推理与脏活，并服务国产卡生态。</li></ul></div>
<div class="card"><h3>适用边界</h3><ul>
<li>纪实作者观点与口播口径，金额/车队数为约数，勿当投研结论。</li>
<li>ASR 专名已校正；细节以原视频与官方披露为准。</li>
</ul></div>
<div class="conclusion"><h2>行动结论</h2><ul><li>两轮融资要读成「人才资产负债表」与「算力/生态结盟」，不是普通成长股扩表。</li></ul></div>

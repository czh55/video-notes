<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="3497" viewBox="0 0 1320 3497">
  <foreignObject x="0" y="0" width="1320" height="3497">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff7ed;color:#292524}
.wrap{padding:40px 48px 56px}
h1{font-size:32px;line-height:1.35;color:#1c1917;margin-bottom:8px}
h2{font-size:22px;color:#9a3412;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #fed7aa}
h3{font-size:17px;color:#1c1917;margin:0 0 8px}
p,li{font-size:15px;line-height:1.75;color:#44403c}
ul,ol{padding-left:1.2em;margin:0}
li{margin:0 0 6px}
.kicker{font-size:13px;letter-spacing:.06em;font-weight:700;color:#b45309;margin-bottom:8px}
.meta{font-size:13px;color:#78716c;margin-bottom:14px}
.meta a{color:#b45309;text-decoration:none}
.lede{font-size:16px;line-height:1.75;background:#fff;border-left:4px solid #b45309;border-radius:12px;padding:16px 18px;margin-bottom:8px}
.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 2px 12px rgba(180,83,9,.06);margin:14px 0}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px;margin:8px 0 16px}
th{text-align:left;background:#ffedd5;color:#9a3412;padding:10px 12px}
td{padding:10px 12px;border-top:1px solid #fed7aa;vertical-align:top;color:#44403c;line-height:1.65}
.page{font-weight:700;color:#b45309;white-space:nowrap}</style>
      
<div class="wrap">
  <p class="kicker">理性分析 · 小红书 · 穿搭云</p>
  <h1>二十栏是对照清单，不是唯一戴法</h1>
  <p class="meta">2026-10-17 · 图文 4 页 · <a href="https://xhslink.cn/o/2VPSwHeLW1E">原文短链</a></p>
  <p class="lede">标题写「20种领口对应20种项链」。四页各 5 栏，栏数是 20。方领、U 领、船领、高领各出现两次，项链用词有的改了。笔记正文还另写了圆领、衬衫和层叠，图上没有同名栏。先按页抄标签，再决定要不要照戴。</p>

  <h2>比较</h2>
  <table>
    <tr><th>领口</th><th>第 1 页</th><th>第 2 页</th><th>第 3 页</th><th>第 4 页</th></tr>
    <tr><td>船领</td><td class="page">贴颈短链</td><td></td><td class="page">贴颈细链</td><td></td></tr>
    <tr><td>垂坠领</td><td class="page">细长吊坠</td><td></td><td></td><td></td></tr>
    <tr><td>高领</td><td class="page">外戴长项链</td><td></td><td class="page">外戴长项链</td><td></td></tr>
    <tr><td>不对称领</td><td class="page">Y 字垂坠链</td><td></td><td></td><td></td></tr>
    <tr><td>U 领</td><td class="page">极简短项链</td><td></td><td class="page">圆形吊坠</td><td></td></tr>
    <tr><td>方领</td><td></td><td class="page">方形吊坠</td><td class="page">几何短吊坠</td><td></td></tr>
    <tr><td>心形领</td><td></td><td class="page">圆形或水滴吊坠</td><td></td><td></td></tr>
    <tr><td>深 V 领</td><td></td><td class="page">Y 字长项链</td><td></td><td></td></tr>
    <tr><td>挂脖领</td><td></td><td class="page">极细短项链</td><td></td><td></td></tr>
    <tr><td>一字肩</td><td></td><td class="page">短款锁骨链</td><td></td><td></td></tr>
    <tr><td>Polo 领</td><td></td><td></td><td class="page">极简锁骨链</td><td></td></tr>
    <tr><td>翻领 V 领</td><td></td><td></td><td></td><td class="page">小圆牌短项链</td></tr>
    <tr><td>飘带领</td><td></td><td></td><td></td><td class="page">极简细链</td></tr>
    <tr><td>蕾丝领</td><td></td><td></td><td></td><td class="page">精致短吊坠</td></tr>
    <tr><td>胸衣领</td><td></td><td></td><td></td><td class="page">短 Y 字链</td></tr>
    <tr><td>工字背心领</td><td></td><td></td><td></td><td class="page">几何短吊坠</td></tr>
  </table>
  <table>
    <tr><th>页脚口诀</th><th>图上原句</th></tr>
    <tr><td class="page">第 1 页</td><td>领口越横向，项链越贴近；领口越高，项链越外戴；不对称领口用竖向线条更显瘦。</td></tr>
    <tr><td class="page">第 2 页</td><td>项链线条呼应领口线条，更不容易出错。</td></tr>
    <tr><td class="page">第 3 页</td><td>领口越横向，项链越贴近；领口越高，项链越往外戴；基础款先选短而精致。</td></tr>
    <tr><td class="page">第 4 页</td><td>领口越有设计感，项链越要简洁；V 形开口可用短吊坠聚焦中线。</td></tr>
  </table>
  <div class="card">
    <h3>和笔记正文并排</h3>
    <p>正文六条是：方领对几何短吊坠，圆领对小圆牌或短项链，V 领对 Y 字链和长吊坠，一字肩对锁骨链和层叠细链，高领对长项链，衬衫对短吊坠或叠戴。能对上图的，主要是第 3 页方领的「几何短吊坠」，以及第 1、3 页高领的外戴长项链。圆领、衬衫没有同名栏。一字肩在第 2 页只写短款锁骨链。</p>
  </div>

  <h2>易错</h2>
  <div class="card">
    <ul>
      <li>把 20 栏当成 20 个不重复的领口。方领、U 领、船领、高领各占了两栏。</li>
      <li>U 领合成一条。第 1 页是极简短项链，第 3 页是圆形吊坠。</li>
      <li>方领合成一条。第 2 页是方形吊坠，第 3 页是几何短吊坠。正文只保留了后者。</li>
      <li>船领的「贴颈短链」和「贴颈细链」写成同一种链。两页都靠近脖子，链条粗细图上没有毫米。</li>
      <li>把所有 V 都戴成 Y 字长链。第 2 页深 V 是 Y 字长项链；第 4 页翻领 V 是小圆牌短项链，页脚写的是短吊坠聚焦中线。</li>
      <li>按正文给一字肩叠两条链。第 2 页栏目标签只有短款锁骨链。</li>
      <li>把「更显瘦」「更不容易出错」当成量过的结果。这两句在第 1、2 页页脚，没有对照数据。</li>
    </ul>
  </div>

  <h2>边界</h2>
  <div class="card">
    <p>图是线稿加插画，衣服看起来是深色，项链是浅色，不是真人试穿记录。页脚句末的小图标形状无法确认。Polo 领、胸衣领、工字背心领的开口高低，以栏名和线稿为准，不要用正文里的「圆领」「衬衫」去替换。第 3 页「基础款先选短而精致」没有定义基础款。高领两页都写外戴，但第 1 页用「越外戴」，第 3 页用「越往外戴」，链长没有数字。这些对应是作者的一种整理，同一领口换长度、换吊坠仍然可以成立。</p>
  </div>

  <h2>动作</h2>
  <div class="card">
    <ol>
      <li>先认领口落在哪一页：横向开口看第 1、3 页，线条呼应看第 2 页，领口已经有飘带、蕾丝、胸衣结构看第 4 页。</li>
      <li>同一领口出现两次时，两栏并列留下，不合并成一句「标准答案」。</li>
      <li>高领先试戴在衣领外面的长链（第 1、3 页）。翻领 V 先试小圆牌短项链（第 4 页），不要直接套深 V 的 Y 字长链。</li>
      <li>一字肩先按第 2 页的短款锁骨链。层叠细链只在正文里，图上没有这一栏。</li>
      <li>出门前用页脚当检查：项链是贴在领口内侧、压在领线上，还是明显戴在衣服外。压在领线上时，这套图没有给处理办法。</li>
    </ol>
  </div>
</div>
    </div>
  </foreignObject>
</svg>
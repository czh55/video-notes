      <h1>双轮廓是风格，不是故障</h1>
<table>
<tr><th>看哪里</th><th>第 2 页的问法</th></tr>
<tr><td>叶子、树枝</td><td>虚线是不是芯外再套一圈</td></tr>
<tr><td>高光</td><td>光斑边缘有没有亮边</td></tr>
<tr><td>整片背景</td><td>会不会化开</td></tr>
</table>
<p>第 1 页左边标不明显、右边标明显。第 3、4 页没有标签。易错：把没标的样张当成反例。边界：没有镜头型号。</p>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="4077" viewBox="0 0 1320 4077">
  <foreignObject x="0" y="0" width="1320" height="4077">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:24px;font-weight:700;color:#1e40af;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:18px;font-weight:700;color:#334155;margin-bottom:10px}
p,li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:8px}
ul{padding-left:22px}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}
.meta{margin:12px 0 16px}
.summary-line{font-size:17px;padding:18px 22px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04);color:#334155;line-height:1.7}
.timeline{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#1e40af;margin-bottom:12px}
.timeline-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}
.map{background:#fff;border-radius:20px;padding:28px;margin:20px 0;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:16px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:14px;padding:14px 18px;font-weight:700;color:#1e40af;text-align:center;min-width:140px}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{color:#94a3b8;font-size:22px}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:18px 22px;border-radius:12px;margin:16px 0}
.correction h3,.correction p{color:#92400e}
.card{background:#fff;border-radius:16px;padding:24px;margin:14px 0;border-left:5px solid #3b82f6;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card.card-purple{border-left-color:#8b5cf6}
.card.card-orange{border-left-color:#f59e0b}
.quote{background:#f8fafc;padding:12px 14px;border-radius:10px;margin:10px 0;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.pitfall{background:#fef2f2;padding:12px 14px;border-radius:10px;margin:10px 0;color:#991b1b;border-left:4px solid #ef4444}
.action{background:#eff6ff;padding:12px 14px;border-radius:10px;margin:10px 0;color:#1e40af;border-left:4px solid #3b82f6}
.highlight{background:#fef3c7;padding:12px 14px;border-radius:10px;margin:10px 0;color:#92400e;border-left:4px solid #f59e0b}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th{background:#f1f5f9;padding:10px 14px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:10px 14px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:32px;margin-top:28px}
.conclusion h2,.conclusion h3{color:#fff;border:none;padding:0}
.conclusion h2{margin-top:0;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.conclusion h3{margin:18px 0 8px;font-size:17px}
.conclusion li{color:rgba(255,255,255,.92)}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:24px 0}</style>
      
<div class="container">
  <h1>现代式发球你会吗?</h1>
  <div class="meta">
    <span class="tag tag-blue">1分17秒</span>
    <span class="tag tag-green">小羊老师</span>
    <span class="tag tag-orange">网球发球对照</span>
  </div>
  <div class="summary-line">核心判断：现代式发球相对传统奖杯位，把引拍「简约化」——重心在后时身体与手同时后移，拍头停在大腿前附近，不再大幅向后摆；可参考德式发球准备动作，再把准备—后移—连贯三步连起来。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:01</span><span>字幕「传统发球是这样」+ 奖杯位示范</span></div>
    <div class="timeline-item"><span class="timeline-time">00:20</span><span>「简约化」：拍停大腿前</span></div>
    <div class="timeline-item"><span class="timeline-time">00:44</span><span>「参考德式发球」画中画</span></div>
    <div class="timeline-item"><span class="timeline-time">00:56</span><span>「身体和手同时向后」</span></div>
    <div class="timeline-item"><span class="timeline-time">00:59</span><span>「没有再向后摆了啊」</span></div>
    <div class="timeline-item"><span class="timeline-time">01:04</span><span>「把三个步骤连起来」→「再看一遍」</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">传统奖杯位<br/>大环引拍</div>
      <div class="arrow">→</div>
      <div class="node node-orange">对照问题<br/>还要不要大摆？</div>
      <div class="arrow">→</div>
      <div class="node node-green">现代式<br/>同向后移 + 不大摆</div>
      <div class="arrow">→</div>
      <div class="node">三步连贯<br/>可参考德式</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>「现代式＝完全不引拍」——片中仍要求重心在后时身体与手同时向后，只是反对继续大幅向后摆环。口播碎片极少，勿把 Whisper 三句当成完整教案。</p>
  </div>

  <div class="card">
    <h3>对照轴：传统 vs 现代式引拍</h3>
    <p><strong>在讲什么：</strong>用同一人在同一场地，先钉传统奖杯位，再切到简约终点与德式参照。</p>
    <p><strong>关键理解：</strong>差异主要落在引拍幅度与拍头停留高度，而不是抛球口号。</p>
    <div class="quote">画面依据：「传统发球是这样」「简约化」「参考德式发球」。</div>
    <div class="action">怎么用：侧拍自己发球准备段，看拍头是否仍抡到脑后奖杯位。</div>
  </div>

  <div class="card card-purple">
    <h3>UP 主观点：不大摆 + 手脚同向</h3>
    <p>作者明确主张：重心在后时身体和手同时向后，且「没有再向后摆」。这是立场性教学口号，不是实验室测得的最优解。</p>
    <div class="quote">字幕：「身体和手同时向后」「没有再向后摆了啊」。</div>
    <div class="highlight">立场分层：可验证事实是屏幕出现上述字幕与动作；「德式」为参照标签，片中未展开德式力学细节。</div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>维度</th><th>传统（片中示范）</th><th>现代式（片中主张）</th></tr></thead>
      <tbody>
        <tr><td>可见标志</td><td>奖杯位：手上举、拍在脑后</td><td>拍头多停在大腿前附近</td></tr>
        <tr><td>引拍路径</td><td>更大环、更靠后</td><td>简约化，强调不再大幅后摆</td></tr>
        <tr><td>身体协同</td><td>未细讲</td><td>重心在后时身体与手同时后移</td></tr>
        <tr><td>外部参照</td><td>—</td><td>「参考德式发球」画中画</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>方法边界与避坑</h3>
    <div class="pitfall">避坑：不要把「参考德式」理解成必须模仿职业球员的完整下肢蹬伸与抛球节奏——视频只给准备位参照。</div>
    <div class="pitfall">避坑：不要因「不大摆」而僵在身前完全无后移；片中仍要求身体与手同时向后。</div>
    <p>适用：业余发球引拍自检、对照录像。不适用：伤病史评估、比赛战术发球选择、量化拍头速度训练。</p>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>先认传统奖杯位，再认现代式简约终点。</li>
      <li>关键句：重心后移时手脚同向后移，且不再大幅向后摆。</li>
      <li>德式发球是参照标签，不是完整技术复制清单。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>手机侧拍 10 秒准备段，标出拍头最高/最后位置。</li>
      <li>对照「大腿前结束」检查是否仍抡到脑后。</li>
      <li>练「同向后移」时口令：后脚重心 → 身体与手一起走，拍不继续抡环。</li>
      <li>慢速把准备、后移、连贯三步串一遍，再「再看一遍」自检。</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：发球好坏只看「举得高不高」→ 现在：先看引拍是否过度后摆。</li>
      <li>以前：学职业动作就整套照搬 → 现在：只取准备位参照，盯住自己的拍头路径。</li>
    </ul>
  </div>
  <div class="footer">证据：画面字幕与 6 张截图；Whisper 非空分段 3（繁体碎片）。分析视角：引拍对照，非完整发球动力链。</div>
</div>

    </div>
  </foreignObject>
</svg>
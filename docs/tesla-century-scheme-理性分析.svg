      <div class="container root-wrap">
  <h1>特斯拉的世纪阳谋</h1>
  <div class="meta"><span class="tag tag-blue">特斯拉</span><span class="tag tag-green">马斯克</span><span class="tag tag-orange">物理AI</span><span class="tag tag-purple">能源</span><span class="tag tag-red">Robotaxi</span><span class="tag tag-gray">时长 23分52秒</span><span class="tag tag-gray">战略叙事分析</span></div>
  <a class="source-link" href="https://b23.tv/D9haXBu">原视频</a>
  <div class="summary-line">世纪阳谋的逻辑链是：物理 AI 需要能量 → 地面电网太慢 → 轨道算力+星舰+月球工业想象 → 特斯拉提供身体与现实数据。投资误判常来自用车企季度模型阅读平台期权。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">不止卖车：物理世界渗透</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">功率类比到吉瓦瓶颈</span></div><div class="timeline-item"><span class="timeline-time">06:30</span><span class="timeline-text">轨道数据中心思路</span></div><div class="timeline-item"><span class="timeline-time">09:00</span><span class="timeline-text">星舰与卫星数量级</span></div><div class="timeline-item"><span class="timeline-time">10:30</span><span class="timeline-text">月球工业想象</span></div><div class="timeline-item"><span class="timeline-time">12:30</span><span class="timeline-text">车/Robotaxi/Optimus 身体</span></div><div class="timeline-item"><span class="timeline-time">15:30</span><span class="timeline-text">Q1：软件利润信号</span></div><div class="timeline-item"><span class="timeline-time">20:30</span><span class="timeline-text">质疑清单与杰文斯</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">瓶颈<br/>能源</div><span class="arrow">→</span><div class="node-green">解法<br/>轨道算力</div><span class="arrow">→</span><div class="node-orange">身体<br/>特斯拉</div><span class="arrow">→</span><div class="node">误读<br/>车企模型</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：特斯拉=高估值电车。纠偏：叙事核心是物理 AI 网络节点。</p><p>误解：宏图=已落地产能。纠偏：大量是压力工具与远景，需工程验证。</p><p>误解：更省电模型会减少总用电。纠偏：杰文斯视角下总用量可能上升。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解</h2>
    <div class="card card-blue">
      <h3>把计算搬走</h3>
      <p>电难远距无损传送，结果易传送；轨道太阳能与连续光照是物理诱饵，卫星数量与维护是工程地狱。</p>
      
      
    </div>
    <div class="card card-purple">
      <h3>身体与数据</h3>
      <p>屏幕 AI 吃互联网；物理 AI 吃车队与工厂试错。特斯拉同时是需求方、数据方与制造方。</p>
      <div class="quote">AI 要进入现实，需要躯壳。</div>
      
    </div>
    <div class="card card-orange">
      <h3>报表与期权</h3>
      <p>交付疲软可以与软件利润、平台叙事并存；空头看当下，多头看未入账期权——两者都要列风险。</p>
      
      
    </div></div>
  <div class="section"><h2 class="sec-title">生态分工</h2><div class="card"><table><thead><tr><th>块</th><th>角色</th><th>卡点</th></tr></thead><tbody><tr><td>SpaceX</td><td>入轨物流</td><td>复用成本与频率</td></tr><tr><td>xAI</td><td>模型大脑</td><td>训练能耗与竞争</td></tr><tr><td>Tesla</td><td>身体+数据</td><td>监管/交付/执行</td></tr><tr><td>能源/轨道</td><td>功率供给</td><td>建设与维护</td></tr></tbody></table></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>功率数字为教学类比，非电网规划书。</li><li>月球工业属远期构想，证据层级低于车与 FSD。</li><li>单季财报不能证明平台转型成功。</li></ul><div class="pitfall">把愿景时间表当承诺交付日。</div><div class="pitfall">忽视在轨维护与监管一票否决。</div></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>阳谋公开：能源→太空→物理身体。</li><li>特斯拉护城河候选是现实数据与制造。</li><li>读估值先选框架：车企 or 物理 AI。</li></ul><h3>行动清单</h3><ol><li>跟踪 FSD 订阅、Robotaxi 里程、Optimus 工厂任务。</li><li>并列阅读星舰飞行节奏与单位成本。</li><li>投资论点必须写明不相信的部分。</li></ol><h3>关键认知转变</h3><p>从「卖车公司贵不贵」转向「物理 AI 期权兑不兑现」。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 23分52秒</div>
</div>

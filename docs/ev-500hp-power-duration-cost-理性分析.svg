      <div class="container root-wrap">
  <h1>电车五百匹为什么看起来「白送」</h1>
  <div class="meta"><span class="tag tag-blue">电车功率</span><span class="tag tag-green">电机</span><span class="tag tag-orange">电池放电</span><span class="tag tag-purple">热管理</span><span class="tag tag-gray">时长 4分04秒</span><span class="tag tag-gray">理性分析 · 动力成本</span></div>
  <a class="source-link" href="https://xhslink.cn/o/349m3uKsyXt">原视频</a>
  <div class="summary-line">核心判断：电机加功率的机械门槛确实更低，但五百匹的成本转移到电池放电、逆变器与热管理；更关键的是持续时间——几秒峰值与几分钟持续不是同一成本。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">第一层：电机加功率门槛低</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">第二层：电从哪来、热怎么压</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">第三层：要持续多久</span></div><div class="timeline-item"><span class="timeline-time">03:40</span><span class="timeline-text">峰值做出来只是第一步</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>五百匹是否白送</div><span class="arrow">→</span><div class="node-green">证据<br/>放电/电控/热/时长</div><span class="arrow">→</span><div class="node-orange">判断<br/>成本搬家+看持续</div><span class="arrow">→</span><div class="node-blue">行动<br/>问峰值时长</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：电机简单=系统便宜。纠偏：成本从燃烧强化搬到电气与热管理链。</p><p>误解：标称马力可直接横比。纠偏：先对齐可持续输出时间。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：三层拆解「白送」幻觉</h3>
      <p>从机械直觉→能量供给→持续时间，逐层打断「电车马力免费」的跳跃。</p>
      <div class="quote">大功率的成本没消失，只是从发动机里搬到了另一套系统里。</div>
      <div class="relation">理解：看不见的成本仍在账单上。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：看参数先问时长</h3>
      <p>零百几秒满功率与赛道连续高负荷，对电池与冷却要求完全不同。</p>
      <div class="quote">这五百匹，要持续多久？</div>
      <div class="relation">行动：对比车型时索要持续功率/热衰减相关信息。</div>
    </div>
    <div class="card card-orange">
      <h3>证据边界：口播后段截断</h3>
      <p>Whisper末段不完整；分析止于已出现的三层逻辑，不补未核实的具体车型数据。</p>
      <div class="quote">把五百匹做出来，这是第一步。</div>
      <div class="relation">立场：师傅教学对话中的工程常识框架。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">成本搬家对照</h2><div class="card"><table><thead><tr><th>层级</th><th>看起来</th><th>实际约束</th></tr></thead><tbody><tr><td>机械</td><td>电机加功率简单</td><td>不等于整车便宜</td></tr><tr><td>能量</td><td>数字好写</td><td>电池/逆变器瞬时能力</td></tr><tr><td>热</td><td>短时峰值可冲</td><td>持续输出要压得住</td></tr><tr><td>营销</td><td>二十万标五百匹</td><td>常对应短时工况</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>未给出具体车型放电倍率或持续功率曲线。</li><li>「白送」是修辞，用于批评只看峰值。</li></ul><div class="pitfall">用峰值马力当唯一比较维度。</div><div class="pitfall">忽略热衰减。</div><div class="pitfall">把加速成绩外推到长时间高负荷。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>电机降低的是一类成本，不是全部。</li><li>持续时间定义马力含金量。</li><li>电气链与热管理是新账单。</li></ul><h3>行动清单</h3><ol><li>问清峰值与持续工况。</li><li>关注高速/爬坡连续输出体验。</li><li>把冷却与电池健康纳入长期成本。</li></ol><h3>关键认知转变</h3><p>从「有多少匹」转向「能撑多久」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 4分04秒</div>
</div>
    </div>
  </foreignObject>
</svg>
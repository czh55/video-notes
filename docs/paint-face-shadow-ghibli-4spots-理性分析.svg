<div class="container">
  <h1>画脸阴影总画脏？照吉卜力这4个位置画</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里 17 张年轻人的脸，一块一块标出来数了一遍。
	
① 背光那侧一大块
17 张</p>
  <div class="card"><h3>封面/要点：宫崎骏的人物，脸总是很干净。阴影到底</h3><p>宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里</p></div><div class="card"><h3>第5/10页：画脸阴影总画脏？照吉卜力这4个位置</h3><p>宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里</p></div><div class="card"><h3>第9/10页：画脸阴影总画脏？照吉卜力这4个位置</h3><p>宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里 17 张年轻人的脸，一块一块标出来数了一遍。
	
① 背光那侧一大块
17 张全有。光越偏，这块越大；上沿顺着刘海和鬓角，常常连到脖子，边是硬的。
	
② 几道细细的小影子，贴着五官
上眼皮上方一道（11 张），鼻底或鼻侧一小块（5 张），下唇下面一小块（5 张），耳朵里一块（亮的那一侧露出来的 6 只耳朵，全都画了）。
	
③ 不画的：颧骨下
17 张一张都没有。只有老人大伯公，皱纹、眼袋、颧骨下全画了。
	
为什么这样画？我的推断是：一部长片要画几万张，每多一块影子，每张都要多描一道线、多涂一块颜色。块少才画得完，放起来也不闪。一大块交代光从哪边来，几道细影让眼睛凹进去、嘴唇鼓出来。
	
也不是每部片都这样。我翻了宫崎骏的几部老片，多数也有那一大块；给小孩看的《龙猫》《金鱼姬》，脸上几乎不画。细田守干脆不画影子，据 MOVIE WALKER 的说法，这是作画监督山下高明的点子，让人物在写实的风景里跳出来。
	
写实素描和不少插画走的是另一条路：眼窝、颧骨下都是大片的暗面，还带渐变，比如米山舞 2025</div>

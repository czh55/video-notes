  </div>
  <div class="conclusion"><h2>结论</h2><p>宫崎骏的人物，脸总是很干净。阴影到底画在哪？我把《你想活出怎样的人生》官网剧照里 17 张年轻人的脸，一块一块标出来数了一遍。
	
① 背光那侧一大块
17 张</p></div>

    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;padding:48px 60px;color:#1e293b}h1{font-size:34px;font-weight:900;color:#1e40af;margin-bottom:8px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;border-left:5px solid #3b82f6}.card h3{font-size:20px;color:#1e40af;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f1f5f9;color:#1e40af}</style>
      <h1>常见食用鸡：先看天数</h1>
<p>整篇只有第 1 页。下面按图上的出栏区间重组，不是另找的标准。</p>
<div class="card"><h3>三条用法</h3>
<p>40 天上下的白羽，以及约 50 天的 817，图上把它们放进炸、烤、鸡排和快餐整鸡，供给也最高。</p>
<p>60–120 天的三黄、黄羽、清远，做法集中在白切、盐焗、酱油鸡。文昌再长一点，仍是白切和地方鸡饭。</p>
<p>120–180 天的乌鸡和土鸡供给更低。乌鸡被写成药膳汤，土鸡被写成炖、焖、砂锅。</p></div>
<table><tr><th>你要做的</th><th>图上指向</th><th>不要默认</th></tr>
<tr><td>快餐、炸烤、鸡排</td><td>白羽、817</td><td>拿乌鸡去炸</td></tr>
<tr><td>白切、盐焗</td><td>三黄、黄羽、清远、文昌</td><td>只看羽毛黄不黄</td></tr>
<tr><td>长时间汤</td><td>土鸡、乌鸡</td><td>用 40 天白羽硬炖出老鸡味</td></tr></table>
<div class="card"><h3>边界</h3>
<p>天数是图上的常见商品区间，页眉已经写明会随地区和养殖方式变。供给高低是这张图的标注，不是报价。清远、文昌的「名种」没有附认证。</p></div>
    </div>
  </foreignObject>

  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天东哥带你们玩转 Lightroom 里超牛的颜色分级工具！打开 Lightroom，打开颜色便可找到颜色分级工具
	
一、颜色分级是啥
[种草R]简单讲，它如同厉害的 “分区染色师”，把照片按明暗分成阴影、中间调、高光及全局分区域加色
	
二、工具界面介绍
[种草R]点开颜色分级工具，可见 4 个彩色圆。从左至右，依次控制阴影、中间调、高光和全局色彩。圆外小圆圈调 “色相”，圆内小圆圈调 “饱和度”，越往外拉，饱和度越高。（图2）
	
[种草R]彩圆右下方 “&lt;”（图3），点击后弹出 “色相” 与 “饱和度” 横条，上面 “圆圈” 和彩圆上小圆圈作用相同，操作方式有别，按习惯选就好。
	
[种草R]下方 “明亮度” 之前讲过，略过。
	
[种草R]“混合” 像神奇 “搅拌棒”，控制中间调与阴影、高光的融合。左移，中间调颜色向阴影、高光渗透；右移，阴影、高光颜色向中间调靠拢。
	
[种草R]“平衡” 如天平，决定高光与阴影颜色 “势力”。左移，阴影颜色突出；右移，高光颜色显眼，二者皆影响全局。
	

.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>吴易昺专访｜2026我和我的四大满贯</h1>
  <div class="meta"><span class="tag tag-blue">吴易昺</span><span class="tag tag-green">满贯</span><span class="tag tag-orange">健康管理</span><span class="tag tag-purple">亚运会</span><span class="tag tag-red">前三十</span><span class="tag tag-gray">时长 10分57秒</span><span class="tag tag-gray">理性分析 · 运动员决策</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8u8AsmzzoUZ">原视频</a>
  <div class="summary-line">核心判断：阿炳把赛季叙事从「名场面输赢」拧回三件可执行事——健康管理与reset、用训练撕标签、用亚运金牌定义比保分更重要的目标；2026自我验收线清晰：前三十。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">不服德约这场</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">健身房合影</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">澳网自我不满</span></div><div class="timeline-item"><span class="timeline-time">03:10</span><span class="timeline-text">美网回前百</span></div><div class="timeline-item"><span class="timeline-time">04:10</span><span class="timeline-text">最满意健康管理</span></div><div class="timeline-item"><span class="timeline-time">05:00</span><span class="timeline-text">撕标签靠实事</span></div><div class="timeline-item"><span class="timeline-time">06:30</span><span class="timeline-text">多次复出仍想放弃</span></div><div class="timeline-item"><span class="timeline-time">07:40</span><span class="timeline-text">漂亮网球要高baseline</span></div><div class="timeline-item"><span class="timeline-time">09:30</span><span class="timeline-text">亚运重于杭州保分</span></div><div class="timeline-item"><span class="timeline-time">10:50</span><span class="timeline-text">三十就可以了</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>2026怎么算好样</div><span class="arrow">→</span><div class="node-green">证据<br/>健康/标签/抉择</div><span class="arrow">→</span><div class="node-orange">判断<br/>前三十+能连续打</div><span class="arrow">→</span><div class="node-blue">行动<br/>公开目标+管理赛程</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：出圈输球=失败叙事终点。纠偏：他要的下一场出圈是赢。</p><p>误解：永不言弃只靠意志。纠偏：四字太重；靠康复、复出经验与固执。</p><p>误解：排名回前百就是终点。纠偏：他更在意亚运与长期健康。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：名场面背后的身体账</h3>
      <p>温网德约、美网福地都是可见高光；他反复回到连续参赛、疼痛与伤病语义、reset。</p>
      <div class="quote">要学会让自己的身体跟思想都要reset。</div>
      <div class="relation">成绩是结果，健康管理是今年自评分。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：撕标签清单</h3>
      <p>伤病标签→先做到无疼痛；红土标签→每天比昨天好一点的训练反馈；参赛计划→别被拼劲带偏真实需要。</p>
      <div class="quote">想要撕掉这个标签，但是其实是需要做一些实际的事情。</div>
      <div class="relation">口号换成可打勾的训练项。</div>
    </div>
    <div class="card card-purple">
      <h3>抉择：亚运 vs 保分</h3>
      <p>放弃杭州大分风险巨大，仍选亚运金牌；目标早说是为了围绕金牌组织准备。</p>
      <div class="quote">就三十，三十就可以了。</div>
      <div class="relation">2026验收标准被他自己钉死。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">访谈中的价值排序（口述）</h2><div class="card"><table><thead><tr><th>选项</th><th>他的倾向</th><th>理由摘要</th></tr></thead><tbody><tr><td>温网出圈输球</td><td>不服，要赢着出圈</td><td>有赢面/殿堂情结</td></tr><tr><td>排名前百</td><td>不特别在意</td><td>专注亚运会战</td></tr><tr><td>杭州保分</td><td>可放弃</td><td>亚运金牌更重要</td></tr><tr><td>2026自评</td><td>前三十</td><td>明确数字目标</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>赛事细节以访谈口述为准，个别专有名词有ASR音近误差。</li><li>不构成对运动员赛程的外部评价。</li></ul><div class="pitfall">只剪德约名场面忽略健康主线。</div><div class="pitfall">把永不言弃当道德绑架。</div><div class="pitfall">用单次排名波动否定实力。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>健康管理是赛季真分数。</li><li>撕标签靠训练证据。</li><li>公开大奖赛目标可以是减压装置。</li></ul><h3>行动清单</h3><ol><li>看球时同时问：这周有没有reset。</li><li>把「标签」改写成3条训练指标。</li><li>重大抉择用「八年心结」级目标校准。</li></ol><h3>关键认知转变</h3><p>从「赢没赢名场面」转向「能不能健康地打完自己的巅峰窗口」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 10分57秒</div>
</div>
    </div>
  </foreignObject>

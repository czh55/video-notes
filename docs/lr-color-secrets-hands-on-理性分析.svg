  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们👋，我是东哥，今儿带大家解锁 LR 里超牛的 “颜色” 工具！打开 LR 的 “编辑”，再点 “颜色”，一堆调色法宝就出现啦。
	
[种草R]这里有 “黑白”“分级”“混合”，下面一行是 “白平衡”“原照设置” （点开旁边下箭头，还有 “自动”“自定义”），再右边有个 “吸管” 图标，最下面还有 “色温”“色调”“自然饱和度” 和 “饱和度”（图2）。
	
[向右R]“黑白” 很简单，一点照片就变黑白了。“分级” 和 “混合” 咱之后再聊。
	
[向右R]先讲讲关键的 “白平衡”。
	
[种草R]白平衡，就是相机等设备在不同光线条件下，把白色物体还原成白色的功能，靠调整色温、色调参数，让画面色彩自然准确。
	
[种草R]比如白色柜门，开白光时是白色，开暖光受光线影响就变黄了（图3、图4），这时通过调整色温、色调，就能把柜门变回白色，其他颜色被光线影响变色，也能这样还原。
	
[向右R]下面讲讲工具用法。
	
[一R]“原照设置” 就是照片原本的样子，调整后点它可还原。
	
[二R]“自动” 是 APP 分析照片后，自动调色温、色调，比如把图 4点 “自动”，立马变白，参</div>

      <div class="container root-wrap">
<h1>极简照片的生产系统</h1>
<div class="meta"><span class="tag tag-blue">风光</span><span class="tag tag-purple">Hasselblad Master</span><span class="tag tag-green">创作方法</span></div>
<div class="summary-line">核心判断：画面「简单」是减信息策略 + 跨领域审美 + 条件规划的产物；观众看不见画面外的研究与等待。</div>
<div class="timeline"><h3>关键证据时间轴</h3>
<div class="timeline-item"><span class="timeline-time">00:53</span><span>单一主体</span></div>
<div class="timeline-item"><span class="timeline-time">01:37</span><span>白平衡图形化</span></div>
<div class="timeline-item"><span class="timeline-time">03:03</span><span>音乐/建筑来路</span></div>
<div class="timeline-item"><span class="timeline-time">06:35</span><span>规划雪雾潮汐</span></div>
<div class="timeline-item"><span class="timeline-time">08:01</span><span>灯塔案例</span></div>
</div>
<div class="diagram">
<div class="node node">认出主体</div>
<div class="arrow">→</div>
<div class="node node node-orange">削弱竞争</div>
<div class="arrow">→</div>
<div class="node node node-green">等待条件</div>
</div>
<div class="correction"><h3>常见误解纠偏</h3><p>「他就是运气好碰到干净场景」低估了研究与季节/潮汐选择；简单也不等于必须空无一物。</p></div>
<div class="card "><h3>三件工具箱</h3>
<p>天气遮罩、构图取舍、技术（如 WB）服务同一目标：降噪。</p>
<div class="action">下次出门先写：我要减掉什么？</div>
</div>
<div class="card card-purple"><h3>风格来源</h3>
<p>少抄摄影师互文，多从别的媒介偷结构与调性。</p>
</div>
<div class="conclusion"><h2>总结与行动</h2>
<h3>核心要点</h3><ul><li>简单=编辑</li><li>灵感可跨界</li><li>条件可计划</li></ul>
<h3>行动清单</h3><ul><li>为同一点位列三种天气预案</li><li>做一张「忙」对照一张「简」</li><li>白平衡故意点错一次看图形变化</li></ul>
</div><div class="footer">video-notes · b65b · 理性分析</div></div>

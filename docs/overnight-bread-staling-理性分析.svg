      <h1>冷藏加速老化，冷冻才暂停</h1>
<table>
<tr><th>页</th><th>结论</th></tr>
<tr><td>2/5</td><td>糊化后变软，冷却重结晶后变硬</td></tr>
<tr><td>3/5</td><td>敞开放会蒸发；0–4°C 老化最快</td></tr>
<tr><td>4/5</td><td>加热暂时复软，放凉二次老化更硬</td></tr>
<tr><td>5/5</td><td>20–25°C 短期；超过 2 天密封冷冻</td></tr>
</table>
<p>易错：把冷藏当成保鲜。边界：没有解冻步骤，也没有按面包种类分开。</p>

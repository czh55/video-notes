  <h1>新手小白 | 揭秘！三点布光法玩法！</h1>
  <div><span class="tag">摄影</span><span class="tag">光影</span><span class="tag">教程</span></div>
  <p class="summary-line">今天来学习三点布光法！
三点布光是好莱坞、人像棚拍基础万能布光，三灯各司其职：主光塑形、辅光补阴影、轮廓光分离主体，布光顺序固定：先主光→再辅光→最后轮廓光。
</p>

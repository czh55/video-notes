三点布光是好莱坞、人像棚拍基础万能布光，三灯各司其职：主</p></div><div class="card"><h3>第5/7页：新手小白 | 揭秘！三点布光法玩法！</h3><p>今天来学习三点布光法！
三点布光是好莱坞、人像棚拍基础万能布光，三灯各司其职：主</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">今天来学习三点布光法！
三点布光是好莱坞、人像棚拍基础万能布光，三灯各司其职：主光塑形、辅光补阴影、轮廓光分离主体，布光顺序固定：先主光→再辅光→最后轮廓光。
	
人像摄影中最经典、最常用的一种布光方式，由主光、辅光和轮廓光这三个光源组成，能够在打亮主体的同时，塑造立体感，提升画面质感。
	
✅主光：画面光影核心，最强光
核心作用：定明暗基调、塑造面部立体感、决定阴影走向，整张照片的曝光基准光。
	
✅辅光：阴影软化，控制画面反差
核心作用：填充主光打出的死黑阴影，保留暗部细节，调节画面柔和 / 戏剧氛围，绝对不能亮过主光。
	
✅轮廓光：分离主体，勾勒发丝金边
核心作用：把人物从背景剥离，避免人物和背景融为一体，提亮发丝、肩膀、侧脸边缘，增加画面纵深感。</div>

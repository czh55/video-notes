      <div class="container root">
<h1>广东：一个省，多种地方世界</h1>
<a href="https://xhslink.cn/o/6ubI5C8mIZz">原笔记</a>
<div class="summary">核心判断：广东「不像一个省」指的是地方世界密度——语言系统、迁徙史、广府/潮汕/客家入口与珠三角辐射叠在一起；行政统一与文化多元并不矛盾。</div>
<div class="card"><h3>结构</h3><ul>
<li>三入口入门，但粤东粤西粤北珠三角仍要拆</li>
<li>广州中心=珠江商贸长期积累</li>
<li>珠江：连接与差异同时发生</li>
</ul></div>
<div class="conclusion"><h2>行动</h2><ul>
<li>介绍广东先问「哪一片」再谈标签</li>
<li>用方言地图读迁徙层，而非口音笑话</li>
</ul></div>
<div class="footer">video-notes · why-guangdong-unlike-a-province</div></div>

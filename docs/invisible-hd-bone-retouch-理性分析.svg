.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>修了像没修的高清骨相修图思路</h1>
  <div class="meta"><span class="tag tag-blue">高清骨相</span><span class="tag tag-green">原生质感</span><span class="tag tag-orange">辨识度</span><span class="tag tag-purple">下颌角</span><span class="tag tag-red">头包脸</span><span class="tag tag-gray">时长 2分37秒</span><span class="tag tag-gray">理性分析 · 隐形修图</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6E2ZPRPtZPB">原视频</a>
  <div class="summary-line">核心判断：「修了像没修」有两条不可破：骨相辨识度与皮肤原生质感；其余全是毫米级结构挪动——收下唇、推颏唇沟、平衡下庭、保留下颌角拐点，最后才做头包脸与头身比。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">两条精髓：辨识度+原生质感</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">收下唇、推颏唇沟</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">拉高下巴后要外带平衡</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">保留下颌角拐点并平推</span></div><div class="timeline-item"><span class="timeline-time">02:31</span><span class="timeline-text">对比：自然不假面</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>如何自然又高级</div><span class="arrow">→</span><div class="node-green">证据<br/>毫米位移+质感保留</div><span class="arrow">→</span><div class="node-orange">判断<br/>身份&gt;标准下巴模板</div><span class="arrow">→</span><div class="node-blue">行动<br/>结构→细节→头身比</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：下巴要修成标准长度翘度。纠偏：作者说不需要那么标准。</p><p>误解：磨皮等于精修。纠偏：第二条铁律就是保留原生质感。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：隐形的两条铁律</h3>
      <p>辨识度与原生质感先于所有液化。</p>
      <div class="quote">一是要保留他本来骨相结构的辨识度。</div>
      <div class="relation">开修前先锁定「还是不是她」。</div>
    </div>
    <div class="card card-green">
      <h3>下庭流程</h3>
      <p>收下唇→颏唇沟→拉高并外带→上推厚重→留拐点平推增折叠。</p>
      <div class="quote">要保留这个下颌角拐点。</div>
      <div class="relation">下庭是一条流水线。</div>
    </div>
    <div class="card card-orange">
      <h3>收束标准</h3>
      <p>头包脸+头身比后看对比：自然不假面。</p>
      <div class="quote">保留了原生质感，并且非常自然不假面。</div>
      <div class="relation">终检用「像没修」。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>案例针对轻微地包天+后缩下巴，换脸型需重估。</li><li>ASR「古相/科唇脚/怪垫/头包铃/头身饼」已按骨相/颏唇沟/拐点/头包脸/头身比理解。</li></ul><div class="pitfall">磨平皮肤换假面感。</div><div class="pitfall">拉高下巴不外带导致下庭失调。</div><div class="pitfall">削掉下颌角拐点。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>隐形修图先保身份与质感。</li><li>下庭要平衡不要模板下巴。</li><li>终检标准是像没修。</li></ul><h3>行动清单</h3><ol><li>列出只动的3–5个点。</li><li>每步前后对比像不像本人。</li><li>皮肤质感单独开关验收。</li></ol><h3>关键认知转变</h3><p>从「按网红模板拉满」转向「毫米级结构+质感不动」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 2分37秒</div>
</div>
    </div>
  </foreignObject>
</svg>
<div class="container">
  <h1>场馆一混光，肤色先乱</h1>
  <div><span class="tag">摄影</span><span class="tag">光影</span><span class="tag">教程</span></div>
  <p class="summary-line">室内体育照片常见的麻烦，不是背景不够白，而是脸、手、球衣和观众席分别接到了不同颜色的光。顶灯可能偏绿，墙面反射可能偏暖，电子屏又会带来青色。逐张凭感觉调白平衡，</p>
  <div class="card"><h3>封面/要点：室内体育照片常见的麻烦，不是背景不够</h3><p>室内体育照片常见的麻烦，不是背景不够白，而是脸、手、球衣和观众席分别接到了不同颜</p></div><div class="card"><h3>第5/8页：场馆一混光，肤色先乱</h3><p>室内体育照片常见的麻烦，不是背景不够白，而是脸、手、球衣和观众席分别接到了不同颜</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">室内体育照片常见的麻烦，不是背景不够白，而是脸、手、球衣和观众席分别接到了不同颜色的光。顶灯可能偏绿，墙面反射可能偏暖，电子屏又会带来青色。逐张凭感觉调白平衡，整组肤色很容易忽冷忽热。
	
处理时先把主脸作为基准。选择主体状态、曝光和对焦都过关的一张，判断脸是偏青、偏橙还是偏洋红，再看手部和受光球衣是否朝同一方向。背景里的看台、广告牌和反光地板颜色不稳定，不能只因接近白就当成中性面。
	
顺序可以固定成三步。第一步把脸与球衣的亮度拉到可判断，第二步确定色温与色调，第三步让同场照片向这张基准靠。如果现场有稳定白墙、灰卡或白标，可以用它辅助判断；没有可靠中性面时，先守住肤色方向。
	
降噪要分彩色与明度两层。先压掉暗部红绿斑，再处理颗粒，并在100%查看眼睛、眉毛、发丝和球衣字边。明度降噪拉得太重，皮肤会失去纹理，头发和衣料也会被磨成一团。缩略图看起来干净，不代表放大后仍然可信。
	
锐化只照顾主次。脸、手和球衣文字可以获得少量局部锐化，观众席、墙面和失焦背景保持保守。全图一起提高细节，会把原本需要退后的环境重新推到前景，也会放大高ISO区域的颗粒和边缘伪影。
	
这组图使用一张可商用体育</div>

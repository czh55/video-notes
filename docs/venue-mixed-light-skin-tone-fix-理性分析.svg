  <div class='bound'>图文轮播笔记；无时间轴口播。</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>室内体育照片常见的麻烦，不是背景不够白，而是脸、手、球衣和观众席分别接到了不同颜色的光。顶灯可能偏绿，墙面反射可能偏暖，电子屏又会带来青色。逐张凭感觉调白平衡，</p></div>

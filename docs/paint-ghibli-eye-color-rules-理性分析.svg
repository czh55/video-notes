<div class="container">
  <h1>吉卜力眼睛上色4个规律：高光和眼白同色</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量了眼白、高光和瞳孔的颜色。得出了这些规律：
	
① 眼白不是白的，亮度跟着皮肤走</p>
  <div class="card"><h3>封面/要点：宫崎骏《你想活出怎样的人生》官网剧照</h3><p>宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量</p></div><div class="card"><h3>第5/11页：吉卜力眼睛上色4个规律：高光和眼白</h3><p>宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量</p></div><div class="card"><h3>第9/11页：吉卜力眼睛上色4个规律：高光和眼白</h3><p>宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量了眼白、高光和瞳孔的颜色。得出了这些规律：
	
① 眼白不是白的，亮度跟着皮肤走
30 只没有一只是纯白。眼白的 B 和亮面皮肤几乎一样（29 只里只差 −3 到 +6），只是 S 拉到了 0。第 3 页把眼白改成纯白，眼睛立刻像贴上去的。
	
② 高光不比眼白白
量得到高光的 22 只里，20 只高光和眼白几乎同色。看着亮，是因为点在 B 9 的黑瞳孔上。大多每只眼一个，一大一小的只有 2 张，都是带笑的镜头。
	
③ 眼白也有影子，但只是灰
脸上的大块影子经过眼睛，眼白跟着压暗；脸最大的 3 张特写，眼白上沿还多一道上眼皮的影子。和皮肤的影子暗得差不多，但皮肤的偏暖，眼白的还是灰。
	
④ 瞳孔平涂
近景是黑瞳孔加一圈虹膜色，远景合成一块更深的颜色。30 只没有一只画渐变。
	
为什么？真人的眼白会随年纪变暗、变黄，修成“超白”只显年轻，并不更好看，上眼皮的影子是通用画法
	
别人很不一样：新海诚《天气之子》的眼白带暖，影子是粉紫；LAM 把眼白涂成紫色；しぐれうい的虹膜上暗下亮，再撒彩色碎光。
	
所</div>

  </div>
  <div class="conclusion"><h2>结论</h2><p>宫崎骏《你想活出怎样的人生》官网剧照里 17 张脸、30 只眼睛，一只只放大，量了眼白、高光和瞳孔的颜色。得出了这些规律：
	
① 眼白不是白的，亮度跟着皮肤走</p></div>

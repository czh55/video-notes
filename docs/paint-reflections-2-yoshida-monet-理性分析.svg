  <div class="conclusion"><h2>结论</h2><p>画倒影，有些人的画法是把东西复制一份、上下一翻。远处的山这么翻没问题，可近处站在石台上的人，一翻就不对了。封面是同一张吉田博《泰姬陵之朝雾》，A 是我把人直接翻</p></div>

<div class="container">
  <h1>怎么画倒影2｜看看吉田博和莫奈怎么画</h1>
  <div><span class="tag">绘画</span><span class="tag">上色</span><span class="tag">教程</span></div>
  <p class="summary-line">画倒影，有些人的画法是把东西复制一份、上下一翻。远处的山这么翻没问题，可近处站在石台上的人，一翻就不对了。封面是同一张吉田博《泰姬陵之朝雾》，A 是我把人直接翻</p>

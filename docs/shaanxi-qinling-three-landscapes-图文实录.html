<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="秦岭分南北，黄土—关中—秦巴三种山河，兼及水系、十城与 5A 分布。">
  <title>陕西有多不一样？一道秦岭，三种山河｜图文实录</title>
  <style>
  *{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;color:#292524;background:#f0fdf4}
  .container{width:min(960px,100%);margin:0 auto;padding:48px 32px 80px}
  a{color:#166534}.kicker{font-size:13px;letter-spacing:.08em;color:#166534;font-weight:700}
  h1{font-size:32px;line-height:1.35;margin:8px 0 12px}
  .meta{color:#78716c;font-size:14px;margin-bottom:18px}.lede{font-size:17px;color:#44403c}
  .story-section{margin:40px 0}
  .story-section h2{font-size:21px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #bbf7d0}
  img{display:block;max-width:100%;height:auto}
  figure{margin:24px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(22,101,52,.08)}
  figcaption{padding:14px 18px;color:#57534e;font-size:14px}
  .time-badge{font-weight:700;color:#166534;margin-right:6px}
  @media(max-width:640px){.container{padding:28px 18px 56px}h1{font-size:26px}}
  </style>
<style id="cap-en-style">
.cap-bilingual{padding:14px 18px}.cap-bilingual .cap-zh{color:#57534e;font-size:14px;line-height:1.7}.cap-bilingual .cap-zh .time-badge{font-weight:700;color:#b45309;margin-right:6px}.cap-bilingual .cap-en{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed #e7e5e4;color:#0f766e;font-size:14px;line-height:1.7}.cap-speak{flex:none;width:34px;height:34px;border:none;border-radius:50%;background:#0f766e;color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}.cap-speak:hover{background:#115e59;transform:scale(1.08)}.cap-speak.playing{background:#b45309;animation:capPulse 1s infinite}@keyframes capPulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
  <main class="container">
    <header>
      <p class="kicker">图文实录 · 小红书 · 山河志</p>
      <h1>陕西有多不一样？一道秦岭，三种山河</h1>
      <p class="meta">2026-10-29 · 图文 7 页 · <a href="https://xhslink.cn/o/56Uq3sFvHia">原文短链</a></p>
      <p class="lede">「中国地理·26」用七张立体示意把陕西压成可读结构：秦岭为脊分出黄土—关中—秦巴，再落到水系、风貌、十城与 5A。无口播，按页序读图；地形垂直夸张，数据为科普示意。</p>
    </header>
    <article>
      <section class="story-section" id="p1">
        <h2>第 1 页：一道秦岭，三种山河</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/01.jpg" alt="陕西山河总览：陕北黄土、关中平原、陕南秦巴立体示意" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">1/7</span>立体地形总览：陕北黄土高原、关中平原、陕南秦岭—大巴；太白山 3771.2 米。黄土铸骨、秦岭为脊、汉水滋养。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/6b12258ac359.mp3" type="button" aria-label="Play English audio">🔊</button><span>Overview: Loess Plateau, Guanzhong Plain, Qinling–Daba; Taibai 3771.2 m—loess bones, Qinling spine, Han River nourishes.</span></div>
<audio class="cap-audio" src="audio/6b12258ac359.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p2">
        <h2>第 2 页：从黄土高原到秦巴山地</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/02.jpg" alt="三区并列示意：黄土、渭河平原、秦巴山地" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">2/7</span>三区并列：陕北黄土沟壑、关中渭河平原（西安）、陕南秦巴山地与汉水；地貌三分铸三秦。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/e12a932c200f.mp3" type="button" aria-label="Play English audio">🔊</button><span>Three belts: loess gullies, Wei River plain with Xi’an, Qinling–Daba with Han River.</span></div>
<audio class="cap-audio" src="audio/e12a932c200f.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p3">
        <h2>第 3 页：秦岭把南北分开</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/03.jpg" alt="秦岭南北坡：气候、水系、植被对照" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">3/7</span>一道山脉影响气候、水系与植被：北侧偏干接黄土/渭河/黄河水系，南侧偏湿接汉中/汉江/长江水系；秦岭—淮河是重要分界但非一刀切。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/bedd3cf78cfb.mp3" type="button" aria-label="Play English audio">🔊</button><span>Qinling divides climate, drainage, and vegetation—north drier Yellow River side, south wetter Yangtze side.</span></div>
<audio class="cap-audio" src="audio/bedd3cf78cfb.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p4">
        <h2>第 4 页：北归黄河，南入长江</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/04.jpg" alt="水系：北黄河南长江示意" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">4/7</span>北侧渭河、泾河汇黄河；南侧汉江、丹江属长江水系；关中潼关一带为黄河转折示意。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/6ff1f79daa28.mp3" type="button" aria-label="Play English audio">🔊</button><span>Hydrology: Wei/Jing to Yellow River north; Han/Dan to Yangtze south.</span></div>
<audio class="cap-audio" src="audio/6ff1f79daa28.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p5">
        <h2>第 5 页：三秦的四张面孔</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/05.jpg" alt="四风貌拼图：俑、华山、乾坤湾、汉江田野" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">5/7</span>兵马俑·西安、华山·渭南、乾坤湾·延安、汉江·汉中——史迹、奇险、黄曲、清流四风貌。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/0c2a9057859e.mp3" type="button" aria-label="Play English audio">🔊</button><span>Four faces: Terracotta Army, Hua Shan, Qiankun Bend, Han River fields.</span></div>
<audio class="cap-audio" src="audio/0c2a9057859e.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p6">
        <h2>第 6 页：一山一水，十城共生</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/06.jpg" alt="陕西十地级市分布示意" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">6/7</span>十个地级市叠在三分地貌上：榆林延安偏北，关中西安等，汉中安康商洛偏南；杨凌示范区另计。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/3690d0a7e3cf.mp3" type="button" aria-label="Play English audio">🔊</button><span>Ten prefecture-level cities overlaid on the three landform belts.</span></div>
<audio class="cap-audio" src="audio/3690d0a7e3cf.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section>
      <section class="story-section" id="p7">
        <h2>第 7 页：陕西 5A 景区分布</h2>
        <figure>
          <img src="assets/shaanxi-qinling-three-landscapes/07.jpg" alt="14 处 5A 景区标注图" loading="lazy">
          <figcaption class="cap-bilingual">
<div class="cap-zh"><span class="time-badge">7/7</span>14 处 5A，关中最密：秦始皇帝陵、华清宫、黄帝陵、大雁塔—芙蓉园、华山、法门、金丝峡、太白山、城墙—碑林、延安革命纪念地、大明宫、壶口、乾坤湾、乾陵等。</div>
<div class="cap-en"><button class="cap-speak" data-audio="audio/53b7482aebdc.mp3" type="button" aria-label="Play English audio">🔊</button><span>Fourteen 5A sites, densest in Guanzhong, listed on the relief map.</span></div>
<audio class="cap-audio" src="audio/53b7482aebdc.mp3" preload="none"></audio>
</figcaption>
        </figure>
      </section></article>
  </main>
<script id="cap-en-script">
(function(){
  function stopOthers(except){
    document.querySelectorAll('.cap-audio').forEach(function(a){
      if(a!==except){a.pause();a.currentTime=0;}
    });
    document.querySelectorAll('.cap-speak.playing').forEach(function(b){
      if(!except||b.dataset.audio!==except.dataset.audio){b.classList.remove('playing');}
    });
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest('.cap-speak');
    if(!btn)return;
    var cap=btn.closest('.cap-bilingual');
    if(!cap)return;
    var au=cap.querySelector('.cap-audio');
    if(!au)return;
    if(au.paused){
      stopOthers(au);
      btn.classList.add('playing');
      au.play();
    }else{
      au.pause();au.currentTime=0;btn.classList.remove('playing');
    }
  });
  ['pause','ended'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(e.target.classList&&e.target.classList.contains('cap-audio')){
        var cap=e.target.closest('.cap-bilingual');
        if(cap){var b=cap.querySelector('.cap-speak');if(b)b.classList.remove('playing');}
      }
    },true);
  });
})();
</script>
</body>
</html>

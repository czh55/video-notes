      <div class="container root-wrap">
  <h1>中国人造院不宜照搬日式园林</h1>
  <div class="meta"><span class="tag tag-blue">造院</span><span class="tag tag-green">扬州园林</span><span class="tag tag-orange">方惠</span><span class="tag tag-purple">日式</span><span class="tag tag-red">意境</span><span class="tag tag-gray">时长 1分35秒</span><span class="tag tag-gray">理性分析 · 庭院营造</span></div>
  <a class="source-link" href="https://xhslink.cn/o/63hgAVxui5S">原视频</a>
  <div class="summary-line">核心判断：中国人造院的难点不是「像不像某个风格」，而是要素能否联系起来、空间能否给出闹静/俯仰对照；照搬日式符号解决不了这种体验问题。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：不宜照搬日式</span></div><div class="timeline-item"><span class="timeline-time">00:35</span><span class="timeline-text">字幕：主流审美/元素联系</span></div><div class="timeline-item"><span class="timeline-time">01:04</span><span class="timeline-text">扬州住院夜登顶楼</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">四面漆黑如悬空</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">路灯与角落人流对照</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>造院抄什么</div><span class="arrow">→</span><div class="node-green">证据<br/>联系+俯视体验</div><span class="arrow">→</span><div class="node-orange">判断<br/>体验优先于样式</div><span class="arrow">→</span><div class="node-blue">行动<br/>先写空间对照</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：日式＝高级，照搬即提升。纠偏：开场即否定不适配照搬。</p><p>误解：有石有竹就是中式。纠偏：嘉宾强调联系起来与身体记忆中的对照感。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：风格借口 vs 空间体验</h3>
      <p>专访用标题卡把「不宜照搬」钉死，再用顶楼故事给体验样本。</p>
      <div class="quote">他们在天堂里面看人间</div>
      <div class="relation">理解：院子要能产生对照。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：动手前三问</h3>
      <p>①要联系哪三个要素？②何处俯/何处藏？③闹与静如何同时在场？</p>
      <div class="quote">三个东西联系起来以后</div>
      <div class="relation">行动：先画关系，再买石灯。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：ASR术语不可用</h3>
      <p>「杀鸡」等词无法核验；不把它写成正式园林术语。</p>
      <div class="quote">日本…在中国人造园当中是不适和</div>
      <div class="relation">证据层级：标题+可辨叙事。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>访谈节选，非完整造园课。</li><li>地域流派差异大，扬州经验需本地化。</li></ul><div class="pitfall">购物式堆日式元件。</div><div class="pitfall">忽略居住动线只做拍照角。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>照搬样式≠得到意境。</li><li>联系比零件重要。</li><li>身体记忆是设计标尺。</li></ul><h3>行动清单</h3><ol><li>列出三要素联系草图。</li><li>在场地找一个「俯视对照」点。</li><li>少买符号，先定闹静结构。</li></ol><h3>关键认知转变</h3><p>从「我想要日式同款」转向「我要哪种人间/天上的对照」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分35秒</div>
</div>
    </div>
  </foreignObject>

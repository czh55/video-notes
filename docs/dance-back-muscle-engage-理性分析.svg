.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>一年学会背肌发力跳舞进步快</h1>
  <div class="meta"><span class="tag tag-blue">背肌</span><span class="tag tag-green">肩胛骨</span><span class="tag tag-orange">沉肩</span><span class="tag tag-purple">前锯肌</span><span class="tag tag-red">街舞</span><span class="tag tag-gray">时长 3分30秒</span><span class="tag tag-gray">理性分析 · 动作解剖</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6gDEgIiR6Ah">原视频</a>
  <div class="summary-line">核心判断：舞蹈口语里的「背肌发力」多半是肩胛下沉+内收的控制模型；向前出手则要换前锯肌，肩袖更多是稳定而非推送。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">公式一：肩胛周边三肌群</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">肩胛六向与沉肩</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">哈里摇对比找背感</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">拇指后移与靠墙W</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">公式二：肩袖稳定</span></div><div class="timeline-item"><span class="timeline-time">02:45</span><span class="timeline-text">公式三：前锯肌前伸</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>什么叫背肌发力</div><span class="arrow">→</span><div class="node-green">证据<br/>肩胛运动+肌群分工</div><span class="arrow">→</span><div class="node-orange">判断<br/>沉肩内收是底盘</div><span class="arrow">→</span><div class="node-blue">行动<br/>两招找感+分清出手肌</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：背肌负责所有上肢动作。纠偏：出手向前主要靠前锯肌。</p><p>误解：架不起手臂只因柔韧。纠偏：视频指向肩部力量不足。</p><p>ASR：提肩胛肌被识成「肩胛蹄肌」，按解剖名理解。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：三公式分工</h3>
      <p>肩胛周边肌管六向与沉肩；肩袖管深层稳定；前锯肌管肩胛前伸与释放。</p>
      <div class="quote">肩胛骨下沉下回旋，就是跳舞中常说的背肌发力模型的底层逻辑。</div>
      <div class="relation">先认方向再谈发力。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：两招找感</h3>
      <p>拇指后移练内收；靠墙W向上延伸练内收+下沉；哈里摇加「背往后靠」。</p>
      <div class="quote">找背往后靠的感觉之后就好很多。</div>
      <div class="relation">用对比录像看肩胛是否动。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：力量课不能替代</h3>
      <p>视频给感知入口与分工，不替代系统力量训练；成肩坠肘是稳定口令而非审美教条。</p>
      <div class="quote">上肢会更加稳定。</div>
      <div class="relation">观点：赵白白个人训练复盘。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">三公式对照</h2><div class="card"><table><thead><tr><th>公式</th><th>肌群</th><th>舞蹈里干什么</th></tr></thead><tbody><tr><td>一</td><td>提肩胛/菱形/下斜方</td><td>沉肩、撑开、背肌发力底盘</td></tr><tr><td>二</td><td>肩袖四肌</td><td>稳定肩关节，助架臂</td></tr><tr><td>三</td><td>前锯肌</td><td>肩胛前伸、出手释放</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>解剖名称以口播为准，个别ASR需校正。</li><li>不构成医疗或康复指导。</li></ul><div class="pitfall">用背肌硬推前伸动作。</div><div class="pitfall">沉肩做成夹背僵住。</div><div class="pitfall">只练元素不补上肢力量。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>背肌发力≈肩胛控制。</li><li>出手换前锯肌。</li><li>找感动作要可重复。</li></ul><h3>行动清单</h3><ol><li>每天2分钟拇指后移+靠墙W。</li><li>录像背面看肩胛六向。</li><li>出手动作单独问：是谁在发力。</li></ol><h3>关键认知转变</h3><p>从「听懂口令」转向「看见肩胛在动」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分30秒</div>
</div>
    </div>
  </foreignObject>
</svg>
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>阔面脸骨相修图全程</h1>
  <div class="meta"><span class="tag tag-blue">阔面</span><span class="tag tag-green">骨相</span><span class="tag tag-orange">脸宽</span><span class="tag tag-purple">发际线</span><span class="tag tag-red">斜方肌</span><span class="tag tag-gray">时长 3分58秒</span><span class="tag tag-gray">理性分析 · 修图结构</span></div>
  <a class="source-link" href="https://xhslink.cn/o/Tk5MTFaUpu">原视频</a>
  <div class="summary-line">核心判断：阔面修图赢在比例与结构，不在磨皮流畅度；收宽→五官微调→保留骨骼拐角手推→发量抬颅顶+斜方肌轻推，并明确拒绝假直角肩。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">脸宽工具收左边偏宽</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">鼻唇嘴宽微调</span></div><div class="timeline-item"><span class="timeline-time">01:16</span><span class="timeline-text">发际线略降</span></div><div class="timeline-item"><span class="timeline-time">01:32</span><span class="timeline-text">手推保留拐角</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">发量与颅顶</span></div><div class="timeline-item"><span class="timeline-time">02:12</span><span class="timeline-text">拒直角肩，只推斜方肌</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>阔面怎么修才像骨相</div><span class="arrow">→</span><div class="node-green">证据<br/>比例链+拐角+体态</div><span class="arrow">→</span><div class="node-orange">判断<br/>流畅过度=假</div><span class="arrow">→</span><div class="node-blue">行动<br/>先收宽再轻推</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：脸型推越流畅越好。纠偏：保留骨骼拐角才自然。</p><p>误解：肩膀要推成直角肩才高级。纠偏：作者称很假，只下推斜方肌。</p><p>ASR：前1分钟与后段空白，开篇依画面字幕。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：比例优先的阔面方案</h3>
      <p>先脸宽与五官比例，再发际线，最后发量与斜方肌——顺序服务于「显长、显小、显轻薄」。</p>
      <div class="quote">这个就是调整比例的一个重要性</div>
      <div class="relation">修图清单按比例链执行。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：手推两戒律</h3>
      <p>①微收额头脸型，停在拐角可见；②斜方肌适度下推，不做直角肩。</p>
      <div class="quote">推成这种直角肩其实这种的话就很假</div>
      <div class="relation">对照前后肩线是否仍像真人。</div>
    </div>
    <div class="card card-orange">
      <h3>边界：口播空洞段</h3>
      <p>00:00–01:00、02:24–03:54 等多段依赖画面；后段质感收尾细节以片尾总结为准。</p>
      <div class="quote">有质感清透的一个含细的修头风格</div>
      <div class="relation">证据层：工具栏+字幕可核验。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>案例为单个阔面素颜，非所有脸型模板。</li><li>软件界面以视频当时版本为准。</li></ul><div class="pitfall">一上来磨皮磨掉结构。</div><div class="pitfall">脸型推成无拐角面具。</div><div class="pitfall">肩膀硬造直角。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>比例先于装饰。</li><li>拐角=真实骨相信号。</li><li>体态轻薄≠假肩线。</li></ul><h3>行动清单</h3><ol><li>先只动脸宽与发际线各一档对照。</li><li>手推后放大看下颌拐角是否还在。</li><li>肩膀只处理斜方肌鼓起处。</li></ol><h3>关键认知转变</h3><p>从「推流畅」转向「保结构」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分58秒</div>
</div>
    </div>
  </foreignObject>
</svg>
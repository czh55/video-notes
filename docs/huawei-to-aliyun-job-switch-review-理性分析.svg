  <div class="card"><h3>行动清单</h3><div class="action">分享一个真实的求职陪跑案例，华为跳槽阿里云。
	
先说我带的这个案例。
	
BG：学员之前在华为，做偏硬件和交付的技术活，底子很扎实，扛过不少复杂交付。
这种人在体系里是被认真打磨过的：流程、闭环、对齐、扛指标，样样在行。
他想往 AI 云方向走，目标锁定阿里云的BTE解决方案工程师。
	
这个学员背景没有什么特别特殊的地方，今天想聊的特殊之处是2家公司的差异化。
	
华为待久了，会养成一套很深的表达惯性。
简历写出来，像一份述职报告，我负责了什么模块、对齐了哪些流程、完成了多少闭环；
面试一开口，像一场晋升汇报，我跨过多大规模、扛了多少指标、怎么把一个事从零推到落地。
这套东西放华为是加分，放阿里云上，或许成了减分项。
	
还有价值观的碰撞。
华为讲流程、纪律、艰苦奋斗，在体系里把事做成；
阿里云更多讲客户第一、拥抱变化，面向市场去创造价值。
这套差异会从一个人的谈吐、叙事、取舍里漏出来，面试官未必说得出哪里不对，但就是觉得这个人味儿不对、接不上茬。
	
整个陪跑的流程，和其他跳槽的同学不一样，他专业上没有太多的短板，但是能不能拿offer，还缺的系统性的认知转化。
【为什么这么说，</div>

<div class="container">
  <h1>画暗部时，色相要不要跟着动</h1>
  <div class="meta">
    <span class="tag tag-blue">调色后期</span>
    <span class="tag tag-orange">绘画取色</span>
    <span class="tag tag-green">画面证据</span>
    <span class="tag tag-gray">8.5 秒 · 口播极少</span>
  </div>
  <div class="summary-line">这条片子没有讲解词。它用红叉和绿勾问一件事：画球体暗部时，只在取色方框里竖直拉暗，和同时让色相离开底色，两颗球看起来差在哪里。</div>

  <div class="timeline">
    <h3>关键画面</h3>
    <div class="timeline-item"><div class="timeline-time">00:00–00:02</div><div class="timeline-text">橙黄。左球暗部约 (94,64,26) 发褐；右球暗部约 (116,2,90) 发紫。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:02–00:05</div><div class="timeline-text">粉红。左球暗部约 (84,29,50) 暗红；右球暗部约 (88,0,164) 蓝紫。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:05–00:08</div><div class="timeline-text">黄绿直到片尾。左球暗部约 (73,106,17) 橄榄；右球暗部约 (32,181,37) 更青。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">暗部怎么取色</div>
      <div class="arrow">→</div>
      <div class="node node-orange">红叉：色相不动，明度竖直向下</div>
      <div class="arrow">→</div>
      <div class="node">暗部发褐、发闷、发橄榄</div>
    </div>
    <div class="diagram">
      <div class="node">同一颗球</div>
      <div class="arrow">→</div>
      <div class="node node-green">绿勾：方框弯道，色环也动</div>
      <div class="arrow">→</div>
      <div class="node node-green">暗部偏紫或偏青</div>
    </div>
  </div>

  <div class="correction">
    <h3>先分开两件事</h3>
    <p>红叉和绿勾是画面自己的标记，表示作者把哪一列当成要避开的取法。它不是测量结论，也不是「所有暗部都必须偏紫」。三颗球只演示了白底、左上受光这一种光。口播那句点赞套话与标题 DRAWING COLORS 对不上，不能拿来当依据。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">左右两列在操作上差了哪一步</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>两列的取色器结构一样：外圈选色相，内框选饱和与明度。左列的白箭头在内框里竖直向下，外圈的选点不动。右列的内框路径是弯的，外圈另有一条弯箭头。</p>
      <div class="highlight">关键理解：右列多出来的不是「更暗」，而是色相离开了底色。暗部像素在三组里分别走到紫、蓝紫和更青。</div>
      <div class="action">怎么用：在取色器里先定底色，再单独存一个暗部色。如果暗部只是底色滑到更低明度，它就落在左列；若暗部色相已经偏开，再看它是否仍保持饱和，而不是发灰。</div>
      <div class="quote">原文依据：无口播。依据是 00:01、00:03、00:07 三帧的取色器箭头和球体暗部取样。</div>
    </div>
    <div class="card card-purple">
      <h3>作者立场，画面标出来了，但没有论证</h3>
      <p>绿勾始终放在「色相也动」的一列。作者没有说明光源是暖是冷，也没有比较互补色、邻近色哪一种更合适。紫和青都出现了，方向并不固定成同一种色温。</p>
    </div>
    <div class="card card-orange">
      <h3>避坑</h3>
      <div class="pitfall">不要把右列读成「暗部一律加紫」。黄绿这一段右球暗部是更青的绿，蓝分量上升，并不是紫。</div>
      <div class="pitfall">不要把这条绘画取色演示当成达芬奇节点教程。画面里没有示波器、没有色轮节点、没有素材片段。</div>
    </div>
  </div>

  <div class="card">
    <h3>三组底色，同一对照</h3>
    <table>
      <tr><th>时段</th><th>底色</th><th>红叉暗部</th><th>绿勾暗部</th></tr>
      <tr><td>00:00–00:02</td><td>橙黄</td><td>褐，约 (94,64,26)</td><td>紫，约 (116,2,90)</td></tr>
      <tr><td>00:02–00:05</td><td>粉红</td><td>暗红，约 (84,29,50)</td><td>蓝紫，约 (88,0,164)</td></tr>
      <tr><td>00:05–00:08</td><td>黄绿</td><td>橄榄，约 (73,106,17)</td><td>更青，约 (32,181,37)</td></tr>
    </table>
    <p>取样点在球体中轴偏下的最暗像素附近，是画面事实。色环弯箭头的顺逆时针无法在每一帧确认，表中不写转向。</p>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <p>在这 8.5 秒里，竖直拉暗的球体暗部留在底色的脏暗版本里；方框走弯道且色相离开底色的球体，暗部会偏到紫或青。换底色没有换这个结构。</p>
    <h3>行动清单</h3>
    <ul>
      <li>画完暗部后，把暗部色和底色放在一起，看色相有没有离开。</li>
      <li>若暗部只是更黑的同一色，先对照本片左列，再决定要不要改。</li>
      <li>橙、粉可以试着把暗部往紫蓝偏一档；黄绿先看是否变青，不要一律加紫。</li>
      <li>改完只看球体最暗的一圈是否发灰，不先加纹理。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>以前把「变暗」理解成明度滑块向下。这条画面把变暗拆成明度路径和色相是否离开两件事，而且只在三颗演示球上成立。</p>
  </div>
  <p class="footer">证据仅来自 b63u 本地画面与 1 段无法采用的转录。笔记标题为「色彩理论教程」，本文标题加上序号以便和同名的另一条区分。</p>
</div>

    </div>
  </foreignObject>
</svg>
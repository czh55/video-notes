  <div class="card"><h3>行动清单</h3><div class="action">[种草R]大家好！我是东哥😭！之前居然把超好用的“模糊”工具讲漏了！收到小伙伴提醒才发现，今天必须补上这份保姆级教程！
	
💡功能作用
这个镜头模糊功能简直是手机摄影的“外挂”！能一键虚化背景，完美模拟大光圈镜头的浅景深效果✨。
	
📱操作方法
[气球R]打开工具
打开手机LR，导入照片后点击“编辑”，找到“模糊”按钮，点进去就开启了虚化魔法世界！
	
[气球R]调整模糊量
拖动“模糊量”滑块就能控制背景虚化程度！数值拉得越高，背景越糊～给家人们看对比图（图2、图3），从0到100的变化超直观！
	
[气球R]选择模糊形状
拍夜景、逆光人像时必用！这里有圆形、气泡、五片式等超多种光斑形状可以选！如图4背景中的光斑！
	
[火R]划重点！“焦点”的使用
	
[种草R]点击模糊形状右边的“焦点”，会出现两个超关键设置（图5）：
“人像”图标：自动识别画面主体当焦点，懒人必备！
“圆圈”图标：手动自定义焦点！比如把焦点定在背景上，前面的花瞬间变模糊了（看图6）。
	
[气球R]焦点范围，
焦点范围用一个长条形表示，左边代表“近景”，右边代表“远景”，数值从0到100。条形上的“电池”状滑块是</div>

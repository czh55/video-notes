<h1>三种淀粉：锁水 / 勾芡 / 炸壳</h1>
<div class="meta">淀粉 · 勾芡 · 炸制 · 家常菜 · 图文 · 图文 1 页</div>
<a href="https://xhslink.cn/o/81t5K5rFbmk">原笔记</a>
<div class="summary">核心判断：同叫淀粉，功能按颗粒与糊化行为分岔——腌制保嫩、芡汁透亮、高温脆壳各用其材。</div>
<div class="card"><h3>玉米淀粉</h3><ul><li>腌肉抓拌锁水</li><li>翻炒仍嫩滑</li></ul></div>
<div class="card"><h3>土豆淀粉</h3><ul><li>生粉勾芡</li><li>汁清亮有卖相</li></ul></div>
<div class="card"><h3>红薯淀粉</h3><ul><li>颗粒粗耐高温</li><li>酥肉炸虾掉渣脆</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>腌肉抓玉米淀粉</li><li>溜菜勾芡用土豆淀粉</li><li>炸壳换红薯淀粉</li></ul></div>

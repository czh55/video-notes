<div class="container">
  <h1>按下快门的 0.01 秒，相机内部居然这么疯狂</h1>
  <div class="meta">
    <span class="tag tag-blue">摄影器材</span>
    <span class="tag tag-green">快门原理</span>
    <span class="tag tag-orange">闪光同步</span>
    <span class="tag tag-purple">小红书 · 18分48秒</span>
  </div>
  <div class="summary-line">核心判断：高速曝光不是「整幅同时眨眼」，而是焦平面缝隙、叶快门整幅受光、或电子逐行读出在抢同一传感器上的时间；闪光能不能上、会不会卷帘，取决于传感器是否曾整幅同时露光，以及读出发生在亮处还是暗处。</div>
  <a class="source-link" href="https://xhslink.cn/o/2CZ9TyM1bBD">原视频（小红书短链）</a>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">复盘 DSLR 焦平面：镜起 → 前帘开 → 后帘关；高速靠移动缝隙</span></div>
    <div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">80,000 fps：前帘略快于后帘，缝隙下行变宽</span></div>
    <div class="timeline-item"><span class="timeline-time">02:45</span><span class="timeline-text">电子镜头光圈常在按下快门瞬间才收刃，拍完再全开</span></div>
    <div class="timeline-item"><span class="timeline-time">04:15</span><span class="timeline-text">无反 EFCS：电子起帘 + 机械后帘；未用前帘再复位遮光</span></div>
    <div class="timeline-item"><span class="timeline-time">05:12</span><span class="timeline-text">缝隙故意变宽以补偿帘幕加速，避免一头欠曝</span></div>
    <div class="timeline-item"><span class="timeline-time">06:20</span><span class="timeline-text">超同步速度闪光切黑条；HSS 用脉冲铺满但更暗</span></div>
    <div class="timeline-item"><span class="timeline-time">08:20</span><span class="timeline-text">叶快门整幅同时受光 → 高快门仍可满功率单次闪光</span></div>
    <div class="timeline-item"><span class="timeline-time">13:20</span><span class="timeline-text">电子慢读出逐行错开 → 卷帘；全局快门整幅同时</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">要可控曝光</div>
      <div class="arrow">→</div>
      <div class="node node-orange">帘缝 / 叶快门 / 电子行</div>
      <div class="arrow">→</div>
      <div class="node">整幅是否曾全露</div>
      <div class="arrow">→</div>
      <div class="node node-green">闪光·卷帘·模式选择</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>「快门速度 = 整幅传感器同时开合」——焦平面高速时从未整幅全露，只是缝隙扫过；「电子快门没有运动问题」——慢读出仍有卷帘；「开了 HSS 就能随便 EFCS + 闪光」——易出条带。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">三种「挡住—放行」机制</h2>
    <div class="card">
      <h3>焦平面帘幕</h3>
      <p>两片帘在传感器前形成移动缝隙。高速 = 更窄的缝 + 第二帘提前启动。缝宽可随行程变化以补偿加速。</p>
      <div class="insight">适用：多数单反/无反机械或混合快门；代价是闪光同步上限。</div>
    </div>
    <div class="card card-purple">
      <h3>叶快门（镜间）</h3>
      <p>叶片在镜头光路中开合，因离传感器远，小孔阶段仍可照亮整幅——故允许「极高快门 + 满功率短闪光」。</p>
      <div class="highlight">历史瓶颈是减速停反向；现代中画幅叶快门已大幅追上焦平面速度。</div>
    </div>
    <div class="card card-orange">
      <h3>电子快门 / 读出</h3>
      <p>逐行复位—曝光—读出错开，换来「每行曝光时长一致」，也换来时间轴上的斜切 = 卷帘。机械后帘可把读出藏进黑暗。</p>
      <div class="pitfall">闪光 + 部分电子方式、EFCS + HSS、频闪 LED，都是条带/黑条高发区。</div>
    </div>
  </div>

  <div class="card card-green">
    <h3>横向比较：你到底在选什么</h3>
    <table>
      <tr><th>模式</th><th>整幅同时受光？</th><th>闪光友好度</th><th>主要风险</th></tr>
      <tr><td>机械焦平面（低速）</td><td>有全露瞬间</td><td>高（≤同步速度）</td><td>振动、时滞、磨损</td></tr>
      <tr><td>机械焦平面（高速缝隙）</td><td>否</td><td>需 HSS 脉冲</td><td>黑条；HSS 更暗</td></tr>
      <tr><td>EFCS</td><td>电子起、机械收</td><td>慎用 HSS</td><td>条带、部分焦外双线</td></tr>
      <tr><td>叶快门</td><td>是（几何上）</td><td>高快门满功率闪光</td><td>镜头贵；转接无快门</td></tr>
      <tr><td>电子慢读出</td><td>时间轴错开</td><td>常差</td><td>卷帘畸变</td></tr>
      <tr><td>全局快门</td><td>是</td><td>视实现</td><td>机身贵 / 动态范围权衡</td></tr>
    </table>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>高速焦平面 = 缝隙扫描，不是整幅眨眼。</li>
      <li>闪光同步本质是「传感器是否曾整幅同时露光」。</li>
      <li>叶快门用几何距离换整幅受光；电子快门用时间错开换读出。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>棚拍外闪：先确认同步速度；要更高快门再评估 HSS 或叶快门系统。</li>
      <li>EFCS 开着时慎用 HSS 与频闪灯。</li>
      <li>拍高速横向运动：优先机械/全局，或缩短电子读出时间。</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：快门速度只是曝光三角一个旋钮 → 现在：它还决定闪光几何与运动畸变。</li>
      <li>以前：电子快门 = 全静音无副作用 → 现在：先问读出是否错开、闪光是否兼容。</li>
    </ul>
  </div>
  <div class="footer">理性分析 · 基于完整转录重组 · 非原视频替代</div>
</div>

    </div>
  </foreignObject>
</svg>
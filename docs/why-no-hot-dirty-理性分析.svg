      <h1>热 Dirty 丢掉的是温差</h1>
<table>
<tr><th>页</th><th>在说什么</th></tr>
<tr><td>1/4</td><td>只打叉，不给理由</td></tr>
<tr><td>2/4</td><td>冷奶 + 热浓缩 = 分层</td></tr>
<tr><td>3/4</td><td>热奶版本：麻烦、秒变热拿铁、酸涩</td></tr>
<tr><td>4/4</td><td>麻烦、不出色、没灵魂；不是做不到</td></tr>
</table>
<p>易错：把「不卖」理解成工艺上做不出来。边界：没有温度和配方。动作：想要 Dirty 就保留冷热，不要把奶也加热。</p>
    </div>
  </foreignObject>

      <div class="container root">
<h1>少量多次：漂洗里的稀释连乘</h1>
<a href="https://xhslink.cn/o/1BWX4UU7ERi">原视频</a>
<div class="summary">核心判断：同样体积清水，「分次倒掉混匀脏水」比「一次灌满」能把残留浓度连乘压下去；省水是同一数学的镜像。边界是吸附、混匀时间，以及不该套用到含氟牙膏漱口。</div>
<div class="card"><h3>抓手</h3><ul>
<li>模型：留 1 份脏水 + 30 份清水 → 一次 1/31，三次约 1/1331</li>
<li>迁移：洗衣机漂甩、奶瓶、毛笔</li>
<li>极限：到不了 0，与 e 相关</li>
</ul></div>
<div class="conclusion"><h2>行动</h2><ul>
<li>洗衣：宁多漂一轮+甩干，也不要迷信一次猛冲</li>
<li>洗碗刷瓶：少量水晃倒×3</li>
<li>牙膏：只吐不漱（若遵医嘱）</li>
</ul></div>
<div class="footer">video-notes · rinse-three-times-43x-cleaner</div></div>

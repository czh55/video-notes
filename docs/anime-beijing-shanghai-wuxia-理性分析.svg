      <div class="container root">
<h1>八派民居：给动漫/武侠的视觉语法</h1>
<div class="meta">建筑 · 民居 · 动漫 · 武侠美学 · 图文 · 图文 9 页</div>
<a href="https://xhslink.cn/o/4Y3wthCZtGz">原笔记</a>
<div class="summary">核心判断：八派不是景点清单，而是可被视觉系统复用的空间语法——轴线礼序、借景叠境、高墙防御、粉墙节奏、海洋红砖、岭南镬耳、檐廊烟火、雪域碉楼。</div>
<div class="card"><h3>北方礼序与晋商堡垒</h3><ul><li>京派：中轴+影壁+垂花门</li><li>晋派：高墙深院+砖雕门楼</li></ul></div>
<div class="card"><h3>江南与徽州笔墨感</h3><ul><li>苏派：漏窗曲桥太湖石</li><li>徽派：马头墙+天井</li></ul></div>
<div class="card"><h3>沿海与高原气候答卷</h3><ul><li>闽粤：红砖燕尾 / 镬耳通透</li><li>川藏：茶居烟火 / 碉楼防御</li></ul></div>
<div class="conclusion"><h2>行动</h2><ul><li>做设定先选「派」再选构件</li><li>武侠场景用气候逻辑解释造型</li><li>勿把八派缩成单一「古风滤镜」</li></ul></div>
<div class="footer">video-notes · anime-beijing-shanghai-wuxia</div>
</div>

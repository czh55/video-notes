<div class="container">
  <h1>瑰夏咖啡，为什么能卖这么贵？</h1>
  <div class="meta">
    <span class="tag tag-blue">瑰夏</span><span class="tag tag-blue">Gesha</span><span class="tag tag-blue">微批次</span><span class="tag tag-blue">拍卖</span><span class="tag tag-blue">选豆</span>
    <span class="tag tag-gray">3分17秒</span>
    <span class="tag tag-purple">理性分析 · 咖啡手作 · 价格与批次</span>
  </div>
  <a class="source-link" href="https://xhslink.cn/o/3KvyJWICIkc" target="_blank" rel="noopener">原视频（小红书短链）</a>
  <div class="summary-line">核心命题：同名「瑰夏」为什么价格可以差一个数量级？作者判断——品种潜力只是入场门票；真正拉开差距的是地块/处理/微批次筛选带来的稀缺，以及拍卖竞价形成的极端成交价。拍卖价是市场结果，不能倒推普通生产成本；买豆应问清批次信息，并先匹配口味。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    
      <div class="timeline-item">
        <div class="timeline-time">00:00</div>
        <div class="timeline-text">提问：瑰夏为什么这么贵？抛出冠军批次拍卖锚点</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:15</div>
        <div class="timeline-text">普通批次 vs 冠军小批次；产量低只说对一部分</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:25</div>
        <div class="timeline-text">三层：品种潜力 / 具体批次 / 市场竞价</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:30</div>
        <div class="timeline-text">WCR：高海拔品质潜力极高、产量潜力低</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">00:54</div>
        <div class="timeline-text">同名不一定同源；T2722 也需条件</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:17</div>
        <div class="timeline-text">2004 翡翠庄园分区独立批次；杯测与纪录叙事</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">01:40</div>
        <div class="timeline-text">筛选越细量越少；售价≠成本；拍卖价不能倒推成本</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-time">02:30</div>
        <div class="timeline-text">别贴智商税标签；问清批次；口味先于品种名</div>
      </div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">问题</div>
          为何同名不同价
        </div>
        <div class="arrow">→</div>
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">门票</div>
          品种潜力
        </div>
        <div class="arrow">→</div>
      
        <div class="node ">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">筛选</div>
          微批次稀缺
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-orange">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">市场</div>
          拍卖竞价
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-purple">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">边界</div>
          价≠普通成本
        </div>
        <div class="arrow">→</div>
      
        <div class="node node-green">
          <div style="font-size:12px;opacity:.75;margin-bottom:4px">行动</div>
          问批次+口味
        </div>
        
      
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解：瑰夏贵=树难种、产量低。纠偏：这只说对一部分；还要看具体批次信息与市场竞价。</p><p>误解：看见「瑰夏」就等于顶级。纠偏：多个遗传背景曾共用此名；名字本身不等于顶级。</p><p>误解：随便种瑰夏都能卖高价。纠偏：海拔、成熟采摘、管理与地块/处理批次都会改变结果。</p><p>误解：极端拍卖价≈普通生产成本。纠偏：拍卖价是成交结果，不能倒推普通成本；售价高也不等于成本就这么高。</p><p>误解：贵=智商税 / 便宜=不值。纠偏：先问批次是否清楚、风味是否匹配自己，再谈值不值。</p><p>立场分层：拍卖数字、20kg/总成交等为视频画面信息（未独立核验）；三层价格结构与买豆清单为作者观点；「同名不同源」引用 WCR 提醒属作者转述。</p>
  </div>

  <h2 class="sec-title">观点卡片</h2>
  
    <div class="card card">
      <h3>在讲什么：价格是三层叠加，不是一个品种标签</h3>
      <p>关键理解：品种潜力、微批次稀缺、拍卖竞价分别回答「能不能进入高端」「为什么量少」「谁在抬价」。用法：看到天价时先拆层，不要用「瑰夏」一词解释全部溢价。</p>
      <div class="quote">「品种潜力、具体批次，还有市场竞价」</div>
      <div class="relation">潜力给门票 → 筛选压数量 → 竞价推高顶尖一小部分。</div>
    </div>
  
    <div class="card card-purple">
      <h3>在讲什么：同名不一定同源</h3>
      <p>关键理解：Geisha/Gesha 曾被用于多个遗传背景；巴拿马出名的 T2722 后代仍需合适条件。用法：把「品种名」降级为线索，把地块、处理、批次升为主信息。</p>
      <div class="quote">「瑰夏这个名字本身不等于顶级瑰夏」</div>
      <div class="relation">名字 ≠ 遗传背景 ≠ 杯中表现；同庄园不同批次也可完全不同。</div>
    </div>
  
    <div class="card card-orange">
      <h3>在讲什么：拍卖价是结果，不是成本说明书</h3>
      <p>关键理解：极端成交价发生在极少量冠军批次与全球买家争夺的场景，不是普通批发市场。用法：不要用拍卖纪录去衡量咖啡馆一杯「瑰夏」的合理进货成本。</p>
      <div class="quote">「拍卖价是成交结果，不能倒推普通成本」</div>
      <div class="relation">售价高 ≠ 生产成本同等高；稀缺与竞价解释溢价尖端。</div>
    </div>
  
    <div class="card card-green">
      <h3>在讲什么：值不值先看批次与口味</h3>
      <p>关键理解：决策问题从「它贵不贵」换成「这是哪一批、合不合我口」。用法：问清国家/庄园/地块/处理/批次；深烘坚果巧克力偏好者未必适合花香茶感浅烘。</p>
      <div class="quote">「真正贵的不是瑰夏这两个字，而是……具体批次」</div>
      <div class="relation">信息清楚 + 数量很少 + 潜力被做出来 → 才谈得上「这杯为什么贵」。</div>
    </div>
  

  <div class="card">
    <h3>横向对照：批次层级与价格含义</h3>
    <table>
      <thead><tr><th>层级</th><th>大致含义</th><th>价格含义（作者视角）</th></tr></thead>
      <tbody>
        <tr><td>普通商用批次</td><td>同名品种、规模化供应</td><td>可贵，但通常不是拍卖尖端</td></tr><tr><td>高海拔微批次</td><td>地块/处理更细，数量更少</td><td>溢价常来自筛选与信息密度</td></tr><tr><td>获奖 / 年度冠军</td><td>竞赛与杯测背书的极小量</td><td>可能进入竞价与纪录叙事</td></tr><tr><td>拍卖成交价</td><td>全球买家争夺的市场结果</td><td>不能倒推普通生产成本</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>避坑总结</h3>
    <ul><li>只凭品种名下单，把「瑰夏」当成品质保证书。</li><li>用冠军拍卖价论证咖啡馆一杯必定值或不值。</li><li>把产量低当成唯一解释，忽略批次筛选与竞价。</li><li>口味不匹配仍硬喝「名品种」，再反向骂智商税。</li><li>把未核验的画面数字当权威行情长期引用而不标注来源。</li></ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <p>同名瑰夏可以完全不是一个价格带。品种潜力只负责开门；微批次筛选制造稀缺；拍卖竞价制造尖端成交。真正要买的是信息清楚的具体批次，以及适合自己的风味，而不是两个汉字。</p>
    <h3>行动清单</h3>
    <ol><li>看到「瑰夏」先问：国家、庄园、地块、处理法、批次号/名称是否清楚。</li><li>把极端拍卖新闻当市场故事，不当日常进货成本参照。</li><li>对照口味：花香茶感浅烘 vs 坚果巧克力厚重深烘，先选风格再选品种名。</li><li>比较两杯「瑰夏」时，优先比批次信息与烘焙表达，而不是比标签字数。</li><li>同样预算做选择题：为辨识度花香买单，还是为稳定厚重与性价比买单。</li></ol>
    <h3>关键认知转变</h3>
    <ul><li>以前：瑰夏=贵=好 → 现在：瑰夏=线索，批次与口味=决策</li><li>以前：贵因产量低 → 现在：潜力+筛选稀缺+竞价三层</li><li>以前：拍卖价≈成本 → 现在：拍卖价是成交结果，不能倒推</li></ul>
  </div>

  <div class="footer">双轨产物 · 理性分析 SVG · 与图文实录共享同一转录与画面证据 · 画面拍卖数字未独立核验</div>
</div>

    </div>
  </foreignObject>
</svg>
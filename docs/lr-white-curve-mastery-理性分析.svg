  <div class="card"><h3>封面/要点：[种草R]家人们，今天来给大家分享L</h3><p>[种草R]家人们，今天来给大家分享Lightroom里超实用的白色曲线工具，学会</p></div><div class="card"><h3>第5/10页：从新手到高手｜掌控LR白色曲线的神</h3><p>[种草R]家人们，今天来给大家分享Lightroom里超实用的白色曲线工具，学会</p></div><div class="card"><h3>第9/10页：从新手到高手｜掌控LR白色曲线的神</h3><p>[种草R]家人们，今天来给大家分享Lightroom里超实用的白色曲线工具，学会</p></div>
  <div class="card"><h3>行动清单</h3><div class="action">[种草R]家人们，今天来给大家分享Lightroom里超实用的白色曲线工具，学会了它，修图水平直接起飞！
	
🎨曲线工具在哪？
	
[种草R]打开Lightroom，点击“编辑”，再点击“亮度”，在右上角就可以看到“曲线”啦（图2）。里面有四根曲线，白色曲线调亮度，红、绿、蓝三根颜色曲线用来调色（图3），可别搞混啦。今天只给各位分享白色曲线的用法哦，后边再给大家揭秘颜色曲线的用法。
	
📈白色曲线构成
	
[种草R]白色曲线由白色线、横坐标和纵坐标组成。横坐标从左到右依次是黑色、阴影、中间调、高光、白色。纵坐标从下往上，依次是黑色、阴影、中间调、高光、白色。白色曲线没调整时是45度直线，这时的亮度为调整前状态，同时这条线从左下往右上分别控制画面由暗到亮的区域。（图4）
	
🌟白色曲线用法
	
[种草R]点击白色曲线可以形成铆点（双击铆点，铆点就会消失	），拖动铆点便可以调整画面的明暗，铆点往白色曲线上方调就变亮，越往上越亮，反之往下方调则变暗，越往下越暗。（图5）
	
[种草R]提升特定区域亮度：比如想提升黑色区域亮度，先找到横坐标最左端黑色区域位置。左下角本来就有锚点，直接把它往上提</div>

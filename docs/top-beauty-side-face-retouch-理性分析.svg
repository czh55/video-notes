      <div class="container root-wrap">
  <h1>顶美侧脸骨相P图全过程</h1>
  <div class="meta"><span class="tag tag-blue">骨相修图</span><span class="tag tag-green">侧脸</span><span class="tag tag-orange">鼻翼</span><span class="tag tag-purple">鼻唇角</span><span class="tag tag-red">下颌线</span><span class="tag tag-gray">时长 3分14秒</span><span class="tag tag-gray">理性分析 · 侧脸骨相</span></div>
  <a class="source-link" href="https://xhslink.cn/o/61q39hfwcX1">原视频</a>
  <div class="summary-line">核心判断：侧脸「顶美」来自鼻翼—鼻孔—鼻唇角—下巴—下颌线的连续结构，而不是把鼻子单独拉高；每一步都在服务同一条侧影轮廓。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">鼻翼上抬改善凹陷</span></div><div class="timeline-item"><span class="timeline-time">00:38</span><span class="timeline-text">鼻不必一味修高</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">鼻孔上推成细长形</span></div><div class="timeline-item"><span class="timeline-time">00:52</span><span class="timeline-text">鼻唇角锐角+C弧</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">补下巴量感并上提下颌</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>侧脸哪里不高级</div><span class="arrow">→</span><div class="node-green">证据<br/>鼻旁凹陷+下庭量不够</div><span class="arrow">→</span><div class="node-orange">判断<br/>连线优先于单点拉高</div><span class="arrow">→</span><div class="node-blue">行动<br/>鼻→唇角→下巴→下颌</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：鼻子越高越好看。纠偏：作者明确可留一点「小头风」。</p><p>误解：只修下巴尖。纠偏：下颌角到下巴要成流畅弧，必要时再锐化。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：侧影一条线</h3>
      <p>鼻翼上抬、鼻孔细长、鼻唇角锐角，都是在修鼻子到上唇的过渡，而不是堆高鼻梁。</p>
      <div class="quote">鼻子不是说你修的越高越好看。</div>
      <div class="relation">先画侧影轮廓再动液化。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：下巴服务下颌线</h3>
      <p>量感不够就侧向拉出，再上提下巴让下颌更轻薄；流畅弧优先于生硬直角。</p>
      <div class="quote">下颌角和整个下巴这一块线条它是一个流畅的弧线。</div>
      <div class="relation">下庭量感与线条一次做完。</div>
    </div>
    <div class="card card-orange">
      <h3>证据边界：后半口播稀</h3>
      <p>Whisper 约1分30秒后变稀；锋利下颌等收尾以画面操作为准。</p>
      <div class="quote">如果想要下颌线更加的锋利</div>
      <div class="relation">实录不臆造未听清的参数。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>演示为手机液化流程，非医美方案。</li><li>「小头风」为作者审美口癖，非通用标准。</li></ul><div class="pitfall">只拉高鼻梁忽略鼻翼凹陷。</div><div class="pitfall">下巴拉太尖切断下颌弧。</div><div class="pitfall">鼻孔形状不跟整鼻匹配。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>侧脸美=连续骨相线。</li><li>鼻高有上限，匹配更重要。</li><li>下庭要量感也要轻薄感。</li></ul><h3>行动清单</h3><ol><li>先截侧脸轮廓再动笔。</li><li>鼻翼与鼻孔同一轮处理。</li><li>下巴与下颌角一起验收流畅弧。</li></ol><h3>关键认知转变</h3><p>从「把鼻子修高」转向「把侧影连顺」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分14秒</div>
</div>
    </div>
  </foreignObject>
</svg>
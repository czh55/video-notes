<div class="container">
  <h1>达芬奇 21.1 的 MCP 能代劳到哪一步</h1>
  <div class="meta">
    <span class="tag tag-blue">调色</span>
    <span class="tag tag-purple">达芬奇 21.1</span>
    <span class="tag tag-green">MCP / Codex</span>
    <span class="tag tag-orange">作者 Vivi Lyn</span>
    <span class="tag tag-gray">4 分 58 秒 · 画面字幕补口播空洞</span>
  </div>
  <div class="summary-line">这条视频要回答的是：达芬奇 21.1 用 MCP 把 Codex 接进调色页之后，粗提示能不能完成一级和参考匹配。能核对的部分是「会在现成节点上动，也会留下天空、肤色、草地这些没对齐的地方」；「离职业交付还有距离」是片尾字幕里的作者判断。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">字幕把 MCP 定义成让 AI 连接外部软件并执行操作的协议。证据层级：画面字幕。</span></div>
    <div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">卡片列出分析项目、整理素材、调整设置、批量渲染。调色还不在这四行里。</span></div>
    <div class="timeline-item"><span class="timeline-time">00:47</span><span class="timeline-text">确认框写 MCP 已加到 Claude Desktop 和 Codex in ChatGPT，需要重启。</span></div>
    <div class="timeline-item"><span class="timeline-time">01:12</span><span class="timeline-text">Codex 回报连上 21.1.0.17，3840×2160、25fps、55.96 秒，并声明未改内容。</span></div>
    <div class="timeline-item"><span class="timeline-time">01:46</span><span class="timeline-text">草地镜头字幕称调色前与调色后。这一帧看不清分屏边界，只记字幕声明。</span></div>
    <div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">红灯镜头字幕：没有强行做色温中和。和「后面两镜一级不好」是作者的两句不同评价。</span></div>
    <div class="timeline-item"><span class="timeline-time">02:15</span><span class="timeline-text">指令：已做 Rec.709 还原的片段，按右边已调色版本，在现有节点上做色彩匹配。</span></div>
    <div class="timeline-item"><span class="timeline-time">03:00</span><span class="timeline-text">口播恢复：粗提示下的匹配仍出乎意料。此前过程靠字幕。</span></div>
    <div class="timeline-item"><span class="timeline-time">03:21</span><span class="timeline-text">作者说同一画面分三次；Plus 用户仍会到上限，等五个小时窗口。账户页未打开。</span></div>
    <div class="timeline-item"><span class="timeline-time">03:56</span><span class="timeline-text">第二镜口播和字幕都指向草的颜色，口播还点了天空。左右田野对比可见，无色差读数。</span></div>
    <div class="timeline-item"><span class="timeline-time">04:15</span><span class="timeline-text">片尾字幕：离职业交付有距离；调色师价值在判断和整片统一。无新口播。</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>粗提示能否交付匹配</div>
      <div class="arrow">→</div>
      <div class="node node-green">证据<br/>只读连接 + 两轮画面</div>
      <div class="arrow">→</div>
      <div class="node">判断<br/>能动手，点名处没对齐</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>先读不改，再人工收口</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解</h3>
    <p>确认框出现，不等于调色已经完成。框里只说明 MCP 服务加到了 Claude Desktop 和 Codex，并要求重启。第一次真正执行的指令是「读取时间线，暂时不要修改任何内容」。把「已配置」读成「已交片」，和这条视频的顺序相反。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">协议清单和调色任务不是同一层</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>片头把 MCP 说成连接并执行操作的协议，卡片上的例子是分析项目、整理素材、调整设置、批量渲染。调色页上的实测是后加的问题：一级，以及镜头色彩匹配。</p>
      <div class="highlight">关键理解：工作流重复项被列成能力示例；调色被放进「做到什么程度」的测试，而不是那张四行卡片的第五行。</div>
      <div class="action">怎么用：接 MCP 时先写清任务属于「读项目 / 改设置 / 渲染」还是「在节点上改颜色」。不要用片头清单推断它会自动做匹配。</div>
      <div class="quote">依据：00:15–00:35 字幕。口播开头两句是乱码，不引用。</div>
    </div>
    <div class="card card-purple">
      <h3>作者立场</h3>
      <p>她把协议理解成「让 AI 直接操作达芬奇」。这是她的工作定义。视频没有展示权限范围、失败回滚或哪些面板不能被调用。</p>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">先读时间线，再允许改节点</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>Codex 的第一份回复是只读清单：版本 21.1.0.17，项目 21.1 X Codex，唯一时间线，3840×2160，25fps，55.96 秒，6 条视频、2 条音频，源素材 Online，并写明未修改内容。</p>
      <div class="relation">关系：只读成功，才能把后面的节点改动归因到下一条指令，而不是归因到「一连接就改片」。</div>
      <div class="action">怎么用：任何自动调色前，先要一份「未修改」的时间线回执，核对分辨率、帧率和片段数，再发改颜色的指令。</div>
      <div class="quote">依据：01:12 画面上的 Codex 回复。文件名在低码率下易错，不逐条当精确清单。</div>
    </div>
    <div class="card card-orange">
      <h3>避坑</h3>
      <p>模型菜单上的「Astra 轻度」被字幕说成更快、也更费 Token。这是作者预期。视频没有用量数字，不能把「轻度」理解成省用量。</p>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">一级和匹配都限制在她的节点树上</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>一级指令要求在已有节点树上操作。字幕说主要是三个节点、基础色轮。调色页能看到 pri、bal、sat 等缩写。匹配指令更窄：对象是已经做了 Rec.709 还原的选中片段，目标是右边已经 graded 的版本，仍然在现有节点树上。</p>
      <div class="highlight">关键理解：模型没有被要求从零建树。结果好坏同时取决于提示，和这棵树本来允不允许它动到天空、肤色、草地。</div>
      <div class="action">怎么用：把允许改的节点写进指令。参考画面放在右边并说清「向右匹配」，和她这条指令的结构一致。</div>
      <div class="quote">依据：01:20 前后字幕，以及 02:15 输入框里的 Rec.709 与 graded 字样。</div>
    </div>
    <div class="card card-purple">
      <h3>两句评价不要合成一句</h3>
      <p>红灯镜头的字幕是「没有强行色温中和」，画面也确实是红竖灯。另一句字幕说后面两个镜头的一级「不是那么好」。前者是操作事实，后者是口味。合成成「AI 会保护创作色温所以一级是好的」，视频没有这样说。</p>
    </div>
    <div class="card card-red">
      <h3>匹配失败被点名的地方</h3>
      <p>第一组人物外景：字幕点天空的蓝和肤色。第二组田野：口播点天空和草，03:56 字幕停在草。左右对比能看见右边的草更艳，没有仪器读数。</p>
      <div class="pitfall">不要把「出乎意料」写成匹配已经可用。那句口播的主语是「粗提示还能做到这样」，同一段口播马上说更细的描述可能会更好，第二镜则直接说不太好。</div>
    </div>
  </div>

  <div class="card">
    <h3>三种做法并排</h3>
    <table>
      <tr><th>做法</th><th>视频里的条件</th><th>作者给出的结果</th><th>证据强弱</th></tr>
      <tr><td>只读连接</td><td>先检查连接，禁止改内容</td><td>回报版本、分辨率、时长、在线状态</td><td>画面文字，强</td></tr>
      <tr><td>节点树上的一级</td><td>已有节点，基础色轮</td><td>草地有前后声明；红灯未被中和；后两镜她觉得不好</td><td>字幕 + 画面，中。前后幅度未量化</td></tr>
      <tr><td>向右参考的色彩匹配</td><td>Rec.709 还原之后，粗提示，分三次</td><td>天空、肤色、草被点名未对齐；风格离参考远</td><td>口播 + 字幕，中。无色差数值</td></tr>
      <tr><td>她说的手动版</td><td>要先跟右边参考的风格，再偏胶片曲线</td><td>被当成对照标准，本片没有把手动过程铺开</td><td>只有字幕标准，弱</td></tr>
    </table>
  </div>

  <div class="section">
    <h2 class="sec-title">用量中断是连续任务的边界</h2>
    <div class="card card-orange">
      <h3>在讲什么</h3>
      <p>作者说一个画面的匹配分三次才完成；她自称 ChatGPT Plus，中途仍到上限，要等五个小时窗口。片尾字幕把「Token 不够导致中断」和「离职业交付有距离」放在一起。</p>
      <div class="highlight">适用边界：五个小时、Plus 是否必然中断，都未在账户页核实，只能当她这次的经历。不能外推成所有 Codex 计划的配额。</div>
      <div class="quote">「Token 的限制还是会非常影响这种连续性任务的效率。」03:21 口播，作者观点。</div>
      <div class="pitfall">不要为了避开中断把一次匹配拆成无法复核的碎片，又不记录每次停在哪个节点。她的三次是事实陈述，视频没有展示三次各自改了什么。</div>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>MCP 在片头被定义成连接和执行；调色是随后的实测，不是卡片上的那四行。</li>
      <li>可靠的第一步是只读回执：版本、时间线、分辨率、未修改。</li>
      <li>一级和匹配都被限制在现成节点树和右侧参考上。点名失败的是天空、肤色、草。</li>
      <li>粗提示「有点出乎意料」和「第二镜不太好」同时成立，不能互相抵消。</li>
      <li>职业交付靠判断，是片尾字幕的立场，不是测量结论。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>配置后先重启助手，再发只读指令，核对 21.1 版本、帧率和片段数。</li>
      <li>改颜色前写明节点范围。她用的是已有树，不是新建树。</li>
      <li>参考放在右边，并写明素材已经做过 Rec.709 还原。</li>
      <li>验收单列天空、肤色、草地，不要只看整体「像不像」。</li>
      <li>长任务按节点分段，并记下每次中断点。五个小时窗口按她的说法预备，不写成平台规则。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>以前可能把「AI 已接入达芬奇」理解成调色步骤可以被勾掉。这条实测把接入、只读、一级、参考匹配拆开：接入只证明通道在，匹配是否成立要看作者点名的那些颜色有没有对齐，以及任务会不会在用量上被掐断。</p>
  </div>
  <div class="footer">来源：Vivi Lyn · 小红书 · 2026-10-17 · 口播空洞段以烧录字幕和调色页画面为据</div>
</div>
    </div>
  </foreignObject>
</svg>
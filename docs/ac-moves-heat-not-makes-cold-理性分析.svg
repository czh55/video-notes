.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>空调不制造冷气：热量搬运工</h1>
  <div class="meta"><span class="tag tag-blue">空调</span><span class="tag tag-green">热泵</span><span class="tag tag-orange">制冷循环</span><span class="tag tag-purple">能效</span><span class="tag tag-gray">时长 7分37秒</span><span class="tag tag-gray">理性分析 · 物理机制</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3vAs9Lz8v8i">原视频</a>
  <div class="summary-line">核心判断：空调通过蒸汽压缩循环搬运热量而非制造冷；压缩机把制冷剂温度拔高以便室外散热，电费支付的是搬运功，故 COP 可大于 1。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">蒸发吸热类比</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">蒸汽压缩循环</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">压缩升温到七八十度</span></div><div class="timeline-item"><span class="timeline-time">02:50</span><span class="timeline-text">节流后室内蒸发</span></div><div class="timeline-item"><span class="timeline-time">03:50</span><span class="timeline-text">定频vs变频</span></div><div class="timeline-item"><span class="timeline-time">06:20</span><span class="timeline-text">COP&gt;1与热泵</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">现象<br/>室内变凉</div><span class="arrow">→</span><div class="node-green">机制<br/>蒸发吸热</div><span class="arrow">→</span><div class="node-orange">引擎<br/>压缩抬温</div><span class="arrow">→</span><div class="node-blue">意义<br/>电=搬运费</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：空调制造冷气往外喷。纠偏：把热搬走，冷是相对结果。</p><p>误解：COP&gt;1 违反能量守恒。纠偏：搬的是空气里已有的热。</p><p>误解：除湿是另一套魔法。纠偏：蒸发器降温的冷凝水副产品。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：工程化的蒸发吸热</h3>
      <p>制冷剂室内蒸发抢热，室外冷凝放热。</p>
      <div class="quote">空调就是把这个现象工程化了</div>
      <div class="relation">洗澡发凉是同一物理。</div>
    </div>
    <div class="card card-green">
      <h3>关键理解：压缩机的资格证</h3>
      <p>先升温到比室外热，热才能流出。</p>
      <div class="quote">是先让热变得够资格被室外接收</div>
      <div class="relation">解释户外四十度仍能散热。</div>
    </div>
    <div class="card card-purple">
      <h3>怎么用：变频直觉</h3>
      <p>调速维持 vs 反复启停。</p>
      <div class="quote">定频是一脚油门踩到底再刹车</div>
      <div class="relation">体感稳、通常更省。</div>
    </div>
    <div class="card card-orange">
      <h3>能效叙事</h3>
      <p>一度电搬数度热；热泵制热同理反向。</p>
      <div class="quote">电只是搬运费</div>
      <div class="relation">对比电暖气 1:1。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">循环四步</h2><div class="card"><table><thead><tr><th>步骤</th><th>状态变化</th><th>热往哪</th></tr></thead><tbody><tr><td>压缩</td><td>低温低压气→高温高压气</td><td>能量输入（电）</td></tr><tr><td>冷凝</td><td>放热液化</td><td>热排到室外</td></tr><tr><td>节流</td><td>高压液→低压冷媒</td><td>温度骤降</td></tr><tr><td>蒸发</td><td>吸热气化</td><td>热从室内被吸走</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>参数如七八十度、3–5 倍为视频口述量级。</li><li>不涉及冷媒型号法规与安装规范。</li></ul><div class="pitfall">堵住室外机当「更凉快」。</div><div class="pitfall">把能效比当成可无限放大的魔法数字。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>不造冷，只搬热。</li><li>压缩为了能散热。</li><li>电费买搬运功。</li></ul><h3>行动清单</h3><ol><li>指认家中内外机对应冷凝/蒸发。</li><li>对比定频启停与变频体感。</li><li>制热季用热泵视角理解电费。</li></ol><h3>关键认知转变</h3><p>从「空调喷冷气」转向「热泵在搬热」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 7分37秒</div>
</div>
    </div>
  </foreignObject>
</svg>
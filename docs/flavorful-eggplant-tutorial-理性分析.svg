      <div class="container root-wrap"><h1>风味茄子：脆壳来自粉与油温</h1><div class="meta"><span class="tag tag-blue">茄子</span><span class="tag tag-green">玉米淀粉</span><span class="tag tag-orange">复炸</span><span class="tag tag-purple">酸甜汁</span><span class="tag tag-gray">时长 8分20秒</span><span class="tag tag-gray">理性分析 · 家常烹饪</span></div><a class="source-link" href="https://xhslink.cn/o/7bcXacSy7nP">原视频</a><div class="summary-line">核心判断：脆感=玉米淀粉壳+炸干水分+复炸；汁要稠、下锅后少翻，避免回软。</div><div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">去瓤切块</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">拍粉</span></div><div class="timeline-item"><span class="timeline-time">02:50</span><span class="timeline-text">调汁</span></div><div class="timeline-item"><span class="timeline-time">03:40</span><span class="timeline-text">六成油温</span></div><div class="timeline-item"><span class="timeline-time">05:50</span><span class="timeline-text">复炸</span></div><div class="timeline-item"><span class="timeline-time">06:40</span><span class="timeline-text">熬汁裹匀</span></div></div><div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>茄子软塌</div><span class="arrow">→</span><div class="node-green">证据<br/>粉壳/复炸</div><span class="arrow">→</span><div class="node-orange">判断<br/>油温与水分</div><span class="arrow">→</span><div class="node">行动<br/>跟清单做</div></div></div><div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR 鞋子→茄子；氧→瓤；斗粉→拍粉；橙醋→陈醋。</p></div><div class="section"><h2 class="sec-title">观点拆解</h2><div class="card card-purple"><h3>预处理</h3><p>去瓤减出水；菱形块易挂粉。</p><div class="quote">中间这瓤…要给它剔下来</div><div class="relation">口感从切配开始。</div></div><div class="card "><h3>玉米淀粉壳</h3><p>反复湿-粉到薄壳；拒土豆淀粉。</p><div class="quote">就是玉米淀粉</div><div class="relation">壳决定出锅脆度。</div></div><div class="card card-green"><h3>油温曲线</h3><p>约180℃定型，再抬温复炸。</p><div class="quote">六成油温才能下</div><div class="relation">沥粉防崩。</div></div><div class="card card-orange"><h3>汁与翻勺</h3><p>醋糖约1:1+蚝油；熬稠后少翻。</p><div class="quote">一二三就完事</div><div class="relation">防回软。</div></div></div><div class="section"><h2 class="sec-title">关键控制点</h2><div class="card"><table><thead><tr><th>点</th><th>要点</th></tr></thead><tbody><tr><td>粉</td><td>玉米淀粉反复拍</td></tr><tr><td>油温</td><td>六成≈180℃</td></tr><tr><td>水分</td><td>炸透再复炸</td></tr><tr><td>汁</td><td>稠了再下茄</td></tr></tbody></table></div></div><div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>重油炸菜，家庭注意排烟与安全。</li><li>口播温度口算仅供参考。</li></ul><div class="pitfall">粉未沥净崩油。</div><div class="pitfall">汁稀或翻太久回软。</div><div class="pitfall">用香菜叶影响卖相。</div></div></div><div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>粉壳+复炸=脆</li><li>汁稠少翻</li><li>错词已校正</li></ul><h3>行动清单</h3><ol><li>先练拍粉状态</li></ol><h3>关键认知转变</h3><p>从「猛炸一下」转向「控粉与油温曲线」。</p></div><div class="footer">双轨产物之二 · 理性分析 · 8分20秒</div></div>
    </div>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="5111" viewBox="0 0 1320 5111">
  <foreignObject x="0" y="0" width="1320" height="5111">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:24px;font-weight:700;color:#1e40af;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:18px;font-weight:700;color:#334155;margin-bottom:10px}
p,li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:8px}
ul{padding-left:22px}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}
.meta{margin:12px 0 16px}
.summary-line{font-size:17px;padding:18px 22px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-weight:700;color:#3b82f6;min-width:100px;font-variant-numeric:tabular-nums}
.diagram{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:16px 0}
.node{background:#eff6ff;border:2px solid #93c5fd;border-radius:14px;padding:14px 18px;font-weight:700;color:#1e40af;text-align:center;min-width:120px}
.node-green{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
.node-orange{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.arrow{color:#94a3b8;font-size:22px}
.card{background:#fff;border-radius:16px;padding:24px;margin:14px 0;border-left:5px solid #3b82f6;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card.card-purple{border-left-color:#8b5cf6}.card.card-orange{border-left-color:#f59e0b}.card.card-green{border-left-color:#10b981}.card.card-red{border-left-color:#ef4444}
.quote{background:#f8fafc;padding:12px 14px;border-radius:10px;margin:10px 0;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.highlight{background:#fef3c7;padding:12px 14px;border-radius:10px;margin:10px 0;color:#92400e;border-left:4px solid #f59e0b}
.pitfall{background:#fef2f2;padding:12px 14px;border-radius:10px;margin:10px 0;color:#991b1b;border-left:4px solid #ef4444}
.action{background:#eff6ff;padding:12px 14px;border-radius:10px;margin:10px 0;color:#1e40af;border-left:4px solid #3b82f6}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #e2e8f0;padding:10px 12px;text-align:left;vertical-align:top}th{background:#f8fafc;color:#1e40af}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:32px;margin-top:28px}
.conclusion h2,.conclusion h3{color:#fff;border:none;padding:0;margin:16px 0 10px}
.conclusion li,.conclusion p{color:rgba(255,255,255,.92)}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:24px 0}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:18px 22px;border-radius:12px;margin:16px 0}
.correction h3,.correction p{color:#92400e}</style>
      
<div class="container">
  <h1>修色翻车？先平衡饱和度栈</h1>
  <div class="meta">
    <span class="tag tag-blue">14分35秒</span>
    <span class="tag tag-green">分色饱和度</span>
    <span class="tag tag-orange">减法增暖</span>
    <span class="tag tag-purple">Luminar 演示</span>
  </div>
  <div class="summary-line">核心命题：好看的颜色不是「全部拉鲜」，而是给颜色排优先级，并在分色饱和度上做成对平衡——提暖往往要压冷；平衡必须用画面里真实存在的色，否则只是滑块假象。</div>

  <div class="timeline">
    <h3>证据时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00-02:30</span><span>目标：不准却不刺眼；偏好互补色对比</span></div>
    <div class="timeline-item"><span class="timeline-time">02:30-04:00</span><span>原则：待办优先级 + 颜色不孤立；拒全局饱和度</span></div>
    <div class="timeline-item"><span class="timeline-time">04:00-04:45</span><span>黄外套：分色提黄，色相略推橙</span></div>
    <div class="timeline-item"><span class="timeline-time">04:45-06:20</span><span>伊斯坦布尔：减蓝饱和增暖（减法）</span></div>
    <div class="timeline-item"><span class="timeline-time">06:20-08:10</span><span>三角形隐喻：饱和度栈勿倾倒；港湾提暖压冷</span></div>
    <div class="timeline-item"><span class="timeline-time">08:10-09:00</span><span>海岸：只拉暖色会脏，压绿/蓝对冲</span></div>
    <div class="timeline-item"><span class="timeline-time">09:00-13:00</span><span>Harris：禁假平衡（紫/品红）；压真实存在的绿</span></div>
    <div class="timeline-item"><span class="timeline-time">13:00-14:35</span><span>赞助：Mystical 10–15；一次买断定价观点</span></div>
  </div>

  <h2>核心脉络</h2>
  <div class="diagram">
    <div class="node">全局拉饱和</div><div class="arrow">→</div>
    <div class="node node-orange">分色+排优先级</div><div class="arrow">→</div>
    <div class="node">提暖 / 减冷成对</div><div class="arrow">→</div>
    <div class="node node-green">只用存在色平衡</div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>「画面偏冷 → 先加橙色/拉高白平衡」并非唯一路径；作者演示通过<strong>降低蓝色饱和</strong>让暖色相对更强。另一误解：把不存在的色通道拉到两端，滑块看起来对称，照片仍假——那是假平衡。</p>
  </div>

  <div class="card">
    <h3>观点卡 1 · 颜色像待办清单</h3>
    <p><strong>在讲什么：</strong>若所有颜色同等重要，注意力被均分，观感嘈杂。</p>
    <p><strong>关键理解：</strong>先决定谁是主角色（如黄外套、橙棚屋），再处理配角与背景色。</p>
    <div class="quote">「If everything is a priority, then nothing is a priority.」</div>
    <div class="action">怎么用：打开 HSL 前先口述「我要保住/推高哪 1–2 个色相」，其它色默认克制。</div>
  </div>

  <div class="card card-purple">
    <h3>观点卡 2 · 颜色不孤立 / 减法增暖</h3>
    <p><strong>在讲什么：</strong>去掉一种颜色，会抬高其它颜色的相对强度。</p>
    <p><strong>UP 主立场：</strong>摄影常更关乎减法而非加法；伊斯坦布尔例用减蓝替代加橙。</p>
    <div class="quote">「I've massively warmed up the image by removing some of the blue.」</div>
    <div class="action">怎么用：画面发冷时，先问「哪片冷色面积最大」，优先降其饱和或改色相，再考虑加暖。</div>
  </div>

  <div class="card card-green">
    <h3>观点卡 3 · 饱和度栈要平衡</h3>
    <p><strong>在讲什么：</strong>分色饱和度像压在支点上的一摞滑块，单向堆高会倾倒。</p>
    <p><strong>关键理解：</strong>蓝天日提橙黄时，同步压蓝青；亮度抢戏的小物件（救生圈）单独降亮度。</p>
    <div class="highlight">港湾前后对比：Orange/Yellow 上、Cyan/Blue 下，是成对动作，不是单边猛药。</div>
  </div>

  <div class="card card-orange">
    <h3>观点卡 4 · 只用「在场」的色去平衡</h3>
    <p><strong>在讲什么：</strong>Harris 例：压紫/品红可让栈「看起来」对称，但草地仍假。</p>
    <p><strong>关键理解：</strong>广泛存在的克制色（绿）会让被推高的色显得可信。</p>
    <div class="pitfall">避坑：不要为了滑块对称去动画面里几乎没有的色相通道。</div>
    <div class="action">怎么用：平衡前先扫一眼画面真实色相分布；对冲通道必须在画面中可指认。</div>
  </div>

  <div class="card">
    <h3>横向对比：四张样片的操作配方</h3>
    <table>
      <thead><tr><th>样片</th><th>主角色</th><th>关键动作</th><th>对冲/减法</th></tr></thead>
      <tbody>
        <tr><td>黄外套+地衣</td><td>黄/橙</td><td>提黄饱和；黄→橙色相</td><td>无大面积冷色，重点分色</td></tr>
        <tr><td>伊斯坦布尔码头</td><td>暖肤/建筑</td><td>少做加法</td><td>降蓝饱和，蓝→青</td></tr>
        <tr><td>港湾小船</td><td>橙黄网具/石墙</td><td>提橙黄</td><td>压青蓝；降救生圈亮度</td></tr>
        <tr><td>Harris 棚屋</td><td>橙棚屋+黄地貌</td><td>黄拉满并推橙</td><td>压绿（真）；勿压紫品红（假）</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-red">
    <h3>方法边界</h3>
    <ul>
      <li><strong>事实：</strong>分色 HSL 可独立改变某色相的饱和/色相/亮度；全局饱和度同时抬高所有色。</li>
      <li><strong>观点：</strong>互补色偏好、故意夸张演示强度、Mystical 10–15、买断价优于订阅——均属作者口味与赞助语境。</li>
      <li><strong>推断：</strong>「减蓝增暖」在大面积蓝色主导时更有效；人像肤色场景需另测，本片以风光为主。</li>
      <li><strong>上限：</strong>工具演示在 Luminar；原则可迁移到 Lightroom/Camera Raw 的 HSL，但界面数值不可照抄。</li>
    </ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>颜色要排优先级，拒绝全局一刀切饱和度。</li>
      <li>颜色互相牵连：减一个色 = 相对增强其它色。</li>
      <li>提暖与压冷成对进行，维持饱和度栈平衡。</li>
      <li>平衡通道必须在画面中真实存在。</li>
    </ul>
    <h3>行动清单</h3>
    <ul>
      <li>调色前写下 1–2 个主角色。</li>
      <li>发冷先找最大面积冷色，尝试减饱和再决定是否加暖。</li>
      <li>每提高一组暖色，立刻找冷色/杂色做对冲。</li>
      <li>检查「被你拉低的通道」是否真的出现在画面里。</li>
      <li>对比时看相对关系，而不是单边绝对值。</li>
    </ul>
    <h3>关键认知转变</h3>
    <ul>
      <li>以前：偏冷就加橙 / 不够鲜就拉全局饱和 → 现在：先减对立色、分色平衡。</li>
      <li>以前：滑块对称 = 调好了 → 现在：在场色的相对可信度才算数。</li>
      <li>以前：颜色是孤立滑块 → 现在：颜色是一张互相抢注意力的待办清单。</li>
    </ul>
  </div>
  <div class="footer">基于视频口播与画面操作整理 · 区分事实 / 观点 / 推断 · 非软件官方教程</div>
</div>
    </div>
  </foreignObject>
</svg>
<div class="container">
  <h1>剧本评估三问：动机·冲突·主题</h1>
  <div><span class="tag">小红书</span><span class="tag">2分28秒</span><span class="tag">编剧</span></div>
  <p class="summary-line">合格剧本不看设定够不够炸，而看三点是否成立：人物有主动欲望、冲突能持续推动选择、主题藏在命运里。AI 时代画面变便宜，剧本判断能力反而更稀缺。</p>
  <div class="card"><h3>时间结构</h3><table><tr><th>时段</th><th>要点</th></tr><tr><td>00:00–00:37</td><td>先别问创意：问有没有观众缘</td></tr><tr><td>00:37–01:15</td><td>标准一：人物动机 Character Motivation</td></tr><tr><td>01:15–01:33</td><td>标准二：冲突要有持续推动力</td></tr><tr><td>01:33–02:12</td><td>标准三：主题藏在故事里（及 AIGC 启示）</td></tr><tr><td>02:12–02:28</td><td>合格标准：人物·冲突·主题共推不可替代故事</td></tr></table></div>
  <div class="card">
    <h3>行动清单</h3>
    <div class="action">1. 写完先问观众缘，再谈设定新不新 → 2. 做「去掉主角故事还成立吗」测试 → 3. 把冲突从单次事件改成持续选择题 → 4. 写出表层情节 vs 深层主题对照句 → 5. AIGC 先过剧本判断再堆画面</div>
    <div class="pitfall">忌：只炫设定/世界观/反转；忌：人物当工具人；忌：冲突只有一件大事；忌：主题口号化直说；忌：有画面没戏剧</div>
  </div>
  <div class="conclusion"><h2>结论</h2><p>合格剧本不是想法够大，而是人物、冲突、主题共同推动一个不可替代的故事；画面会变便宜，判断力更稀缺。</p></div>
  <p class="footer">来源：小红书 · 电影问答室belli · 2026-10-31</p>
</div>

      <div class="container root-wrap">
  <h1>如何看懂这个设计</h1>
  <div class="meta"><span class="tag tag-blue">海报</span><span class="tag tag-green">可读性</span><span class="tag tag-orange">对称</span><span class="tag tag-purple">字体</span><span class="tag tag-red">Oliver Laric</span><span class="tag tag-gray">时长 1分31秒</span><span class="tag tag-gray">理性分析 · 设计阅读</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3ffdENx9kyB">原视频</a>
  <div class="summary-line">核心判断：X Museum 这张 Oliver Laric 海报好看，是因为字体切割、古典母题（螺旋柱）、对称骨架与雕像角标共同制造了「可读的秩序」——看似随意，实则多层对齐。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">好坏海报对比</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">字体古典感与平整切割</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">扭形灵感来自螺旋柱</span></div><div class="timeline-item"><span class="timeline-time">00:46</span><span class="timeline-text">中心对称传达古典</span></div><div class="timeline-item"><span class="timeline-time">00:54</span><span class="timeline-text">雕像左下角小标</span></div><div class="timeline-item"><span class="timeline-time">01:01</span><span class="timeline-text">去掉角标秩序塌陷</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">随意选择下的隐藏考量</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>为何一张更舒服</div><span class="arrow">→</span><div class="node-green">证据<br/>字/形/对称/角标</div><span class="arrow">→</span><div class="node-orange">判断<br/>秩序制造可读</div><span class="arrow">→</span><div class="node-blue">行动<br/>用四层清单读海报</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：好看靠感觉碰运气。纠偏：每层都有可指出的结构决策。</p><p>误解：角标只是编号装饰。纠偏：它同时把不规则图形规则化。</p><p>误解：对称=呆板。纠偏：在古典主题里，对称本身就是语义。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-blue">
      <h3>在讲什么：把海报当图纸读</h3>
      <p>从字体（平整切割/高贵感）到母题（螺旋柱）再到版式对称，逐层打开。</p>
      <div class="quote">一切看着都随意选择。</div>
      <div class="relation">理解：随意是伪装，秩序是骨架。</div>
    </div>
    <div class="card card-green">
      <h3>怎么用：四问检查表</h3>
      <p>①字形切割是否干净？②有无古典母题呼应？③是否对称稳定？④细节标注有无规则化功能？</p>
      <div class="quote">让不够规则的图形变得规则。</div>
      <div class="relation">行动：改图时先加「规则化锚点」。</div>
    </div>
    <div class="card card-orange">
      <h3>分类说明</h3>
      <p>内容为展览海报设计阅读，非汽车；primary归painting。</p>
      <div class="quote">实际上里面有着非常多隐藏的考量。</div>
      <div class="relation">作者：日月z。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">可读性层次</h2><div class="card"><table><thead><tr><th>层次</th><th>视频抓手</th><th>作用</th></tr></thead><tbody><tr><td>字体</td><td>平整光滑切割、古典字形</td><td>高贵/清晰</td></tr><tr><td>母题</td><td>螺旋柱扭形</td><td>古典联想</td></tr><tr><td>版式</td><td>中心对称</td><td>稳定古典语义</td></tr><tr><td>微交互</td><td>雕像角标</td><td>编号+规则化</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>案例分析单张海报，结论不宜泛化到所有展览视觉。</li><li>开场对比另一张「不舒服」海报细节未完整展开。</li></ul><div class="pitfall">只抄元素不抄对齐关系。</div><div class="pitfall">删掉「无用」角标导致散架。</div><div class="pitfall">用非对称硬套古典主题。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>可读性来自多层秩序。</li><li>角标可以是结构构件。</li><li>古典感可被字体与对称同时编码。</li></ul><h3>行动清单</h3><ol><li>读海报时画对称轴与编号网格。</li><li>改图做一次「去掉角标」对照。</li><li>字体优先检查笔画像切割质量。</li></ol><h3>关键认知转变</h3><p>从「好不好看」转向「秩序是否可读」。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分31秒</div>
</div>
    </div>
  </foreignObject>
</svg>
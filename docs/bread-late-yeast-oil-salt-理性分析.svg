<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1236" viewBox="0 0 1320 1236">
  <foreignObject x="0" y="0" width="1320" height="1236">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;padding:48px 60px;color:#1e293b}h1{font-size:32px;font-weight:900;color:#1e40af;margin-bottom:8px}p{font-size:16px;line-height:1.8;color:#475569}table{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f1f5f9;color:#1e40af}</style>
      <h1>后加是为了错开三件事</h1><table><tr><th>方法</th><th>晚加的原因</th><th>图上的场合</th></tr><tr><td>后酵母</td><td>推迟发酵</td><td>高于 28℃、揉面很久</td></tr><tr><td>后油</td><td>油脂会妨碍吸水</td><td>油脂超过面粉 5%</td></tr><tr><td>后盐</td><td>盐会提前收紧面筋</td><td>高水量、长发酵</td></tr></table><p>作者正文把盐和面粉一起先揉，和图表的后盐不是同一条顺序。选定一套再做。</p>
    </div>
  </foreignObject>

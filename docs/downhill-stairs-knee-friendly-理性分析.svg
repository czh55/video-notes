.conclusion h2,.conclusion h3{color:#fff;border:none;padding:0}
.conclusion li{color:rgba(255,255,255,.92)}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:24px 0}</style>
      
<div class="container">
<h1>下山台阶：三种下法怎么选</h1>
<div><span class="tag">2分44秒</span><span class="tag">GluG咕噜</span><span class="tag">膝盖友好</span></div>
<div class="summary-line">核心判断：飞蹦与直腿打桩把冲击和刚性承重压在膝盖上；大众选手应改用髋膝弯曲、有弹性的减震轻巧下法——慢一点也划算。</div>

<div class="timeline">
  <h3>关键证据时间轴</h3>
  <div class="timeline-item"><span class="timeline-time">00:02</span><span>错误示范开场：「好多人是这样下」</span></div>
  <div class="timeline-item"><span class="timeline-time">00:22</span><span>重点1：不要飞台阶</span></div>
  <div class="timeline-item"><span class="timeline-time">00:45</span><span>重点2：不要直腿下台阶</span></div>
  <div class="timeline-item"><span class="timeline-time">01:00</span><span>重点3：膝盖弯曲有弹性</span></div>
  <div class="timeline-item"><span class="timeline-time">01:45</span><span>命名正确方案：减震轻巧下法</span></div>
  <div class="timeline-item"><span class="timeline-time">02:40</span><span>收束：大众选手适合弹性轻巧下法</span></div>
</div>

<div class="diagram">
  <div class="node node-bad">飞蹦台阶</div>
  <div class="arrow">✕</div>
  <div class="node node-bad">直腿打桩</div>
  <div class="arrow">→</div>
  <div class="node node-good">屈膝弹性减震</div>
</div>

<div class="card">
  <h3>在讲什么 → 关键理解 → 怎么用</h3>
  <p>视频把下山台阶拆成「冲击源」问题：飞蹦每次落地硬砸膝盖；直腿把体重刚性传到关节；正确解是髋膝弯曲、像弹簧一样吸收冲击。</p>
  <div class="quote">口播依据极弱（Whisper 几乎失效）；主要依据屏幕「重点1/2/3」与笔记三种姿势对照。</div>
  <div class="action">怎么用：拍侧身下山视频，看是否离地蹦、是否锁膝、落地时膝是否有缓冲弯曲。</div>
  <div class="pitfall">避坑：别把「演示偏慢」当成无效；作者明确提醒不要嫌慢。</div>
</div>

<div class="card card-purple">
  <h3>三种姿势对照</h3>
  <table>
    <tr><th>姿势</th><th>画面/笔记描述</th><th>对膝盖</th><th>适用判断</th></tr>
    <tr><td>飞蹦台阶</td><td>双脚离地往下蹦</td><td>落地硬冲击；易崴脚</td><td>大众勿用</td></tr>
    <tr><td>直腿打桩</td><td>膝不打弯，像打桩</td><td>体重压关节，生硬</td><td>长距离下山忌用</td></tr>
    <tr><td>弹性减震</td><td>髋膝弯曲，有弹性</td><td>减震轻巧、更友好</td><td>推荐默认</td></tr>
  </table>
</div>

<div class="card card-orange">
  <h3>立场分层与方法边界</h3>
  <p><strong>可验证事实：</strong>屏幕出现三条重点字与「减震轻巧下法」推荐字幕。</p>
  <p><strong>UP 主观点：</strong>大众水平选手不应飞台阶；弹性轻巧下法更安全经济。</p>
  <p><strong>推断（片中未给数值）：</strong>屈膝角度、步频、护膝是否必需——视频未量化，不能当成处方。</p>
  <p><strong>边界：</strong>结论面向业余登山/公园台阶场景；竞技越野或特殊地形未讨论。</p>
</div>

<div class="conclusion">
  <h2>总结与行动</h2>
  <h3>核心要点</h3>
  <ul>
    <li>飞蹦 = 冲击；直腿 = 刚性承重；两者都对膝盖不友好。</li>
    <li>默认改用髋膝弯曲的减震轻巧下法。</li>
    <li>看起来快不等于更划算——慢而可控优先。</li>
  </ul>
  <h3>行动清单</h3>
  <ul>
    <li>下次下山刻意禁止双脚同时离地蹦阶。</li>
    <li>落脚时检查前膝是否有缓冲弯曲，避免锁死。</li>
    <li>长距离下山（如数百米落差）优先弹性下法，不要用打桩式硬撑。</li>
    <li>侧拍 10 秒对照三条禁令自检。</li>
  </ul>
  <h3>认知转变</h3>
  <ul>
    <li>以前：下台阶越快越好 → 现在：冲击管理优先于速度。</li>
    <li>以前：腿伸直省事 → 现在：屈膝是减震，不是拖沓。</li>
  </ul>
</div>
<div class="footer">依据画面字幕与笔记文案；ASR 仅开场一句可用。非医疗建议。</div>
</div>


      <div class="container">
  <h1>色彩理论教程</h1>
  <div class="meta">
    <span class="tag tag-blue">调色</span>
    <span class="tag tag-orange">画面演示</span>
    <span class="tag tag-gray">8秒</span>
    <span class="tag tag-purple">Angel</span>
  </div>
  <div class="summary-line">口播不可用，依画面。八秒停在一张绿丝带对照：绿勾一侧暗部偏青，黑叉一侧只把同一绿色压暗。底部句子把这件事叫作暗部带动色相偏移，并说能使色彩更加通透。</div>
  <a class="source-link" href="https://xhslink.cn/o/9Qzw5phJtQ8">来源：小红书短链 9Qzw5phJtQ8</a>

  <div class="timeline">
    <h3>关键画面时间轴</h3>
    <div class="timeline-item"><span class="timeline-time">00:00–00:04</span><span class="timeline-text">对照已经完整：左绿勾、右黑叉，丝带下各有色环和方框。顶部是「色彩理论」。</span></div>
    <div class="timeline-item"><span class="timeline-time">00:04–00:08</span><span class="timeline-text">图形不换。底部两行一直是「暗部带动色相偏移」「能使色彩更加通透」。</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">同一条绿色丝带</div>
      <div class="arrow">→</div>
      <div class="node node-green">暗部离开绿色、偏青</div>
      <div class="arrow">→</div>
      <div class="node node-orange">画面称这样更通透</div>
    </div>
    <p>叉号一侧是反例：色环停在绿色，方框里的点往下走，暗部仍是更深的绿。勾号一侧是正例：色环靠向青蓝，暗部跟着偏青。结论句写在画面底部，不是口播。</p>
  </div>

  <div class="correction">
    <h3>常见误解</h3>
    <p>不要把这张图读成「任何颜色的暗部都应该加蓝」。画面只演示了绿色丝带。也不要把底部的「通透」当成可测量的参数，图上没有直方图，也没有数值。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">对照在讲什么</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>同一形状、同一底色，暗部有两种画法。依画面，差别在色相有没有离开绿色。</p>
      <h3>关键理解</h3>
      <p>勾号一侧亮处黄绿、暗处青绿。叉号一侧暗处只是更暗的绿。色环用来说明取色点有没有换色相，方框用来说明明暗有没有单独往下拉。</p>
      <h3>怎么用</h3>
      <div class="action">画绿色物体的暗部时，先看取色点是停在绿色往下拉，还是同时往青蓝挪。这条片子把后一种标成勾。</div>
      <div class="quote">画面原句：暗部带动色相偏移。能使色彩更加通透。</div>
    </div>
    <div class="card card-purple">
      <h3>这是画面上的立场</h3>
      <p>「能使色彩更加通透」是图上的判断，作者署名 Angel。视频没有拿出对照照片或读数来证明通透。可以把它当成这条示意图的主张，不能当成对所有绿色的测量结论。</p>
    </div>
    <div class="card card-orange">
      <h3>不要做的事</h3>
      <div class="pitfall">不要把叉号一侧的「只压暗」理解成绝对错误的物理阴影。图上只是用黑叉表示作者不推荐这种画法。</div>
      <div class="pitfall">不要把 Whisper 的英文报头「MING PAO CANADA MING PAO TORONTO」写进口播。画面上没有这串字。</div>
    </div>
  </div>

  <div class="card">
    <h3>两种取色</h3>
    <table>
      <tr><th>画面标记</th><th>丝带暗部</th><th>色环与方框</th><th>适用边界</th></tr>
      <tr><td>绿勾</td><td>暗处偏青，离开正绿</td><td>色环靠向青蓝，方框里的点斜向暗处</td><td>只在这条绿色丝带上看得见</td></tr>
      <tr><td>黑叉</td><td>暗处仍是更深的绿</td><td>色环停在绿色，方框里的点几乎竖直往下</td><td>图上标为不推荐，没有给出数值差</td></tr>
    </table>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <p>依画面，八秒只做一件对照：绿色丝带的暗部，偏青被标成勾，只压暗被标成叉。底部用「色相偏移」和「通透」收束。</p>
    <h3>行动清单</h3>
    <ul>
      <li>画绿色暗部时，单独看取色点有没有离开绿色。</li>
      <li>先画一版只压明度，再画一版暗部偏青，对照是否还像同一块绿。</li>
      <li>把「通透」当作这条图的说法，换别的色相时重新看画面，不要直接套青。</li>
    </ul>
    <h3>关键认知转变</h3>
    <p>暗部不一定只是同一颜色变暗。在这张图里，作者要暗部带着色相一起走，并且只拿绿色丝带做了示范。</p>
  </div>
  <p class="footer">依据本地画面与 Whisper 分段。识别文本未采用。未重新访问小红书。</p>
</div>
    </div>
  </foreignObject>
</svg>